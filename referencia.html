<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Referência — Teias de Anansi</title><link rel="stylesheet" href="site-light.css"><style>body{max-width:900px;margin:auto;padding:24px;line-height:1.55}.box{border:1px solid #9996;border-radius:12px;padding:18px;margin-top:20px}.muted{opacity:.7}.badge{display:inline-block;border:1px solid #9996;border-radius:999px;padding:3px 9px;font-size:.85rem}</style></head>
<body><p><a href="bibliotecas.html">← Bibliotecas</a></p><main id="app"><p>Carregando referência...</p></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const id=new URLSearchParams(location.search).get('id');const app=document.getElementById('app');if(!id){app.innerHTML='<h1>Referência</h1><p>ID não informado.</p>';return}try{const r=await fetch('dados/referencias-hub-index.json',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();const x=(d.entidades||[]).find(e=>e.id===id);if(!x){app.innerHTML='<h1>Referência não encontrada</h1>';return}document.title=`${x.nome} — Teias de Anansi`;const moduloPublico=x.modulo==='Espécies'?'Raça':x.modulo;const urlPublica=x.modulo==='Espécies'?'raca.html':x.url;const alvo=urlPublica&&urlPublica!=='referencia.html'?`<p><a href="${esc(urlPublica)}?ref=${encodeURIComponent(x.id)}">Abrir no módulo ${esc(moduloPublico)} →</a></p>`:'';app.innerHTML=`<h1>${esc(x.nome)}</h1><p><span class="badge">${esc(moduloPublico)}</span> <span class="badge">${esc(x.status)}</span></p><div class="box">${x.status==='pendente'?'<p><strong>Entidade criada como referência pendente.</strong> O conceito foi detectado na Biblioteca, mas ainda não possui conteúdo próprio consolidado.</p>':'<p>Entidade indexada na Biblioteca.</p>'}${alvo}<p class="muted"><b>ID:</b> ${esc(x.id)}</p></div>`}catch(e){app.innerHTML=`<h1>Falha</h1><p>${esc(e.message)}</p>`}})();
</script></body></html>
