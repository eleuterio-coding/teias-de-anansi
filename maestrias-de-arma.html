<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Maestrias de Arma - Biblioteca - Teias de Anansi</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--b:#8885;--soft:#8881}
    *{box-sizing:border-box}body{max-width:1160px;margin:auto;padding:24px;line-height:1.55}a{color:inherit}.muted{opacity:.74}
    .nota{padding:12px 14px;border:1px dashed #8888;border-radius:10px;margin:14px 0}.warning{font-weight:650}
    .badges,.meta,.chips{display:flex;gap:7px 14px;flex-wrap:wrap}.badge,.chip{display:inline-block;border:1px solid var(--b);border-radius:999px;padding:3px 9px;font-size:.82rem}
    .controles{display:grid;grid-template-columns:minmax(260px,1fr) 220px 220px;gap:10px;margin:18px 0}
    input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid #8887;border-radius:8px;background:transparent;color:inherit}
    .item,.painel{border:1px solid var(--b);border-radius:11px;margin:10px 0;overflow:hidden}.item summary,.painel summary{cursor:pointer;padding:14px 16px}.item summary{display:flex;justify-content:space-between;gap:12px;align-items:center}.item summary:hover,.painel summary:hover{background:var(--soft)}
    .corpo{padding:0 16px 16px}.mecanica{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px;margin:14px 0}
    .campo{border:1px solid #8884;border-radius:8px;padding:9px 10px}.campo b,.campo span{display:block}.campo span{margin-top:2px}
    .sec{border-top:1px solid #8883;margin-top:14px;padding-top:12px}.meta{font-size:.9rem;opacity:.8}.origem-demo{border-style:dashed}.vazio{opacity:.7}
    .variant{border-left:3px solid #8887;padding-left:12px;margin:10px 0}.resultado{margin:8px 0 14px;opacity:.75}
    @media(max-width:760px){body{padding:16px}.controles{grid-template-columns:1fr}.item summary{display:block}.badge{margin-top:6px}}
  </style>
</head>
<body>
  <p><a href="bibliotecas.html?v=20260819-1224">← Bibliotecas</a></p>
  <header>
    <h1>Maestrias de Arma</h1>
  </header>

  <div class="controles">
    <input id="busca" type="search" placeholder="Buscar maestria, efeito, arma ou fonte...">
    <select id="origem"><option value="">Todas as origens</option><option value="oficial_aberta">Oficial aberta</option><option value="terceiros_demo">Demonstrativa</option></select>
    <select id="filtro"><option value="">Todas as maestrias</option></select>
  </div>
  <div id="resultado" class="resultado"></div>
  <main id="lista"></main>

<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const labelCampo=k=>String(k).replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
let DATA=null,ALL=[];

function descricao(x){return x.conteudo?.descricao || x.conteudo?.descricao_resumida || ''}
function badge(x){return x.classificacao?.origem==='oficial_aberta'?'Oficial · 5.5e':'Demo · não canônico'}
function armas(x){
  const grupos=x.armas_associadas||{}, parts=[];
  for(const [k,arr] of Object.entries(grupos)){
    if(!arr?.length) continue;
    const titulo=k==='srd_5_2_1'?'SRD 5.2.1':k.replaceAll('_',' ');
    parts.push(`<div><strong>${esc(titulo)}:</strong><div class="chips">${arr.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</div></div>`);
  }
  return parts.join('') || '<p class="vazio">Nenhuma arma da amostra foi vinculada explicitamente a esta propriedade.</p>';
}
function variantes(x){
  const vs=x.variantes_encontradas||[];
  if(!vs.length) return '';
  return `<div class="sec"><h3>Variante encontrada em pdf24_merged-1.pdf</h3>${vs.map(v=>`<div class="variant"><span class="badge">demonstrativa · não canônica</span><p>${esc(v.descricao_resumida)}</p><div class="meta"><span><b>Arquivo:</b> ${esc(v.arquivo)}</span><span><b>Página da fonte:</b> ${esc(v.pagina_fonte)}</span></div></div>`).join('')}</div>`;
}
function fonte(x){
  const f=x.fonte||{};
  return `<div class="meta"><span><b>Tipo:</b> Maestrias de Arma</span><span><b>Livro/Fonte:</b> ${esc(f.titulo)}</span>${f.arquivo?`<span><b>PDF:</b> ${esc(f.arquivo)}</span>`:''}${f.pagina||f.pagina_fonte?`<span><b>Página:</b> ${esc(f.pagina||f.pagina_fonte)}</span>`:''}<span><b>Status:</b> ${x.controle?.canonico?'canônico':'demonstrativo / não canonizar'}</span></div>`;
}
function render(){
  const q=norm(document.getElementById('busca').value.trim()),o=document.getElementById('origem').value,f=document.getElementById('filtro').value;
  const rows=ALL.filter(x=>{
    const texto=norm([x.nome,descricao(x),Object.values(x.mecanica||{}).join(' '),JSON.stringify(x.armas_associadas||{}),x.fonte?.titulo,x.fonte?.arquivo,(x.variantes_encontradas||[]).map(v=>v.descricao_resumida).join(' ')].join(' '));
    return(!o||x.classificacao?.origem===o)&&(!f||x.nome===f)&&(!q||texto.includes(q));
  });
  document.getElementById('resultado').textContent=`${rows.length} de ${ALL.length} maestrias`;
  document.getElementById('lista').innerHTML=rows.map(x=>`
    <details class="item ${x.classificacao?.origem==='terceiros_demo'?'origem-demo':''}">
      <summary><strong>${esc(x.nome)}</strong><span class="badge">${esc(badge(x))}</span></summary>
      <div class="corpo">
        <p>${esc(descricao(x))}</p>
        <div class="mecanica">${Object.entries(x.mecanica||{}).map(([k,v])=>`<div class="campo"><b>${esc(labelCampo(k))}</b><span>${esc(v)}</span></div>`).join('')}</div>
        ${x.controle?.aviso?`<div class="nota warning">${esc(x.controle.aviso)}</div>`:''}
        <div class="sec"><h3>Armas e aplicações encontradas</h3>${armas(x)}</div>
        ${variantes(x)}
        <div class="sec">${fonte(x)}</div>
      </div>
    </details>`).join('') || '<p class="nota">Nenhuma maestria corresponde aos filtros.</p>';
}
(async()=>{
  try{
    const r=await fetch('dados/maestrias-de-arma-pdfs.json?v=20260819-1224',{cache:'no-store'});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    DATA=await r.json();ALL=DATA.itens||[];
    if(ALL.length!==15) throw new Error(`catálogo incompleto: ${ALL.length}/15`);
    document.getElementById('filtro').innerHTML='<option value="">Todas as maestrias</option>'+ALL.map(x=>`<option>${esc(x.nome)}</option>`).join('');
    render();
  }catch(e){
    document.getElementById('resultado').textContent=`Falha ao carregar: ${e.message}`;
  }
})();
['busca','origem','filtro'].forEach(id=>document.getElementById(id).addEventListener(id==='busca'?'input':'change',render));
</script>
<style id="hub-force-light-theme">

html body * {
  background: #ffffff !important;

</style>
</body>
</html>
