<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Maestrias de Arma - Teias de Anansi</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { max-width: 1050px; margin: 0 auto; padding: 24px; line-height: 1.55; }
    a { color: inherit; }
    .resumo, .meta, .original { opacity: .76; }
    .nota { padding: 12px 14px; border: 1px dashed #8888; border-radius: 10px; margin: 14px 0; }
    .controles { display: grid; grid-template-columns: minmax(240px,1fr) minmax(180px,260px) minmax(210px,300px); gap: 10px; margin: 18px 0 10px; }
    input, select { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border: 1px solid #8887; border-radius: 8px; background: transparent; color: inherit; }
    .resultado { margin: 8px 0 16px; opacity: .75; }
    .item, .referencia, .demo { border: 1px solid #8885; border-radius: 10px; overflow: hidden; margin: 10px 0; }
    .item summary, .referencia summary, .demo summary { cursor: pointer; padding: 14px 16px; }
    .item summary:hover, .referencia summary:hover, .demo summary:hover { background: #8881; }
    .item summary { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
    .nome { min-width: 0; }
    .original { font-weight: 400; font-size: .86rem; margin-left: 8px; }
    .badge { font-size: .82rem; padding: 2px 8px; border: 1px solid #8887; border-radius: 999px; white-space: nowrap; }
    .corpo { padding: 0 16px 16px; }
    .campos { list-style: none; padding: 0; margin: 10px 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .campos li { border: 1px solid #8886; border-radius: 999px; padding: 5px 10px; }
    .campos li.maestria { font-weight: 700; }
    .meta { border-top: 1px solid #8883; margin-top: 12px; padding-top: 10px; font-size: .9rem; display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .grade-ref { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 10px; margin: 12px 0 20px; }
    .ref-card { border: 1px solid #8885; border-radius: 10px; padding: 12px 14px; }
    .ref-card h3 { margin: 0 0 6px; font-size: 1rem; }
    .ref-card p { margin: 0; }
    .demo-lista { display: flex; flex-wrap: wrap; gap: 7px; padding: 0; list-style: none; }
    .demo-lista li { border: 1px dashed #8888; border-radius: 999px; padding: 4px 9px; }
    .erro { padding: 16px; border: 1px solid #b55; border-radius: 10px; }
    @media (max-width: 800px) {
      body { padding: 16px; }
      .controles { grid-template-columns: 1fr; }
      .item summary { display: block; }
      .badge { display: inline-block; margin-top: 6px; }
    }
  </style>
</head>
<body>
  <p><a href="bibliotecas.html?v=20260819-1100">← Bibliotecas</a></p>
  <header>
    <h1>Maestrias de Arma</h1>
    <p class="resumo" id="resumo">Carregando catálogo...</p>
  </header>

  <main id="app"></main>

<script>
const esc = (v='') => String(v)
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'",'&#039;');

const semAcento = (v='') => String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

async function iniciar() {
  const app = document.getElementById('app');
  const resumo = document.getElementById('resumo');

  try {
    const resposta = await fetch('dados/maestrias-de-arma-pdfs.json?v=20260819-1100', { cache: 'no-store' });
    if (!resposta.ok) throw new Error(`HTTP ${resposta.status}`);
    const dados = await resposta.json();
    const itens = dados.itens || [];
    const oficiais = itens.filter(i => i.status === 'vigente_mais_recente');
    const opcionais = itens.filter(i => i.status === 'complemento_opcional');

    resumo.textContent = `${itens.length} itens publicados: ${oficiais.length} armas da revisão de 2024 e ${opcionais.length} focos arcanos opcionais.`;

    const categorias = [...new Set(itens.map(i => i.categoria))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
    const maestrias = [...new Set(itens.map(i => i.maestria))].sort((a,b)=>a.localeCompare(b,'pt-BR'));

    app.innerHTML = `
      <div class="nota">
        <strong>Organização:</strong> o item principal é a arma ou foco. Dentro dele aparecem, separadamente, todas as propriedades relevantes e a Maestria de Arma, seguindo o padrão já adotado pelo módulo. Em sobreposição, a revisão de 2024 tem precedência.
      </div>

      <details class="referencia">
        <summary><strong>Referência das 8 Maestrias oficiais de 2024</strong></summary>
        <div class="corpo">
          <div class="grade-ref">
            ${(dados.maestrias_oficiais || []).map(m => `
              <article class="ref-card">
                <h3>${esc(m.nome)}</h3>
                <p>${esc(m.descricao)}</p>
              </article>
            `).join('')}
          </div>
        </div>
      </details>

      <div class="controles">
        <input id="busca" type="search" placeholder="Buscar arma, propriedade ou maestria..." autocomplete="off">
        <select id="maestria">
          <option value="">Todas as maestrias</option>
          ${maestrias.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('')}
        </select>
        <select id="categoria">
          <option value="">Todas as categorias</option>
          ${categorias.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
        </select>
      </div>
      <div class="resultado" id="resultado"></div>
      <section id="lista"></section>

      ${dados.conteudo_nao_canonizado ? `
        <details class="demo">
          <summary><strong>Conteúdo encontrado no PDF, mas não canonizado</strong></summary>
          <div class="corpo">
            <p>O conjunto demonstrativo de <strong>${esc(dados.conteudo_nao_canonizado.fonte)}</strong> foi identificado em <strong>${esc(dados.conteudo_nao_canonizado.arquivo)}</strong>, mas não foi misturado às armas ativas porque o índice de curadoria do projeto o classifica como <strong>não canonizar</strong>.</p>
            <p>${esc(dados.conteudo_nao_canonizado.motivo)}</p>
            <ul class="demo-lista">
              ${(dados.conteudo_nao_canonizado.maestrias_encontradas || []).map(m => `<li>${esc(m)}</li>`).join('')}
            </ul>
          </div>
        </details>
      ` : ''}
    `;

    const busca = document.getElementById('busca');
    const filtroMaestria = document.getElementById('maestria');
    const filtroCategoria = document.getElementById('categoria');
    const resultado = document.getElementById('resultado');
    const lista = document.getElementById('lista');

    function render() {
      const termo = semAcento(busca.value.trim());
      const filtrados = itens.filter(i => {
        const texto = semAcento(`${i.nome} ${i.nome_original || ''} ${i.categoria} ${(i.campos || []).join(' ')} ${i.maestria} ${i.fonte}`);
        return (!termo || texto.includes(termo)) &&
          (!filtroMaestria.value || i.maestria === filtroMaestria.value) &&
          (!filtroCategoria.value || i.categoria === filtroCategoria.value);
      });

      resultado.textContent = `${filtrados.length} de ${itens.length} itens`;
      lista.innerHTML = filtrados.length ? filtrados.map(i => `
        <details class="item">
          <summary>
            <span class="nome"><strong>${esc(i.nome)}</strong>${i.nome_original && i.nome_original !== i.nome ? `<span class="original">${esc(i.nome_original)}</span>` : ''}</span>
            <span class="badge">${esc(i.maestria)}</span>
          </summary>
          <div class="corpo">
            <ul class="campos">
              ${(i.campos || []).map(c => `<li class="${c === i.maestria ? 'maestria' : ''}">${esc(c)}</li>`).join('')}
            </ul>
            ${i.observacao ? `<p>${esc(i.observacao)}</p>` : ''}
            <div class="meta">
              <span><strong>Categoria:</strong> ${esc(i.categoria)}</span>
              <span><strong>Livro:</strong> ${esc(i.fonte)}</span>
              <span><strong>PDF:</strong> ${esc(i.arquivo)}</span>
              ${i.status === 'complemento_opcional' ? '<span><strong>Status:</strong> regra opcional</span>' : '<span><strong>Status:</strong> vigente 2024</span>'}
            </div>
          </div>
        </details>
      `).join('') : '<p class="nota">Nenhum item corresponde aos filtros selecionados.</p>';
    }

    busca.addEventListener('input', render);
    filtroMaestria.addEventListener('change', render);
    filtroCategoria.addEventListener('change', render);
    render();
  } catch (erro) {
    resumo.textContent = 'Não foi possível carregar o catálogo.';
    app.innerHTML = `<p class="erro">Falha ao carregar os dados de Maestrias de Arma: ${esc(erro.message)}</p>`;
  }
}

iniciar();
</script>
</body>
</html>
