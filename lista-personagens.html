<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Lista de Personagens - Teias de Anansi</title><style>:root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--b:#8885;--soft:#f5f5f5}*{box-sizing:border-box}body{max-width:1050px;margin:auto;padding:24px;line-height:1.5;background:#fff;color:#000}a{color:inherit}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.muted{opacity:.68}.list{display:grid;gap:10px;margin:18px 0}.pc{border:1px solid var(--b);border-radius:12px;padding:14px;display:flex;justify-content:space-between;gap:16px;align-items:center}.pc h2{font-size:1.08rem;margin:0 0 4px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{display:inline-block;border:1px solid #8887;border-radius:8px;padding:8px 10px;text-decoration:none;background:#fff;cursor:pointer;font:inherit}.btn:hover{background:var(--soft)}.primary{background:#111;color:#fff;border-color:#111}.danger{border-color:#b44}.empty{border:1px dashed #8888;border-radius:10px;padding:18px;margin-top:18px}@media(max-width:650px){body{padding:16px}.pc{align-items:flex-start;flex-direction:column}}</style></head><body>
<p><a href="personagens.html">← Personagens</a></p><div class="top"><header><h1>Lista de Personagens</h1><p class="muted">Abra a ficha digital para jogar ou edite o personagem no construtor.</p></header><a class="btn" href="criacao-personagem.html?v=20260821-character-builder11">Criar personagem</a></div><main id="lista" class="controles"></main>
<script>(()=>{const KEYS=['hub-rpg:characters:v4','hub-rpg:characters:v3','hub-rpg:characters:v2','hub-rpg:characters:v1'],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function read(){for(const key of KEYS)try{const d=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(d)&&d.length)return d}catch{}return[]}function render(){const items=read().sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))),el=document.getElementById('lista');if(!items.length){el.innerHTML='<div class="empty">Nenhum personagem salvo ainda. Use <strong>Criar personagem</strong> para iniciar.</div>';return}el.innerHTML=`<div class="list">${items.map(c=>{const s=c.refSnapshots||{},sub=[s.class?.name,c.choices?.class?.level?`nível ${c.choices.class.level}`:null,s.subclass?.name,s.species?.name,s.background?.name].filter(Boolean).join(' · ');return`<article class="pc"><div><h2>${esc(c.name||'Personagem sem nome')}</h2><div class="muted">${esc(sub||'Referências ainda não definidas')}</div></div><div class="actions"><a class="btn primary" href="ficha-personagem.html?v=20260823-character-sheet3&id=${encodeURIComponent(c.id)}">Ficha</a><a class="btn" href="criacao-personagem.html?v=20260821-character-builder11&id=${encodeURIComponent(c.id)}">Editar</a><button class="btn danger" data-delete="${esc(c.id)}" type="button">Excluir</button></div></article>`}).join('')}</div>`;el.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{if(!confirm('Excluir este personagem deste navegador?'))return;const all=read().filter(c=>c.id!==b.dataset.delete);localStorage.setItem(KEYS[0],JSON.stringify(all));render()}))}render()})();</script></body></html>
