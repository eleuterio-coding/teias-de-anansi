<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Jogadores - Teias de Anansi</title><link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin><link rel="preconnect" href="https://firestore.googleapis.com" crossorigin><link rel="stylesheet" href="collaboration.css?v=20260909-player-access2"><link rel="stylesheet" href="hub-ux.css?v=20260909-perf1"></head><body>
<header class="top"><div><p class="mini">Hub de RPG</p><h1>Jogadores</h1></div><a class="btn secondary" href="index.html?v=20260909-perf1">Início</a></header>
<main id="main-content">
<div id="collab-feedback" class="status" role="status" aria-live="polite" hidden></div>
<div id="provider-status" class="status" role="status" aria-live="polite">Verificando acesso...</div>
<section id="account-card" class="card" hidden><div class="top"><div><h2>Conta</h2><div id="account-state" class="muted">Não conectado.</div></div><button id="sign-out" type="button" class="secondary" hidden>Sair</button></div><form id="login-form" class="form-grid" autocomplete="on"><label>Usuário<input id="login-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label><label>Senha<input id="login-password" type="password" autocomplete="current-password" required></label><div class="wide actions"><button id="sign-in" type="submit">Entrar</button></div></form></section>
<div id="online-tools" hidden>
<section class="card"><div class="top"><h2>Sincronização</h2><button id="sync-all" type="button">Sincronizar agora</button></div><div id="sync-state" class="mini" role="status" aria-live="polite"></div></section>
<section class="card"><h2>Minhas Mesas</h2><div id="membership-list" class="list"></div></section>
<section id="master-publish-tools" class="card" hidden><h2>Publicar / sincronizar Mesa</h2><div class="form-grid"><label class="wide">Mesa local<select id="publish-campaign"></select></label><div class="wide actions"><button id="publish-campaign-button" type="button">Publicar / atualizar Mesa</button></div></div></section>
</div>
<section id="membership-tools" class="card" hidden><h2>Acessos dos jogadores</h2><div class="grid"><div><h3>Jogadores</h3><div id="known-user-list" class="list"></div></div><div><h3>Atribuir acesso</h3><form id="membership-form" class="form-grid"><label>Jogador<input id="membership-user" type="text" list="known-user-options" autocomplete="off" autocapitalize="none" spellcheck="false" required><datalist id="known-user-options"></datalist></label><label>Campanha<select id="membership-campaign"></select></label><label class="wide">Personagem atribuído<select id="membership-character"><option value="">— Sem personagem —</option></select></label><label class="wide">Sessões<select id="membership-sessions" multiple size="6"></select></label><label class="wide">Aventuras<select id="membership-adventures" multiple size="6"></select></label><div class="wide actions"><button type="submit">Salvar acessos</button></div></form></div></div></section>
</main><script type="module" src="scripts/hub-ux.js?v=20260909-perf1"></script><script type="module" src="scripts/collaboration-ui.js?v=20260909-player-access2"></script></body></html>
