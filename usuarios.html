<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Usuários e Colaboração - Teias de Anansi</title><link rel="stylesheet" href="collaboration.css?v=20260904-collab3"><link rel="stylesheet" href="hub-ux.css?v=20260901-ux-final1"></head><body>
<header class="top"><div><p class="mini">Hub de RPG</p><h1>Usuários e Colaboração</h1></div><a class="btn secondary" href="index.html">Início</a></header>
<main id="main-content">
<div id="collab-feedback" class="status" role="status" aria-live="polite" hidden></div>
<div id="provider-status" class="status" role="status" aria-live="polite">Verificando acesso...</div>
<section id="account-card" class="card" hidden><div class="top"><div><h2>Conta</h2><div id="account-state" class="muted">Não conectado.</div></div><button id="sign-out" type="button" class="secondary" hidden>Sair</button></div><form id="login-form" class="form-grid" autocomplete="on"><label>Usuário<input id="login-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label><label>Senha<input id="login-password" type="password" autocomplete="current-password" required></label><div class="wide actions"><button id="sign-in" type="submit">Entrar</button></div></form></section>
<div id="online-tools" hidden>
<section class="card"><div class="top"><h2>Sincronização</h2><button id="sync-all" type="button">Sincronizar agora</button></div><div id="sync-state" class="mini" role="status" aria-live="polite"></div></section>
<section class="card"><h2>Minhas Mesas</h2><div id="membership-list" class="list"></div></section>
<section id="master-publish-tools" class="card" hidden><h2>Publicar / sincronizar Mesa</h2><div class="form-grid"><label class="wide">Mesa local<select id="publish-campaign"></select></label><div class="wide actions"><button id="publish-campaign-button" type="button">Publicar / atualizar Mesa</button></div></div></section>
</div>
<section id="membership-tools" class="card" hidden><h2>Participantes das Mesas</h2><div class="grid"><div><h3>Usuários</h3><div id="known-user-list" class="list"></div></div><div><h3>Vincular à Mesa</h3><form id="membership-form" class="form-grid"><label>Usuário<select id="membership-user"></select></label><label>Mesa<select id="membership-campaign"></select></label><label>Papel<select id="membership-role"><option value="player">Jogador</option><option value="observer">Observador</option><option value="dm">Mestre</option></select></label><label>Personagem atribuído<select id="membership-character"><option value="">— Sem personagem —</option></select></label><div class="wide actions"><button type="submit">Salvar vínculo</button></div></form></div></div></section>
</main><script type="module" src="scripts/hub-ux.js?v=20260901-ux-final1"></script><script type="module" src="scripts/collaboration-ui.js?v=20260908-ui-copy1"></script></body></html>
