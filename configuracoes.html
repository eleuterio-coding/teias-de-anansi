<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Configurações - Teias de Anansi</title>
<link rel="stylesheet" href="hub-ux.css?v=20261022-settings-unified1">
<link rel="stylesheet" href="settings.css?v=20261022-settings-unified1">
</head>
<body class="hub-settings-page">
<main id="main-content" class="settings-page">
<header class="settings-hero"><div><p class="eyebrow">Preferências de interface</p><h1>Configurações</h1><p class="settings-intro">Ajuste a leitura e o movimento da interface do Hub.</p></div></header>
<section class="card settings-preferences" aria-labelledby="settings-accessibility-title">
  <header class="settings-section-header"><h2 id="settings-accessibility-title">Acessibilidade</h2><p>Preferências visuais aplicadas em todas as áreas.</p></header>
  <div class="settings-fields">
  <label for="font-scale">Tamanho do texto<select id="font-scale"><option value="normal">Normal</option><option value="large">Grande</option><option value="xlarge">Extra grande</option></select></label>
  <label for="motion">Movimento<select id="motion"><option value="system">Sistema</option><option value="reduce">Reduzir animações</option></select></label>
  </div>
</section>
<section class="settings-actions" aria-label="Ações das configurações"><div class="actions"><button id="save-settings" type="button">Salvar configurações</button><button id="reset-settings" class="secondary" type="button">Restaurar padrões</button></div><span id="settings-status" class="status-inline" role="status" aria-live="polite"></span></section>
</main>
<script type="module" src="scripts/hub-ux.js?v=20261022-quota-publish2"></script>
<script type="module" src="scripts/settings-ui.js?v=20261022-settings-unified1"></script>
</body>
</html>
