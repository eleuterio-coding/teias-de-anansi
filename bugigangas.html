<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bugigangas - Biblioteca - Teias de Anansi</title>
<link rel="stylesheet" href="biblioteca-light.css?v=20261104">
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:#fff;color:#17202a;max-width:1100px;margin:0 auto;padding:24px}
a{color:inherit}.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:18px 0}
.bugiganga{border:1px solid #d6dde5;border-radius:10px;padding:15px 16px;background:#fff}
.bugiganga h2{font-size:.95rem;color:#5b6570;margin:0 0 8px}.bugiganga p{margin:0;line-height:1.5}
.resultado{font-size:.85rem;color:#697581}@media(max-width:700px){body{padding:14px}}
</style></head><body>
<p><a href="bibliotecas.html">← Bibliotecas</a></p><h1>Bugigangas</h1>
<p id="resultado" class="resultado">Carregando...</p><main id="lista" class="grade"></main>
<script>
'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('dados/bugigangas-pdfs.json?v=20261104',{cache:'no-store'})
.then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()})
.then(data=>{
  document.getElementById('resultado').textContent=data.itens.length+' resultados';
  document.getElementById('lista').innerHTML=data.itens.map(x=>'<article class="bugiganga"><h2>Resultado '+esc(x.rolagem)+'</h2><p>'+esc(x.descricao)+'</p></article>').join('');
}).catch(e=>document.getElementById('resultado').textContent='Falha ao carregar Bugigangas: '+e.message);
</script><script type="module" src="scripts/hub-ux.js?v=20261028-library-hub-layout1"></script>
</body></html>
