name: Apply Montarias Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-montarias-cleanup.yml'

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Remove transversal rules and bump cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('montarias-veiculos.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('  <section class="regras">')
          end = s.find('  <main id="lista"></main>', start)
          if start == -1 or end == -1:
              raise RuntimeError('Bloco Regras transversais preservadas não localizado.')
          s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')

          idx = Path('bibliotecas.html')
          t = idx.read_text(encoding='utf-8')
          t, n = re.subn(r'montarias-veiculos\.html\?v=[^\"]+', 'montarias-veiculos.html?v=20260821-1003', t, count=1)
          if n != 1:
              raise RuntimeError('Link de Montarias e Veículos não localizado no índice.')
          idx.write_text(t, encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-montarias-cleanup.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- montarias-veiculos.html bibliotecas.html .github/workflows/apply-montarias-cleanup.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Remove regras transversais de Montarias e Veículos'
          git push origin HEAD:main

      - name: Redeploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
