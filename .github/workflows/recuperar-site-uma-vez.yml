name: Etapa 3.09 - recuperacao unica do site via A+B com gates
on:
  push:
    branches:
      - feature/etapa-3-usuarios-acesso-20261120
    paths:
      - .github/workflows/recuperar-site-uma-vez.yml
permissions:
  actions: write
  contents: read
concurrency:
  group: recuperacao-site-309-unica
  cancel-in-progress: false
jobs:
  recuperar:
    name: Conferir Pages, preflight e CI antes de iniciar A+B
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Inspecionar Pages, comprovar preflight e CI, executar A+B somente se seguro
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const repo = 'eleuterio-coding/teias-de-anansi';
          const base = 'https://api.github.com/repos/' + repo;
          const token = process.env.GH_TOKEN;
          const sha = process.env.CANDIDATE_SHA;
          const branch = 'feature/etapa-3-usuarios-acesso-20261120';
          const expectedMain = '31b7513a470631d842b679fb77d748df0fcd02d2';
          const headers = {
            authorization: 'Bearer ' + token,
            accept: 'application/vnd.github+json',
            'x-github-api-version': '2022-11-28',
          };
          const delay = ms => new Promise(ok => setTimeout(ok, ms));
          async function api(path, options = {}) {
            const resp = await fetch(base + path, {
              method: options.method ?? 'GET',
              headers: options.body ? { ...headers, 'content-type': 'application/json' } : headers,
              body: options.body ? JSON.stringify(options.body) : undefined,
              signal: AbortSignal.timeout(20000),
            });
            if (!resp.ok) throw Error('GitHub API ' + path + ' HTTP ' + resp.status);
            return resp.status === 204 ? null : resp.json();
          }
          const page = await api('/pages');
          assert.equal(page.html_url, 'https://eleuterio-coding.github.io/teias-de-anansi/');
          console.log('RESTAURACAO_PAGES_STATUS', JSON.stringify({
            source: page.build_type, url: page.html_url, state: page.status,
          }));
          if (page.build_type !== 'workflow') {
            console.log('BLOQUEIO_SOURCE_LEGACY: alterar Settings > Pages > Source para GitHub Actions. Nenhuma escrita A+B ocorreu.');
            process.exit(2);
          }
          const main = await api('/commits/main');
          assert.equal(main.sha, expectedMain, 'main mudou inesperadamente');
          const current = await api('/commits/' + branch);
          assert.equal(current.sha, sha, 'candidate branch mudou');
          for (const name of ['publicar-etapa-3-manual.yml','verificar-pages-preflight-manual.yml']) {
            const f = await api('/contents/.github/workflows/' + name + '?ref=main');
            assert.equal(f.type, 'file');
          }
          console.log('RESTAURACAO_GATES: main e candidate congeladas; dois workflows existentes');
          async function latest(workflow, event) {
            const q = new URLSearchParams({ branch: event === 'push' ? branch : 'main', event, per_page: '25' });
            const obj = await api('/actions/workflows/' + workflow + '/runs?' + q);
            return obj.workflow_runs ?? [];
          }
          async function waitForRun(workflow, originalMaxId, head, limitMs) {
            const deadline = Date.now() + limitMs;
            let id = null;
            while (Date.now() < deadline) {
              const list = await latest(workflow, 'workflow_dispatch');
              const found = list.find(x => x.id > originalMaxId && x.head_sha === head);
              if (found) {
                id = found.id;
                if (found.status === 'completed') {
                  console.log('RESTAURACAO_RUN_RESULT', JSON.stringify({
                    workflow,id,conclusion:found.conclusion,url:found.html_url,
                  }));
                  assert.equal(found.conclusion, 'success', workflow + ' nao passou');
                  return found;
                }
              }
              await delay(12000);
            }
            throw Error('Timeout aguardando ' + workflow + ' id=' + id);
          }
          const preName = 'verificar-pages-preflight-manual.yml';
          const preOld = await latest(preName,'workflow_dispatch');
          const prev = Math.max(0,...preOld.map(x=>x.id));
          await api('/actions/workflows/' + preName + '/dispatches',{
            method:'POST',body:{ref:'main'}
          });
          console.log('RESTAURACAO_PREFLIGHT_DISPARADO: GET/OIDC, sem escrita');
          await waitForRun(preName,prev,expectedMain,240000);
          const checks = 'verify-etapa-3.yml';
          let passed = false;
          for (let i=0;i<65;i++) {
            const ciRuns = await latest(checks,'push');
            const run = ciRuns.find(x=>x.head_sha===sha);
            if (run?.status==='completed') {
              console.log('RESTAURACAO_CI',JSON.stringify({id:run.id,conclusion:run.conclusion,url:run.html_url}));
              assert.equal(run.conclusion,'success','CI do SHA candidato falhou');
              passed=true;
              break;
            }
            await delay(10000);
          }
          assert.ok(passed,'CI do candidato nao foi comprovada');
          const stillMain = await api('/commits/main');
          const stillCandidate = await api('/commits/' + branch);
          assert.equal(stillMain.sha,expectedMain,'main mudou depois dos testes');
          assert.equal(stillCandidate.sha,sha,'candidate mudou depois dos testes');
          const stillPage=await api('/pages');
          assert.equal(stillPage.build_type,'workflow','Pages deixou de usar GitHub Actions');
          const pubName = 'publicar-etapa-3-manual.yml';
          const old = await latest(pubName,'workflow_dispatch');
          const max = Math.max(0,...old.map(x=>x.id));
          await api('/actions/workflows/' + pubName + '/dispatches',{
            method:'POST',
            body:{ref:'main',inputs:{
              confirmacao:'PUBLICAR_A_E_B',
              candidate_sha:sha,
              escopo_etapa3:'ESCOPO_ACESSO_DOCUMENTADO'
            }}
          });
          console.log('RESTAURACAO_PUBLICACAO_AB_DISPARADA',JSON.stringify({sha,workflow:pubName}));
          await waitForRun(pubName,max,expectedMain,2650000);
          const site=await fetch('https://eleuterio-coding.github.io/teias-de-anansi/',{
            method:'GET',signal:AbortSignal.timeout(20000),
          });
          assert.ok(site.ok,'Site nao retorna HTTP OK apos A+B, status '+site.status);
          const html=await site.text();
          assert.ok(html.includes('<html') || html.includes('<!DOCTYPE html'));
          console.log('RESTAURACAO_FINAL_SUCESSO',JSON.stringify({http:site.status,url:site.url}));
          NODE
