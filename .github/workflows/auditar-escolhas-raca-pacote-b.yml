name: Auditar escolhas raciais, pacotes e PO

on:
  pull_request:
    paths:
      - 'scripts/character-builder/species-selection-refinement-ui.js'
      - 'scripts/character-builder/package-b-purchase-ui.js'
      - 'scripts/character-builder/wealth-purchase-ui.js'
      - 'scripts/character-builder/starting-equipment-rules.js'
      - 'scripts/character-builder/starting-equipment-ui.js'
      - 'scripts/character-builder/origin-feat-sync.js'
      - 'scripts/character-builder/skilled-feat-ui.js'
      - 'scripts/character-sheet-feat-ui.js'
      - 'scripts/character-builder.js'
      - '.github/workflows/auditar-escolhas-raca-pacote-b.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/character-builder/species-selection-refinement-ui.js'
      - 'scripts/character-builder/package-b-purchase-ui.js'
      - 'scripts/character-builder/wealth-purchase-ui.js'
      - 'scripts/character-builder/starting-equipment-rules.js'
      - 'scripts/character-builder/starting-equipment-ui.js'
      - 'scripts/character-builder/origin-feat-sync.js'
      - 'scripts/character-builder/skilled-feat-ui.js'
      - 'scripts/character-sheet-feat-ui.js'
      - 'scripts/character-builder.js'
      - '.github/workflows/auditar-escolhas-raca-pacote-b.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check scripts/character-builder/species-selection-refinement-ui.js
          node --check scripts/character-builder/package-b-purchase-ui.js
          node --check scripts/character-builder/wealth-purchase-ui.js
          node --check scripts/character-builder/starting-equipment-rules.js
          node --check scripts/character-builder/starting-equipment-ui.js
          node --check scripts/character-builder/origin-feat-sync.js
          node --check scripts/character-builder/skilled-feat-ui.js
          node --check scripts/character-sheet-feat-ui.js
          node --check scripts/character-builder.js
      - name: Testar pacotes, moedas e Riqueza por Level
        run: |
          node --input-type=module <<'JS'
          import{STANDARD_PACKAGE_B_GP,backgroundPackageOptions,packageCurrencyCp,packagePhysicalItems,creationBudgetCp,creationPhysicalItems,formatPhysicalItems}from'./scripts/character-builder/starting-equipment-rules.js';
          const noble={name:'Nobre',equipmentOptions:[],equipmentText:'Conjunto de Jogo escolhido, roupas finas, perfume e 29 PO'};
          const packages=backgroundPackageOptions(noble);
          if(packages.length!==2||packages[0].id!=='A'||packages[1].id!=='B')throw new Error('Nível 1 deve oferecer Pacotes A e B.');
          if(STANDARD_PACKAGE_B_GP!==75||packageCurrencyCp(noble,'B')!==7500)throw new Error('Pacote B deve ser 75 PO para todos os antecedentes.');
          if(packageCurrencyCp(noble,'A')!==2900)throw new Error('Os 29 PO do Nobre devem ser separados do equipamento físico.');
          const physical=formatPhysicalItems(packagePhysicalItems(noble,'A'));
          if(!physical.includes('Conjunto de Jogo escolhido')||!physical.includes('perfume')||/29 PO/.test(physical))throw new Error(`Equipamento físico do Nobre incorreto: ${physical}`);
          if(creationBudgetCp(noble,'A',1)!==2900)throw new Error('Pacote A do Nobre deve liberar 29 PO para compras no nível 1.');
          if(creationBudgetCp(noble,'B',1)!==7500)throw new Error('Pacote B deve liberar 75 PO para compras no nível 1.');
          if(creationBudgetCp(noble,'A',3)!==32500||creationBudgetCp(noble,'B',3)!==32500)throw new Error('No nível 3 o total deve ser exatamente 325 PO, sem somar moedas de pacote.');
          if(creationPhysicalItems(noble,'A',3).length)throw new Error('Acima do nível 1, Pacote A/B não deve conceder equipamento inicial adicional.');
          console.log('Pacotes e PO validados: Nobre A=29 PO, B=75 PO, nível 3=325 PO.');
          JS
      - name: Testar estado do Skilled
        run: |
          node --input-type=module <<'JS'
          import{setSkilledDraftRow,skilledRowComplete}from'./scripts/character-builder/skilled-feat-ui.js';
          let rows=[];
          rows=setSkilledDraftRow(rows,0,'skill','Acrobacia');
          if(!skilledRowComplete(rows[0])||rows[0].value!=='Acrobacia')throw new Error('Skilled deve aceitar uma perícia específica diretamente.');
          rows=setSkilledDraftRow(rows,1,'tool','Ferramentas de Ladrão');
          if(!skilledRowComplete(rows[1])||rows[1].value!=='Ferramentas de Ladrão')throw new Error('Skilled deve continuar aceitando uma ferramenta específica.');
          console.log('Estado de escolhas do Skilled validado.');
          JS
      - name: Testar opções de tamanho e identificação de seletores genéricos
        run: |
          node --input-type=module <<'JS'
          import{speciesSizeOptions,genericLineageTraitNames}from'./scripts/character-builder/species-selection-refinement-ui.js';
          const tiefling={name:'Tiefling',sizes:['Choose a size when you select this species.'],lineageLabel:'Legado Tiefling'};
          const sizes=speciesSizeOptions(tiefling);
          if(JSON.stringify(sizes)!==JSON.stringify(['Small','Medium']))throw new Error(`Tiefling deve oferecer Pequeno/Médio: ${JSON.stringify(sizes)}`);
          const flexible=speciesSizeOptions({name:'Teste',sizes:['Large','Small','Medium']});
          if(JSON.stringify(flexible)!==JSON.stringify(['Small','Medium','Large']))throw new Error(`Tamanhos flexíveis não foram normalizados: ${JSON.stringify(flexible)}`);
          const tieflingGeneric=genericLineageTraitNames(tiefling,{name:'Infernal',replaceTraitNames:['Fiendish Legacy']});
          if(!tieflingGeneric.has('fiendish legacy')||!tieflingGeneric.has('legado infero'))throw new Error('Legado genérico do Tiefling não será ocultado após a escolha.');
          const elfGeneric=genericLineageTraitNames({name:'Elfo',lineageLabel:'Linhagem Élfica'},{name:'Drow'});
          if(!elfGeneric.has('elven lineage')||!elfGeneric.has('linhagem elfica'))throw new Error('Situação equivalente de linhagem élfica não foi reconhecida.');
          console.log('Escolhas raciais refinadas validadas.');
          JS
      - name: Verificar integração de compras, Ficha Virtual e Skilled
        run: |
          python - <<'PY'
          from pathlib import Path
          builder=Path('scripts/character-builder.js').read_text(encoding='utf-8')
          package=Path('scripts/character-builder/package-b-purchase-ui.js').read_text(encoding='utf-8')
          wealth=Path('scripts/character-builder/wealth-purchase-ui.js').read_text(encoding='utf-8')
          equipment=Path('scripts/character-builder/starting-equipment-ui.js').read_text(encoding='utf-8')
          rules=Path('scripts/character-builder/starting-equipment-rules.js').read_text(encoding='utf-8')
          origin=Path('scripts/character-builder/origin-feat-sync.js').read_text(encoding='utf-8')
          feats=Path('scripts/character-builder/feat-mechanics.js').read_text(encoding='utf-8')
          skilled=Path('scripts/character-builder/skilled-feat-ui.js').read_text(encoding='utf-8')
          sheet=Path('scripts/character-sheet-feat-ui.js').read_text(encoding='utf-8')
          race=Path('scripts/character-builder/species-selection-refinement-ui.js').read_text(encoding='utf-8')
          assert 'package-b-purchase-ui.js' in builder
          assert 'wealth-by-level3' in package
          assert 'skilled-direct2' in package
          assert 'initStartingEquipmentUi' in package and 'initOriginFeatSync' in package and 'initSkilledFeatUi' in package
          assert 'STANDARD_PACKAGE_B_GP=75' in rules
          assert 'creationBudgetCp' in wealth
          assert 'Moedas do pacote inicial' not in wealth
          assert 'PO restantes' not in wealth
          assert 'PO disponíveis' in wealth
          assert 'Gasto em compras' in wealth
          assert 'Equipamento do antecedente —' in equipment
          assert 'Pacote A · equipamento do antecedente' in equipment
          assert 'Pacote B · 75 PO' in equipment
          assert 'creationPhysicalItems' in sheet and 'formatPhysicalItems' in sheet
          assert 'originFeat' in origin and 'data-feat-mechanics-controls' in origin
          assert "'Skilled':{choices:[{id:'proficiencies',type:'skill_or_tool_multi',count:3" in feats
          assert 'Escolha uma perícia ou ferramenta' in skilled
          assert '<optgroup label="Perícias">' in skilled
          assert "'Ferramenta…'" in skilled
          assert 'data-skilled-direct' in skilled and 'data-skilled-tool' in skilled
          assert 'data-feat-mixed="type"' not in skilled
          joined='\n'.join([builder,package,wealth,equipment,rules,origin,feats,skilled,sheet,race])
          assert 'supabase' not in joined.lower()
          print('Compras, Pacotes A/B, Ficha Virtual e Skilled com escolha direta validados.')
          PY
