name: Auditar escolhas raciais, pacotes e PO

on:
  pull_request:
    paths:
      - 'scripts/character-builder/species-selection-refinement-ui.js'
      - 'scripts/character-builder/package-b-purchase-ui.js'
      - 'scripts/character-builder/wealth-purchase-ui.js'
      - 'scripts/character-builder/starting-equipment-rules.js'
      - 'scripts/character-builder/starting-equipment-ui.js'
      - 'scripts/character-builder/equipment-ownership.js'
      - 'scripts/character-builder/origin-feat-sync.js'
      - 'scripts/character-builder/skilled-feat-ui.js'
      - 'scripts/character-sheet-feat-ui.js'
      - 'scripts/character-builder.js'
      - 'tests/auditar-riqueza-criacao.mjs'
      - 'tests/auditar-criacao-sem-travamento.mjs'
      - 'tests/auditar-cobertura-total-criacao.mjs'
      - '.github/workflows/auditar-escolhas-raca-pacote-b.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/character-builder/species-selection-refinement-ui.js'
      - 'scripts/character-builder/package-b-purchase-ui.js'
      - 'scripts/character-builder/wealth-purchase-ui.js'
      - 'scripts/character-builder/starting-equipment-rules.js'
      - 'scripts/character-builder/starting-equipment-ui.js'
      - 'scripts/character-builder/equipment-ownership.js'
      - 'scripts/character-builder/origin-feat-sync.js'
      - 'scripts/character-builder/skilled-feat-ui.js'
      - 'scripts/character-sheet-feat-ui.js'
      - 'scripts/character-builder.js'
      - 'tests/auditar-riqueza-criacao.mjs'
      - 'tests/auditar-criacao-sem-travamento.mjs'
      - 'tests/auditar-cobertura-total-criacao.mjs'
      - '.github/workflows/auditar-escolhas-raca-pacote-b.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do fluxo de criação e compras
        run: |
          node --check scripts/character-builder/species-selection-refinement-ui.js
          node --check scripts/character-builder/package-b-purchase-ui.js
          node --check scripts/character-builder/wealth-purchase-ui.js
          node --check scripts/character-builder/starting-equipment-rules.js
          node --check scripts/character-builder/starting-equipment-ui.js
          node --check scripts/character-builder/equipment-ownership.js
          node --check scripts/character-builder/origin-feat-sync.js
          node --check scripts/character-builder/skilled-feat-ui.js
          node --check scripts/character-sheet-feat-ui.js
          node --check scripts/character-builder.js
      - name: Validar riqueza, pacotes e persistência
        run: |
          node tests/auditar-riqueza-criacao.mjs
          node tests/auditar-criacao-sem-travamento.mjs
      - name: Validar cobertura fail-closed das interações
        run: node tests/auditar-cobertura-total-criacao.mjs
      - name: Validar revisão canônica da cadeia de compras
        run: |
          python - <<'PY'
          from pathlib import Path
          REV='20260831-tasha-metamagic1'
          builder=Path('scripts/character-builder.js').read_text(encoding='utf-8')
          package=Path('scripts/character-builder/package-b-purchase-ui.js').read_text(encoding='utf-8')
          assert f'package-b-purchase-ui.js?v={REV}' in builder
          for module in ['wealth-purchase-ui.js','starting-equipment-ui.js','origin-feat-sync.js','skilled-feat-ui.js']:
              assert f'{module}?v={REV}' in package, f'Revisão divergente em {module}'
          joined=builder+'\n'+package
          assert 'supabase' not in joined.lower()
          print('Pacotes, PO e cadeia de compras validados na revisão canônica.')
          PY
