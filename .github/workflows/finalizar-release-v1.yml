name: Finalizar release v1.0.0

on:
  workflow_run:
    workflows: ["Homologar Firebase real v1"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: finalizar-release-v1
  cancel-in-progress: false

jobs:
  finalizar:
    name: Aceitar Bloco 18 e publicar v1.0.0
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FIREBASE_RUN_ID: ${{ github.event.workflow_run.id }}
      FIREBASE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout da main homologada
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Garantir que a main não mudou depois da homologação Firebase
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" != "$FIREBASE_HEAD_SHA" ]; then
            echo "::error::A main mudou após a homologação Firebase. Esperado $FIREBASE_HEAD_SHA, atual $CURRENT_SHA. Rode novamente Homologar Firebase real v1 sobre a main atual."
            exit 1
          fi
          if git rev-parse -q --verify refs/tags/v1.0.0 >/dev/null; then
            echo "::error::A tag v1.0.0 já existe. O finalizador não sobrescreve releases."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Revalidar gate estrutural
        run: node tests/auditar-release-v1.mjs

      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Revalidar E2E local Desktop e Mobile
        run: npm run test:e2e

      - name: Materializar aceite final nos documentos
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          run_id = os.environ['FIREBASE_RUN_ID']
          run_url = f"https://github.com/${{ github.repository }}/actions/runs/{run_id}"

          package_path = pathlib.Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '1.0.0'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          roadmap_path = pathlib.Path('ROADMAP-V1.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          roadmap = roadmap.replace(
              '18. Homologação, documentação e release final — 🟡 Em homologação final · gate Firebase real pendente por Secrets',
              '18. Homologação, documentação e release final — ✅ Aceito'
          )
          roadmap = roadmap.replace(
              'Estado atual: gate estrutural, cobertura total, E2E Chromium Desktop/Mobile, documentação e limpeza de PRs/branches foram concluídos. O único gate técnico obrigatório ainda sem evidência verde é `Homologar Firebase real v1`, que depende dos cinco GitHub Actions Secrets de duas identidades reais de teste. A tag `v1.0.0` permanece proibida até esse gate executar com sucesso.',
              f'Aceite: gate estrutural, cobertura total, E2E Chromium Desktop/Mobile, documentação, limpeza de PRs/branches e homologação Firebase multiusuário real foram concluídos. O gate `Homologar Firebase real v1` foi aprovado no run `{run_id}`. A v1.0 está encerrada e apta à publicação da tag `v1.0.0`.'
          )
          if '18. Homologação, documentação e release final — ✅ Aceito' not in roadmap:
              raise SystemExit('Não foi possível materializar o aceite do Bloco 18 no ROADMAP-V1.md.')
          roadmap_path.write_text(roadmap, encoding='utf-8')

          hom_path = pathlib.Path('docs/HOMOLOGACAO-V1.md')
          hom = hom_path.read_text(encoding='utf-8')
          hom = hom.replace(
              '- Evidência de execução Firebase multiusuário real: **bloqueada exclusivamente por ausência dos cinco GitHub Actions Secrets de teste**.',
              f'- Evidência de execução Firebase multiusuário real: **aprovada** no run `{run_id}`.'
          )
          hom = hom.replace(
              '- Tag/release `v1.0.0`: **bloqueada somente até existir uma execução verde do gate Firebase real**.',
              '- Tag/release `v1.0.0`: **autorizada** após aprovação de todos os gates obrigatórios.'
          )
          hom = hom.replace(
              '| Firebase autenticado | Pendente por Secrets | Mesmo harness em contexto independente | duas identidades reais e papéis distintos na mesma Mesa |',
              f'| Firebase autenticado | Aprovado | Aprovado | duas identidades reais, Rules, projeção compartilhada e retomada de rede · run `{run_id}` |'
          )
          marker = '### Firebase real\n\n'
          final_block = (
              f'### Firebase real — aceite final\n\n'
              f'Execução final aprovada: `Homologar Firebase real v1`, run `{run_id}`. '
              f'O workflow concluiu com **success** usando duas identidades reais e liberou o encerramento do Bloco 18. '
              f'Evidência: {run_url}\n\n'
          )
          if final_block not in hom:
              hom = hom.replace(marker, final_block + marker, 1)
          hom = hom.replace(
              'Este é o **único gate técnico obrigatório ainda não aprovado**.',
              'Este gate técnico obrigatório foi **aprovado na homologação final**.'
          )
          old_sequence = '''## Sequência final para a tag\n\n1. configurar os cinco Secrets de teste no GitHub Actions;\n2. executar `Homologar Firebase real v1` até obter **success** real;\n3. registrar a evidência final neste documento;\n4. marcar o Bloco 18 como aceito no `ROADMAP-V1.md`;\n5. criar somente então a tag/release `v1.0.0`.'''
          new_sequence = f'''## Fechamento final\n\nTodos os gates obrigatórios da v1.0 foram aprovados. O Bloco 18 está aceito e a publicação `v1.0.0` foi autorizada pelo run Firebase `{run_id}`.'''
          hom = hom.replace(old_sequence, new_sequence)
          if f'run `{run_id}`' not in hom:
              raise SystemExit('Não foi possível registrar a evidência Firebase final em HOMOLOGACAO-V1.md.')
          hom_path.write_text(hom, encoding='utf-8')
          PY

      - name: Commitar aceite, criar tag e publicar release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json ROADMAP-V1.md docs/HOMOLOGACAO-V1.md
          git commit -m "release: aceitar Bloco 18 e finalizar v1.0.0"
          git tag -a v1.0.0 -m "Teias de Anansi v1.0.0"
          git push origin HEAD:main
          git push origin v1.0.0
          gh release create v1.0.0 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Teias de Anansi v1.0.0" \
            --notes-file docs/RELEASE-NOTES-V1.0.0.md \
            --verify-tag
