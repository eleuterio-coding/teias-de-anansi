name: Finalizar release v1.0.0

on:
  workflow_run:
    workflows: ["Homologar Firebase real v1"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: finalizar-release-v1
  cancel-in-progress: false

jobs:
  finalizar:
    name: Aceitar Bloco 18 e publicar v1.0.0
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FIREBASE_RUN_ID: ${{ github.event.workflow_run.id }}
      FIREBASE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout da main homologada
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Garantir que a main não mudou depois da homologação Firebase
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" != "$FIREBASE_HEAD_SHA" ]; then
            echo "::error::A main mudou após a homologação Firebase. Esperado $FIREBASE_HEAD_SHA, atual $CURRENT_SHA. Rode novamente Homologar Firebase real v1 sobre a main atual."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            echo "::error::A tag v1.0.0 já existe. O finalizador não sobrescreve tags."
            exit 1
          fi
          if gh release view v1.0.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::O GitHub Release v1.0.0 já existe."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Revalidar gate estrutural
        run: node tests/auditar-release-v1.mjs

      - name: Instalar Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Revalidar E2E local Desktop e Mobile
        run: npm run test:e2e

      - name: Materializar aceite final nos documentos
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re

          run_id = os.environ['FIREBASE_RUN_ID']
          repository = os.environ['GITHUB_REPOSITORY']
          run_url = f"https://github.com/{repository}/actions/runs/{run_id}"

          package_path = pathlib.Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '1.0.0'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          roadmap_path = pathlib.Path('ROADMAP-V1.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          roadmap, count = re.subn(
              r'^18\. Homologação, documentação e release final — .*$',
              '18. Homologação, documentação e release final — ✅ Aceito',
              roadmap,
              count=1,
              flags=re.M
          )
          if count != 1:
              raise SystemExit('Não foi possível localizar o status do Bloco 18 no ROADMAP-V1.md.')
          acceptance = f'Aceite: gate estrutural, cobertura total, E2E Chromium Desktop/Mobile, documentação, limpeza de PRs/branches e homologação Firebase multiusuário real foram concluídos. O gate `Homologar Firebase real v1` foi aprovado no run `{run_id}`. A v1.0 está encerrada e apta à publicação da tag `v1.0.0`.'
          if re.search(r'^Estado atual: gate estrutural,', roadmap, flags=re.M):
              roadmap = re.sub(r'^Estado atual: gate estrutural,.*$', acceptance, roadmap, count=1, flags=re.M)
          elif re.search(r'^Aceite: gate estrutural,', roadmap, flags=re.M):
              roadmap = re.sub(r'^Aceite: gate estrutural,.*$', acceptance, roadmap, count=1, flags=re.M)
          else:
              raise SystemExit('Não foi possível localizar o resumo do Bloco 18 no ROADMAP-V1.md.')
          roadmap_path.write_text(roadmap, encoding='utf-8')

          hom_path = pathlib.Path('docs/HOMOLOGACAO-V1.md')
          hom = hom_path.read_text(encoding='utf-8')
          hom, evidence_count = re.subn(
              r'^- Evidência de execução Firebase multiusuário real: .*$',
              f'- Evidência de execução Firebase multiusuário real: **aprovada** no run `{run_id}`.',
              hom,
              count=1,
              flags=re.M
          )
          hom, release_count = re.subn(
              r'^- Tag/release `v1\.0\.0`: .*$',
              '- Tag/release `v1.0.0`: **publicação autorizada** após aprovação de todos os gates obrigatórios.',
              hom,
              count=1,
              flags=re.M
          )
          hom, matrix_count = re.subn(
              r'^\| Firebase autenticado \|.*$',
              f'| Firebase autenticado | Aprovado | Aprovado | Administrador real + Jogador efêmero, Rules, projeção compartilhada e retomada de rede · run `{run_id}` |',
              hom,
              count=1,
              flags=re.M
          )
          if not all([evidence_count, release_count, matrix_count]):
              raise SystemExit('Não foi possível atualizar todas as evidências Firebase em HOMOLOGACAO-V1.md.')

          marker = '### Firebase real\n\n'
          final_block = (
              f'### Firebase real — aceite final\n\n'
              f'Execução final aprovada: `Homologar Firebase real v1`, run `{run_id}`. '
              f'O workflow concluiu com **success** usando o Administrador real e um Jogador E2E efêmero, liberando o encerramento do Bloco 18. '
              f'Evidência: {run_url}\n\n'
          )
          hom = re.sub(r'### Firebase real — aceite final\n\n.*?(?=### Firebase real\n\n)', '', hom, count=1, flags=re.S)
          if marker not in hom:
              raise SystemExit('Seção Firebase real não encontrada em HOMOLOGACAO-V1.md.')
          hom = hom.replace(marker, final_block + marker, 1)
          hom = hom.replace(
              'Este é o **único gate técnico obrigatório ainda não aprovado**.',
              'Este gate técnico obrigatório foi **aprovado na homologação final**.'
          )

          closing = f'## Fechamento final\n\nTodos os gates obrigatórios da v1.0 foram aprovados. O Bloco 18 está aceito e a publicação `v1.0.0` foi autorizada pelo run Firebase `{run_id}`.'
          if '## Sequência final para a tag' in hom:
              hom = re.sub(r'## Sequência final para a tag\n.*\Z', closing + '\n', hom, count=1, flags=re.S)
          elif '## Fechamento final' in hom:
              hom = re.sub(r'## Fechamento final\n.*\Z', closing + '\n', hom, count=1, flags=re.S)
          else:
              raise SystemExit('Seção de fechamento não encontrada em HOMOLOGACAO-V1.md.')

          if f'run `{run_id}`' not in hom:
              raise SystemExit('Não foi possível registrar a evidência Firebase final em HOMOLOGACAO-V1.md.')
          hom_path.write_text(hom, encoding='utf-8')
          PY

      - name: Commitar aceite e publicar release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json ROADMAP-V1.md docs/HOMOLOGACAO-V1.md
          if git diff --cached --quiet; then
            echo "::error::O finalizador não produziu alterações de aceite para versionar."
            exit 1
          fi
          git commit -m "release: aceitar Bloco 18 e finalizar v1.0.0"
          FINAL_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          gh release create v1.0.0 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "$FINAL_SHA" \
            --title "Teias de Anansi v1.0.0" \
            --notes-file docs/RELEASE-NOTES-V1.0.0.md
