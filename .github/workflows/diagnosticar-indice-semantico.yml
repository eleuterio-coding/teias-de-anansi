name: Diagnosticar índice semântico

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnosticar-indice-semantico.yml'
      - 'scripts/gerar_referencias_hub.py'
      - 'dados/**'
      - '*.html'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preparar catálogo de Regras
        run: |
          python - <<'PY'
          from pathlib import Path
          parts=[Path(f'dados/regras-atuais-ptbr.part{n}.txt') for n in range(1,5)]
          raw=''.join(p.read_text(encoding='utf-8') for p in parts)
          Path('dados/regras-atuais-ptbr.generated.json').write_text(raw,encoding='utf-8')
          PY

      - name: Executar gerador com diagnóstico
        id: index
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/gerar_referencias_hub.py \
            --root . \
            --output dados/referencias-hub-index.json \
            --stubs dados/referencias-hub-stubs.json 2>&1 | tee /tmp/indice-semantico.log

      - name: Publicar diagnóstico
        if: steps.index.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Diagnóstico do índice semântico no deploy'
            echo
            echo '```text'
            cat /tmp/indice-semantico.log
            echo '```'
          } > /tmp/indice-comment.md
          gh pr comment 122 --body-file /tmp/indice-comment.md

      - name: Reprovar se necessário
        if: steps.index.outcome == 'failure'
        run: exit 1
