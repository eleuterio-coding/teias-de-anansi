name: Validar perfil, retratos e Campanha
on:
  pull_request:
    paths:
      - 'scripts/app-shell.js'
      - 'scripts/profile-images.js'
      - 'scripts/user-profile-ui.js'
      - 'scripts/firebase-collaboration-provider.js'
      - 'scripts/campaign-player-view.js'
      - 'scripts/campaign-table-ui.js'
      - 'scripts/campaign-next-session-ui.js'
      - 'scripts/campaign-sessions-ui.js'
      - 'scripts/character-sheet.js'
      - 'scripts/adventure-roster-ui.js'
      - 'scripts/collaboration-model.js'
      - 'usuario.html'
      - 'user-profiles.css'
      - 'criacao-personagem.html'
      - 'character-pages.css'
      - 'tests/auditar-usuarios-editor.mjs'
      - 'ficha-personagem.html'
      - 'sessoes.html'
      - 'campaigns.css'
      - 'hub-ux.css'
      - 'e2e/campaign-avatars-user-current-session.spec.js'
      - '.github/workflows/validar-perfil-retratos-campanha.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-usuarios-campanhas:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe e modelos
        run: |
          for file in scripts/profile-images.js scripts/user-profile-ui.js scripts/firebase-collaboration-provider.js scripts/campaign-table-ui.js scripts/campaign-player-view.js scripts/campaign-next-session-ui.js scripts/campaign-sessions-ui.js scripts/character-sheet.js scripts/adventure-roster-ui.js scripts/collaboration-model.js scripts/app-shell.js; do node --check "$file"; done
          node tests/auditar-usuarios-editor.mjs
          node tests/auditar-criacao-layout-origem.mjs
          node tests/auditar-perfil-campanha.mjs
          node tests/auditar-visibilidade-campanha.mjs
          node tests/auditar-editor-campanha.mjs
      - name: Instalar navegador
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Testar Campanha, usuários e fichas no navegador
        run: npx playwright test e2e/campaign-avatars-user-current-session.spec.js e2e/campaign-next-session-highlight.spec.js e2e/campaign-player-disclosure.spec.js e2e/character-gender-identity.spec.js --project=desktop-chromium --project=mobile-chromium
