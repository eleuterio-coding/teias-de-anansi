name: Aplicar limpeza editorial dos módulos

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]

permissions:
  contents: write

jobs:
  aplicar:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Injetar limpador com cache-bust nos 11 módulos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              'monstros.html','armaduras.html','armas.html','equipamentos-aventura.html','ferramentas.html',
              'montarias-veiculos.html','comercio-e-despesas.html','bugigangas.html','itens-magicos.html','magias.html','idiomas.html'
          ]
          marker='data-hub-limpa-meta-source="2"'
          tag='<script data-hub-limpa-meta-source="2" src="scripts/limpar-metadados-modulos.js?v=20260820-clean3"></script>\n'

          for filename in targets:
              path=Path(filename)
              if not path.exists():
                  raise RuntimeError(f'Módulo ausente: {filename}')
              html=path.read_text(encoding='utf-8')
              if marker not in html:
                  if '</body>' not in html:
                      raise RuntimeError(f'Elemento </body> ausente: {filename}')
                  html=html.replace('</body>',tag+'</body>',1)
                  path.write_text(html,encoding='utf-8')

          missing=[f for f in targets if marker not in Path(f).read_text(encoding='utf-8')]
          if missing:
              raise RuntimeError('Limpador novo não foi injetado em: '+', '.join(missing))
          print(f'Cache-bust do limpador presente em {len(targets)}/11 módulos.')
          PY

      - name: Validar e publicar no main
        shell: bash
        run: |
          for f in monstros.html armaduras.html armas.html equipamentos-aventura.html ferramentas.html montarias-veiculos.html comercio-e-despesas.html bugigangas.html itens-magicos.html magias.html idiomas.html; do
            grep -q 'data-hub-limpa-meta-source="2"' "$f" || { echo "Falha: $f"; exit 1; }
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monstros.html armaduras.html armas.html equipamentos-aventura.html ferramentas.html \
            montarias-veiculos.html comercio-e-despesas.html bugigangas.html itens-magicos.html magias.html idiomas.html
          if git diff --cached --quiet; then
            echo 'Cache-bust já presente nos 11 módulos.'
            exit 0
          fi
          git commit -m 'Remove blocos editoriais dos 11 módulos'
          git push origin HEAD:main
