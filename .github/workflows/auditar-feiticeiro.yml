name: Auditar Feiticeiro

on:
  pull_request:
    paths:
      - 'scripts/character-builder/sorcerer-subclass-mechanics.js'
      - 'scripts/character-builder/sorcerer-subclass-ui.js'
      - 'scripts/character-builder/sorcerer-spell-access.js'
      - 'scripts/character-builder/spell-progression-rules.js'
      - 'scripts/character-builder/class-skill-ui.js'
      - 'scripts/character-builder/language-mechanics.js'
      - 'scripts/character-builder/rules.js'
      - 'tests/auditar-feiticeiro-subclasses.mjs'
      - '.github/workflows/auditar-feiticeiro.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/character-builder/sorcerer-subclass-mechanics.js'
      - 'scripts/character-builder/sorcerer-subclass-ui.js'
      - 'scripts/character-builder/sorcerer-spell-access.js'
      - 'scripts/character-builder/spell-progression-rules.js'
      - 'scripts/character-builder/class-skill-ui.js'
      - 'scripts/character-builder/language-mechanics.js'
      - 'scripts/character-builder/rules.js'
      - 'tests/auditar-feiticeiro-subclasses.mjs'
      - '.github/workflows/auditar-feiticeiro.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Feiticeiro 9/9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar subclasses de Feiticeiro
        run: node tests/auditar-feiticeiro-subclasses.mjs
      - name: Validar sintaxe
        run: |
          node --check scripts/character-builder/sorcerer-subclass-mechanics.js
          node --check scripts/character-builder/sorcerer-subclass-ui.js
          node --check scripts/character-builder/sorcerer-spell-access.js
          node --check scripts/character-builder/spell-progression-rules.js
          node --check scripts/character-builder/rules.js
          node --check scripts/character-builder/class-skill-ui.js
          node --check scripts/character-builder/language-mechanics.js
