name: Validar editor de Campanha — Atos e Linha do Tempo
on:
  pull_request:
    paths:
      - 'scripts/campaign-state.js'
      - 'scripts/campaign-table-ui.js'
      - 'scripts/campaign-structured-ui.js'
      - 'scripts/campaign-table-router.js'
      - 'campaigns.css'
      - 'mesa.html'
      - 'tests/auditar-editor-campanha.mjs'
      - 'e2e/campaign-acts-nested-timeline.spec.js'
      - 'e2e/npcs-campaign-editor.spec.js'
      - 'e2e/campaign-ux-save-feedback.spec.js'
      - 'e2e/campaign-editor-recent-lists.spec.js'
      - 'scripts/campaign-recent-items.js'
      - 'scripts/adventure-ui.js'
      - 'scripts/adventure-router.js'
      - '.github/workflows/validar-editor-campanha-atos.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/campaign-state.js'
      - 'scripts/campaign-table-ui.js'
      - 'scripts/campaign-structured-ui.js'
      - 'scripts/campaign-table-router.js'
      - 'campaigns.css'
      - 'mesa.html'
      - 'tests/auditar-editor-campanha.mjs'
      - 'e2e/campaign-acts-nested-timeline.spec.js'
      - 'e2e/npcs-campaign-editor.spec.js'
      - 'e2e/campaign-ux-save-feedback.spec.js'
      - 'e2e/campaign-editor-recent-lists.spec.js'
      - 'scripts/campaign-recent-items.js'
      - 'scripts/adventure-ui.js'
      - 'scripts/adventure-router.js'
      - '.github/workflows/validar-editor-campanha-atos.yml'
permissions:
  contents: read
jobs:
  atos-timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar scripts e migração de dados
        run: |
          node --check scripts/campaign-state.js
          node --check scripts/campaign-table-ui.js
          node --check scripts/campaign-structured-ui.js
          node --check scripts/campaign-recent-items.js
          node --check scripts/adventure-ui.js
          node --check scripts/adventure-router.js
          node tests/auditar-editor-campanha.mjs
          node tests/auditar-campanhas-mesas.mjs
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Testar editor e regressões no navegador
        run: npx playwright test e2e/campaign-acts-nested-timeline.spec.js e2e/npcs-campaign-editor.spec.js e2e/campaign-ux-save-feedback.spec.js e2e/campaign-editor-recent-lists.spec.js
