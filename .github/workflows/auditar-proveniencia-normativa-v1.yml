name: Auditar normativa v1.0 — Bloco 9

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ROADMAP-V1.md'
      - 'dados/**'
      - 'scripts/character-builder/**'
      - 'scripts/character-sheet*.js'
      - 'tests/auditar-proveniencia-normativa.mjs'
      - 'tests/auditar-semantica-*.mjs'
      - 'tests/auditar-precedencia-*.mjs'
      - '.github/workflows/auditar-proveniencia-normativa-v1.yml'
  push:
    branches: [main]
    paths:
      - 'ROADMAP-V1.md'
      - 'dados/**'
      - 'scripts/character-builder/**'
      - 'scripts/character-sheet*.js'
      - 'tests/auditar-proveniencia-normativa.mjs'
      - 'tests/auditar-semantica-*.mjs'
      - 'tests/auditar-precedencia-*.mjs'
      - '.github/workflows/auditar-proveniencia-normativa-v1.yml'

permissions:
  contents: read

jobs:
  normativa-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: |
          node --check tests/auditar-proveniencia-normativa.mjs
          node --check tests/auditar-semantica-classes-core.mjs
          node --check tests/auditar-semantica-subclasses-phb-2024.mjs
          node --check tests/auditar-semantica-especies-phb-2024.mjs
          node --check tests/auditar-semantica-antecedentes-phb-2024.mjs
          node --check tests/auditar-precedencia-tiefling.mjs
      - name: 11A · Proveniência fail-closed
        run: node tests/auditar-proveniencia-normativa.mjs
      - name: 11B · Classes core 2024
        run: node tests/auditar-semantica-classes-core.mjs
      - name: 11B · Subclasses PHB 2024
        run: node tests/auditar-semantica-subclasses-phb-2024.mjs
      - name: 11B · Espécies PHB 2024
        run: node tests/auditar-semantica-especies-phb-2024.mjs
      - name: 11B · Antecedentes PHB 2024
        run: node tests/auditar-semantica-antecedentes-phb-2024.mjs
      - name: 11C · Precedência Tiefling
        run: node tests/auditar-precedencia-tiefling.mjs
