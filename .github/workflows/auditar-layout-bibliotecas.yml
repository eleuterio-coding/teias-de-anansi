name: Auditar layout das Bibliotecas

on:
  pull_request:
    paths:
      - 'biblioteca-light.css'
      - 'bibliotecas.html'
      - 'regras.html'
      - 'classes.html'
      - 'subclasses.html'
      - 'raca.html'
      - 'antecedentes.html'
      - 'talentos.html'
      - 'maestrias-de-arma.html'
      - 'monstros.html'
      - 'armaduras.html'
      - 'armas.html'
      - 'equipamentos-aventura.html'
      - 'ferramentas.html'
      - 'montarias-veiculos.html'
      - 'comercio-e-despesas.html'
      - 'bugigangas.html'
      - 'itens-magicos.html'
      - 'magias.html'
      - 'idiomas.html'
      - 'tests/auditar-layout-bibliotecas.mjs'
  push:
    branches: [main]
    paths:
      - 'biblioteca-light.css'
      - 'bibliotecas.html'
      - 'regras.html'
      - 'classes.html'
      - 'subclasses.html'
      - 'raca.html'
      - 'antecedentes.html'
      - 'talentos.html'
      - 'maestrias-de-arma.html'
      - 'monstros.html'
      - 'armaduras.html'
      - 'armas.html'
      - 'equipamentos-aventura.html'
      - 'ferramentas.html'
      - 'montarias-veiculos.html'
      - 'comercio-e-despesas.html'
      - 'bugigangas.html'
      - 'itens-magicos.html'
      - 'magias.html'
      - 'idiomas.html'
      - 'tests/auditar-layout-bibliotecas.mjs'

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar layout compartilhado
        run: node tests/auditar-layout-bibliotecas.mjs
