name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate and audit semantic reference index
        shell: bash
        run: |
          python scripts/gerar_referencias_hub.py \
            --root . \
            --output dados/referencias-hub-index.json \
            --stubs dados/referencias-hub-stubs.json

          python - <<'PY'
          import json, unicodedata
          from pathlib import Path

          def norm(value):
              text = unicodedata.normalize('NFKD', str(value or ''))
              text = ''.join(ch for ch in text if not unicodedata.combining(ch))
              return ' '.join(text.casefold().split())

          data = json.loads(Path('dados/referencias-hub-index.json').read_text(encoding='utf-8'))
          if data.get('schema') != 'hub-rpg.referencias.v3':
              raise RuntimeError(f"Schema inesperado: {data.get('schema')}")
          if data.get('politica_autorreferencia') != 'proibida':
              raise RuntimeError('Política de autorreferência não está marcada como proibida.')
          if data.get('total_entidades', 0) < 170:
              raise RuntimeError(f"Índice semântico anormalmente pequeno: {data.get('total_entidades')}")

          entities = data.get('entidades', [])
          by_id = {x.get('id'): x for x in entities if x.get('id')}
          resolved = data.get('aliases_resolvidos', [])
          broken = [x for x in resolved if x.get('id') not in by_id]
          if broken:
              raise RuntimeError(f'Aliases com destino inexistente: {broken[:5]}')

          aliases = {norm(x.get('termo')): x.get('id') for x in resolved}
          for required in ('sangrando', 'pontos de vida', 'desvantagem', 'vantagem', 'acao', 'reacao'):
              if required not in aliases:
                  raise RuntimeError(f'Referência obrigatória não resolvida: {required}')
          if aliases['sangrando'] == aliases['pontos de vida']:
              raise RuntimeError('Sangrando e Pontos de Vida não podem compartilhar ID.')

          expected_modules = {
              'Regras','Classes','Subclasses','Espécies','Antecedentes','Talentos','Maestrias de Arma','Monstros',
              'Armaduras','Armas','Equipamentos de Aventura','Ferramentas','Montarias e Veículos','Comércio e Despesas',
              'Bugigangas','Itens Mágicos','Magias','Idiomas'
          }
          indexed_modules = set(data.get('modulos', {}))
          missing_modules = sorted(expected_modules - indexed_modules)
          if missing_modules:
              raise RuntimeError('Módulos ausentes do resolvedor: ' + ', '.join(missing_modules))
          coverage = data.get('cobertura_modulos', {})
          empty = sorted(m for m in expected_modules if int(coverage.get(m, 0)) <= 0)
          if empty:
              raise RuntimeError('Módulos sem entidades indexadas: ' + ', '.join(empty))

          for row in entities:
              url = row.get('url')
              if url and url != 'referencia.html' and not Path(url).exists():
                  raise RuntimeError(f"Destino de página inexistente: {row.get('nome')} -> {url}")

          audit = data.get('auditoria', {})
          if audit.get('destinos_invalidos', 0) != 0:
              raise RuntimeError(f"Índice contém destinos inválidos: {audit.get('destinos_invalidos')}")

          print(
              f"Índice v3 validado: {data['total_entidades']} entidades; "
              f"18/18 módulos; {audit.get('stubs_criados', 0)} stubs; zero destinos inválidos."
          )
          PY

      - name: Validate self-reference safeguards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          js = Path('scripts/referencias-hub.js').read_text(encoding='utf-8')
          required = [
              "const VERSION='20260819-refs3'",
              'ctx.selfTerms.has(term)',
              'rows.some(r=>r.id===ctx.selfId)',
              'function purgeSelfLinks()',
              "[data-hub-entity-id]",
              'validateLinks()'
          ]
          missing = [token for token in required if token not in js]
          if missing:
              raise RuntimeError('Proteções contra autorreferência incompletas: ' + ', '.join(missing))
          print('Proteções de autorreferência e links quebrados validadas.')
          PY

      - name: Force white background and black text across the site
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          tag = '<link rel="stylesheet" href="site-light.css?v=20260819-1841">'
          for path in Path('.').rglob('*.html'):
              html = path.read_text(encoding='utf-8')
              if tag not in html:
                  if '</head>' not in html:
                      raise RuntimeError(f'Elemento </head> não encontrado: {path}')
                  html = html.replace('</head>', f'  {tag}\n</head>', 1)
                  path.write_text(html, encoding='utf-8')
          PY

      - name: Inject global semantic references in every page
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          module_pages = [
              'regras.html','classes.html','subclasses.html','especies.html','antecedentes.html','talentos.html',
              'maestrias-de-arma.html','monstros.html','armaduras.html','armas.html','equipamentos-aventura.html',
              'ferramentas.html','montarias-veiculos.html','comercio-e-despesas.html','bugigangas.html',
              'itens-magicos.html','magias.html','idiomas.html'
          ]
          support_pages = ['classes-v2.html','classes-v3.html','referencia.html']
          marker = 'data-hub-referencias="1"'
          tag = '<script data-hub-referencias="1" src="scripts/referencias-hub.js?v=20260819-refs3"></script>\n'

          for path in Path('.').glob('*.html'):
              html = path.read_text(encoding='utf-8')
              if marker not in html:
                  if '</body>' not in html:
                      raise RuntimeError(f'Elemento </body> não encontrado: {path}')
                  html = html.replace('</body>', tag + '</body>', 1)
                  path.write_text(html, encoding='utf-8')

          status=[]
          for filename in module_pages + support_pages:
              path=Path(filename)
              if not path.exists():
                  raise RuntimeError(f'Página obrigatória ausente: {filename}')
              active = marker in path.read_text(encoding='utf-8')
              status.append({'pagina': filename, 'referencias_semanticas': active})
              if not active:
                  raise RuntimeError(f'Resolvedor não injetado em: {filename}')

          Path('dados/referencias-hub-status.json').write_text(json.dumps({
              'schema':'hub-rpg.referencias-status.v3','total_modulos':len(module_pages),'modulos_ativos':len(module_pages),
              'paginas_suporte':support_pages,'status':status,'autorreferencia':'proibida'
          },ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'Resolvedor v3 injetado em {len(module_pages)}/18 módulos e {len(support_pages)} páginas de suporte.')
          PY

      - name: Validate control cases in Rules
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          raw=''.join(Path(f'dados/regras-dndbeyond-2024.part{n}.txt').read_text(encoding='utf-8') for n in range(1,5))
          data=json.loads(raw)
          items={x.get('nome'):x for x in data.get('itens',[])}
          for name in ('Sangrando','Desvantagem'):
              if name not in items:
                  raise RuntimeError(f'Caso de controle ausente nas Regras: {name}')
              desc=str(items[name].get('descricao',''))
              if name not in desc:
                  raise RuntimeError(f'O texto de {name} não contém o próprio termo para validar o bloqueio de autorreferência.')
          if 'Pontos de Vida' not in str(items['Sangrando'].get('descricao','')):
              raise RuntimeError('Sangrando não contém Pontos de Vida no texto de controle.')
          print('Casos de controle validados: Desvantagem sem autorreferência; Sangrando -> Pontos de Vida.')
          PY

      - name: Inject Expanded Concentration seals into Spells
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          page = Path('magias.html')
          script_file = Path('scripts/concentracao-expandida-selos.js')
          marker = 'data-concentracao-expandida-selos="1"'
          html = page.read_text(encoding='utf-8')
          js = script_file.read_text(encoding='utf-8')
          if marker not in html:
              if '</body>' not in html:
                  raise RuntimeError('Elemento </body> não encontrado em magias.html')
              tag = f'<script {marker}>\n{js}\n</script>\n'
              html = html.replace('</body>', tag + '</body>', 1)
              page.write_text(html, encoding='utf-8')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4