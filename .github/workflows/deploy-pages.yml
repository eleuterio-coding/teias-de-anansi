name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Force white background and black text across the site
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          tag = '<link rel="stylesheet" href="site-light.css?v=20260819-1615">'

          for path in Path('.').rglob('*.html'):
              html = path.read_text(encoding='utf-8')
              if tag in html:
                  continue
              if '</head>' not in html:
                  raise RuntimeError(f'Elemento </head> não encontrado: {path}')
              html = html.replace('</head>', f'  {tag}\n</head>', 1)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
