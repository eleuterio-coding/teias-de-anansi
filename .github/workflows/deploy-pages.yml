name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Force Biblioteca modules to white background and black text
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          files = [
              'bibliotecas.html',
              'regras.html',
              'classes.html',
              'subclasses.html',
              'especies.html',
              'antecedentes.html',
              'talentos.html',
              'maestrias-de-arma.html',
              'monstros.html',
              'armaduras.html',
              'armas.html',
              'equipamentos-aventura.html',
              'ferramentas.html',
              'montarias-veiculos.html',
              'comercio-e-despesas.html',
              'bugigangas.html',
              'itens-magicos.html',
              'magias.html',
              'idiomas.html',
          ]
          tag = '<link rel="stylesheet" href="biblioteca-light.css?v=20260819-1444">'

          for filename in files:
              path = Path(filename)
              if not path.exists():
                  raise FileNotFoundError(f'Módulo não encontrado: {filename}')
              html = path.read_text(encoding='utf-8')
              if tag not in html:
                  if '</head>' not in html:
                      raise RuntimeError(f'Elemento </head> não encontrado: {filename}')
                  html = html.replace('</head>', f'  {tag}\n</head>', 1)
                  path.write_text(html, encoding='utf-8')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
