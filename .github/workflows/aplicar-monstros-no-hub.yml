name: Aplicar catálogo de Monstros no Hub

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aplicar-monstros-no-hub.yml'
      - 'monstros.js'

permissions:
  contents: write

jobs:
  patch-biblioteca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ligar catálogo de Monstros à Biblioteca
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('biblioteca.html')
          html = path.read_text(encoding='utf-8')
          tag = '  <script src="monstros.js"></script>\n'

          if tag not in html:
              if '</body>' not in html:
                  raise SystemExit('biblioteca.html não contém </body>')
              html = html.replace('</body>', tag + '</body>', 1)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Publicar alteração
        run: |
          if git diff --quiet -- biblioteca.html; then
            echo "Catálogo já está ligado à Biblioteca."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biblioteca.html
          git commit -m "Publica catálogo de Monstros 5.5e no Hub"
          git push
