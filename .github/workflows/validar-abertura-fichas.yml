name: Validar abertura de fichas
on:
  pull_request:
    paths:
      - 'scripts/character-sheet.js'
      - 'scripts/collaboration-view.js'
      - 'scripts/collaboration-realtime.js'
      - 'scripts/character-list-ui.js'
      - 'scripts/hub-ux.js'
      - 'ficha-personagem.html'
      - 'lista-personagens.html'
      - 'scripts/character-sheet-access-ui.js'
      - 'scripts/character-builder/state.js'
      - 'e2e/character-sheet-shared-opening.spec.js'
      - 'tests/auditar-abertura-fichas.mjs'
      - '.github/workflows/validar-abertura-fichas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferir-fichas:
    name: Fichas ${{ matrix.version }} — desktop/mobile
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        version: [baseline-main, design-pr]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version == 'baseline-main' && (github.event.pull_request.base.sha || 'main') || (github.event.pull_request.head.sha || github.sha) }}
      - name: Usar a mesma especificação corrigida na main, sem modificar a branch
        if: matrix.version == 'baseline-main'
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git show "${{ github.event.pull_request.head.sha || github.sha }}:e2e/character-sheet-shared-opening.spec.js" > e2e/character-sheet-shared-opening.spec.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe e normalização dos personagens
        run: |
          node --check scripts/collaboration-view.js
          node --check scripts/collaboration-realtime.js
          node --check scripts/character-list-ui.js
          node --check scripts/hub-ux.js
          node --check scripts/character-sheet.js
          node --check scripts/character-sheet-access-ui.js
          node --check scripts/character-builder/state.js
          node tests/auditar-abertura-fichas.mjs
      - name: Instalar navegador de testes
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Abrir as fichas no navegador
        run: npx playwright test e2e/character-sheet-shared-opening.spec.js --project=desktop-chromium --project=mobile-chromium --reporter=line
