name: Publicar subclasses dos PDFs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-subclasses-pdfs.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consolidar e publicar 119 subclasses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, html, json, re
          from pathlib import Path

          groups = json.loads(base64.b64decode("").decode("utf-8"))
          records = []
          for group in groups:
              for classe, nomes in group["conteudo"].items():
                  for nome in nomes:
                      records.append({
                          "nome": nome,
                          "classe": classe,
                          "grupo": group["nome"],
                          "fonte_id": group["fonte_id"],
                          "fonte": group["fonte"],
                          "ano": group["ano"],
                          "natureza": group["natureza"],
                          "status": group["status"],
                          "edicao": group["edicao"],
                          "origem_pdf": group["pdf"],
                          "paginas_pdf_fonte": group["paginas"],
                          "descricao": group["descricao"].format(classe=classe),
                      })

          if len(records) != 119:
              raise SystemExit(f"Esperadas 119 subclasses; encontradas {len(records)}")
          identities = [(r["nome"], r["classe"]) for r in records]
          if len(set(identities)) != 119:
              raise SystemExit("Há identidades duplicadas no catálogo consolidado")

          page_path = Path("subclasses.html")
          page = page_path.read_text(encoding="utf-8")

          blocks = re.findall(
              r'<details class="subclasse" data-classe="[^"]+">.*?</details>',
              page,
              flags=re.S,
          )
          existing = {}
          for block in blocks:
              match = re.search(
                  r'<summary><strong>\s*(.*?)\s*<span class="tag">',
                  block,
                  flags=re.S,
              )
              if match:
                  name = html.unescape(re.sub(r"<[^>]+>", "", match.group(1))).strip()
                  existing[name] = block

          def tag_for(record):
              if record["fonte_id"] == "phb-2024":
                  return "5.5e"
              if record["ano"]:
                  return str(record["ano"])
              return "5e"

          def generated_block(record):
              name = html.escape(record["nome"])
              classe = html.escape(record["classe"])
              edicao = html.escape(record["edicao"])
              fonte = html.escape(record["fonte"])
              status = html.escape(record["status"].replace("_", " "))
              descricao = html.escape(record["descricao"])
              pdf = html.escape(record["origem_pdf"])
              pags = record["paginas_pdf_fonte"]
              paginas = f"{pags[0]}–{pags[1]}"
              natureza = "Oficial" if record["natureza"] == "oficial" else "Terceiros"
              tag = html.escape(tag_for(record))
              return f'''    <details class="subclasse" data-classe="{classe}">
              <summary><strong>{name} <span class="tag">{tag}</span></strong><span class="classe">{classe}</span></summary>
              <div class="corpo">
                <div class="ficha">
                  <div><strong>Nome:</strong> {name}</div><div><strong>Tipo:</strong> Subclasses</div>
                  <div><strong>Classe:</strong> {classe}</div><div><strong>Edição:</strong> {edicao}</div>
                  <div><strong>Livro/Fonte:</strong> {fonte}</div><div><strong>Status:</strong> {status}</div>
                  <div><strong>Natureza:</strong> {natureza}</div><div><strong>PDF de origem:</strong> {pdf}</div>
                </div>
                <p class="descricao">{descricao}</p>
                <section class="mecanicas">
                  <h3>Referência mecânica</h3>
                  <p>A subclasse foi identificada e consolidada a partir da fonte indicada. Para conteúdo não coberto por licença aberta, o Hub preserva o catálogo, a síntese editorial e a rastreabilidade sem reproduzir integralmente o texto protegido da obra.</p>
                </section>
                <p class="fonte"><strong>Fonte:</strong> {fonte}, seção de subclasses, pp. {paginas}. Origem: {pdf}.</p>
              </div>
            </details>'''

          ordered_blocks = []
          open_names = set(existing)
          for record in records:
              if record["nome"] in existing:
                  block = existing[record["nome"]]
                  if "pdf-rastreio" not in block:
                      rastreio = (
                          '\n        <p class="meta pdf-rastreio"><strong>Rastreabilidade nos PDFs:</strong> '
                          + html.escape(record["fonte"])
                          + ", "
                          + html.escape(record["origem_pdf"])
                          + f', seção de subclasses, pp. {record["paginas_pdf_fonte"][0]}–{record["paginas_pdf_fonte"][1]}.</p>'
                      )
                      block = re.sub(
                          r'(\s*</div>\s*</details>)$',
                          rastreio + r'\1',
                          block,
                          flags=re.S,
                      )
                  ordered_blocks.append(block)
              else:
                  ordered_blocks.append(generated_block(record))

          page = re.sub(
              r'<p class="resumo">.*?</p>',
              '<p class="resumo">119 subclasses identificadas em pdf24_merged.pdf e pdf24_merged-1.pdf, deduplicadas por identidade e revisão. Versões mais recentes equivalentes têm precedência.</p>',
              page,
              count=1,
              flags=re.S,
          )
          notes = '''</header>

          <div class="nota"><strong>Critério editorial:</strong> o módulo consolida todas as subclasses identificadas nos dois PDFs fornecidos ao projeto. Quando uma subclasse foi reimpressa ou revisada, prevalece a versão mais recente equivalente; opções antigas sem substituição e variantes de terceiros permanecem catalogadas.</div>
          <div class="nota"><strong>Completude e direitos:</strong> os cards cujo texto mecânico já era publicável sob licença aberta preservam o detalhamento existente. Para fontes protegidas, o Hub publica identificação, classe, edição, fonte, síntese editorial e rastreabilidade, sem republicar integralmente o texto protegido.</div>

          <div class="controles">'''
          page = re.sub(
              r'</header>\s*(?:<div class="nota">.*?</div>\s*)+<div class="controles">',
              notes,
              page,
              count=1,
              flags=re.S,
          )
          page = page.replace(
              'placeholder="Buscar subclasse, classe, feature ou magia..."',
              'placeholder="Buscar subclasse, classe ou fonte..."',
          )
          classes = ["Artificer","Barbarian","Bard","Cleric","Druid","Fighter","Monk","Paladin","Ranger","Rogue","Sorcerer","Tamer","Warlock","Wizard"]
          options = '\n'.join(['      <option value="">Todas as classes</option>'] + [f'      <option>{html.escape(c)}</option>' for c in classes])
          page = re.sub(
              r'<select id="filtro">.*?</select>',
              '<select id="filtro">\n' + options + '\n    </select>',
              page,
              count=1,
              flags=re.S,
          )

          catalog_html = '<main id="lista">\n\n' + '\n\n'.join(ordered_blocks) + '\n\n  </main>'
          page = re.sub(
              r'<main id="lista">.*?</main>',
              catalog_html,
              page,
              count=1,
              flags=re.S,
          )

          page = re.sub(
              r'(<footer class="licenca">\s*<hr>\s*<p>.*?</p>)\s*<p>.*?</p>',
              r'''\1
              <p>Os 119 registros deste catálogo foram consolidados a partir dos dois PDFs do projeto. A atribuição acima continua aplicável aos cards detalhados derivados do SRD 5.2.1; os demais cards usam sínteses editoriais e referências de fonte.</p>''',
              page,
              count=1,
              flags=re.S,
          )

          final_blocks = re.findall(r'<details class="subclasse" data-classe="[^"]+">', page)
          if len(final_blocks) != 119:
              raise SystemExit(f"HTML inválido: esperados 119 cards; encontrados {len(final_blocks)}")

          for record in records:
              record["nivel_publicacao"] = (
                  "mecanicas_abertas_preservadas"
                  if record["nome"] in open_names
                  else "catalogo_estruturado_com_sintese"
              )

          manifest = {
              "schema": "hub-rpg/subclasses/v1",
              "status": "publicado",
              "gerado_em": "2026-08-19",
              "origem_pdfs": ["pdf24_merged.pdf", "pdf24_merged-1.pdf"],
              "total": len(records),
              "regra_precedencia": "versões posteriores equivalentes prevalecem; conteúdo único anterior e variantes distintas permanecem",
              "grupos": [
                  {
                      "nome": g["nome"],
                      "fonte_id": g["fonte_id"],
                      "fonte": g["fonte"],
                      "origem_pdf": g["pdf"],
                      "paginas_pdf_fonte": g["paginas"],
                      "quantidade": sum(len(v) for v in g["conteudo"].values()),
                  }
                  for g in groups
              ],
              "controle": {
                  "identidades_unicas": len(set(identities)),
                  "cards_html": len(final_blocks),
                  "mecanicas_abertas_preservadas": sum(1 for r in records if r["nome"] in open_names),
                  "catalogo_estruturado_com_sintese": sum(1 for r in records if r["nome"] not in open_names),
              },
              "subclasses": records,
          }

          Path("dados").mkdir(exist_ok=True)
          Path("dados/subclasses-pdfs.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          page_path.write_text(page, encoding="utf-8")
          print(json.dumps(manifest["controle"], ensure_ascii=False))
          PY

      - name: Validar publicação
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          data=json.loads(Path('dados/subclasses-pdfs.json').read_text(encoding='utf-8'))
          html=Path('subclasses.html').read_text(encoding='utf-8')
          assert data['total'] == 119
          assert len(data['subclasses']) == 119
          assert len(re.findall(r'<details class="subclasse"', html)) == 119
          assert 'Artificer' in html and 'Tamer' in html
          print('Validação concluída: 119 subclasses publicáveis no módulo.')
          PY

      - name: Publicar no site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subclasses.html dados/subclasses-pdfs.json
          git commit -m 'Publica 119 subclasses consolidadas dos dois PDFs'
          git pull --rebase origin main
          git push
