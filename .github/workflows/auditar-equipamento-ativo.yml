name: Auditar Equipamento Ativo

on:
  pull_request:
    paths:
      - 'scripts/character-builder/active-equipment-ui.js'
      - 'scripts/character-builder/equipment-ownership.js'
      - 'scripts/character-builder/equipment-ownership-ui.js'
      - 'scripts/character-builder/starting-equipment-rules.js'
      - 'scripts/character-builder/wealth-purchase-ui.js'
      - '.github/workflows/auditar-equipamento-ativo.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/character-builder/active-equipment-ui.js'
      - 'scripts/character-builder/equipment-ownership.js'
      - 'scripts/character-builder/equipment-ownership-ui.js'
      - 'scripts/character-builder/starting-equipment-rules.js'
      - 'scripts/character-builder/wealth-purchase-ui.js'
      - '.github/workflows/auditar-equipamento-ativo.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check scripts/character-builder/active-equipment-ui.js
          node --check scripts/character-builder/equipment-ownership.js
          node --check scripts/character-builder/equipment-ownership-ui.js
          node --check scripts/character-builder/starting-equipment-rules.js
      - name: Auditar controlador único e fontes do inventário
        run: |
          python - <<'PY'
          from pathlib import Path
          legacy=Path('scripts/character-builder/active-equipment-ui.js').read_text(encoding='utf-8')
          ownership=Path('scripts/character-builder/equipment-ownership.js').read_text(encoding='utf-8')
          ui=Path('scripts/character-builder/equipment-ownership-ui.js').read_text(encoding='utf-8')
          required_ownership=['creationPhysicalItems','purchases.quantities','weapon:','armor:','Pacote inicial','Compra']
          missing=[token for token in required_ownership if token not in ownership]
          if missing: raise RuntimeError('Fontes do inventário ausentes: '+', '.join(missing))
          for token in ['Armadura equipada','Escudo equipado','Arma principal','hub:equipment-inventory-changed']:
              if token not in ui: raise RuntimeError(f'Interface ativa sem proteção esperada: {token}')
          if 'no-op intencional' not in legacy or 'ownedEquipment' not in legacy:
              raise RuntimeError('Compatibilidade legada deve delegar ao controlador único de inventário.')
          if 'MutationObserver' in legacy.split('export function initActiveEquipmentUi',1)[-1].replace('Não registrar listeners nem MutationObservers.',''):
              raise RuntimeError('Módulo legado não pode voltar a registrar MutationObserver.')
          joined='\n'.join([legacy,ownership,ui])
          if 'supabase' in joined.lower(): raise RuntimeError('Supabase não pode ser introduzido nesta implementação.')
          print('Equipamento ativo usa controlador único e inventário consolidado.')
          PY
      - name: Testar pacotes físicos como fontes em qualquer Level
        run: |
          node --input-type=module <<'NODE'
          import{creationPhysicalItems,classPackageOptions}from'./scripts/character-builder/starting-equipment-rules.js';
          const fighter={slug:'fighter',name:'Guerreiro'};
          const bg={name:'Teste',equipmentOptions:[{id:'A',itens:[{nome:'Dagger',quantidade:1},{nome:'Shield',quantidade:1},{nome:'PO',quantidade:8}]}]};
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          assert(classPackageOptions(fighter).length===3,'Guerreiro deve preservar A/B/C.');
          const l1=creationPhysicalItems(bg,'A',1,fighter,'A');
          const l5=creationPhysicalItems(bg,'A',5,fighter,'A');
          for(const rows of [l1,l5]){
            assert(rows.some(x=>x._startingSource==='Pacote inicial · Classe'),'Classe deve alimentar o inventário.');
            assert(rows.some(x=>x._startingSource==='Pacote inicial · Antecedente'),'Antecedente deve alimentar o inventário.');
            assert(!rows.some(x=>x.nome==='PO'),'Moedas dos pacotes não devem virar item físico.');
          }
          console.log('Classe e Antecedente alimentam o inventário físico no Level 1 e acima dele.');
          NODE
