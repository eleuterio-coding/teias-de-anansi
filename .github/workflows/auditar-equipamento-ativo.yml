name: Auditar Equipamento Ativo

on:
  pull_request:
    paths:
      - 'scripts/character-builder/active-equipment-ui.js'
      - 'scripts/character-builder/wizard-ui.js'
      - 'scripts/character-builder/starting-equipment-rules.js'
      - 'scripts/character-builder/wealth-purchase-ui.js'
      - '.github/workflows/auditar-equipamento-ativo.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/character-builder/active-equipment-ui.js'
      - 'scripts/character-builder/wizard-ui.js'
      - 'scripts/character-builder/starting-equipment-rules.js'
      - 'scripts/character-builder/wealth-purchase-ui.js'
      - '.github/workflows/auditar-equipamento-ativo.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check scripts/character-builder/active-equipment-ui.js
          node --check scripts/character-builder/wizard-ui.js
      - name: Auditar interface e fontes do inventário
        run: |
          python - <<'PY'
          from pathlib import Path
          ui=Path('scripts/character-builder/active-equipment-ui.js').read_text(encoding='utf-8')
          wizard=Path('scripts/character-builder/wizard-ui.js').read_text(encoding='utf-8')
          required=[
              'Armas disponíveis','Armaduras disponíveis','Escudos disponíveis',
              'creationPhysicalItems','purchases?.quantities','weapon:','armor:',
              'data-active-weapon','data-active-armor','data-active-shield',
              'Somente itens que o personagem possui são exibidos'
          ]
          missing=[token for token in required if token not in ui]
          if missing: raise RuntimeError('Proteções ausentes: '+', '.join(missing))
          if '<select' in ui.lower(): raise RuntimeError('Equipamento ativo não pode voltar a usar menu suspenso.')
          if 'initActiveEquipmentUi' not in wizard: raise RuntimeError('A interface de equipamento ativo não está integrada ao construtor.')
          print('Interface de equipamento ativo validada.')
          PY
      - name: Testar origem e compras como fontes
        run: |
          cp scripts/character-builder/state.js /tmp/state.mjs
          sed "s|'./state.js'|'./state.mjs'|" scripts/character-builder/starting-equipment-rules.js > /tmp/starting-equipment-rules.mjs
          sed -e "s|'./state.js'|'./state.mjs'|" \
              -e "s|'./rules.js?v=20260824-stage-isolation1'|'./rules-stub.mjs'|" \
              -e "s|'./starting-equipment-rules.js?v=20260824-starting-equipment1'|'./starting-equipment-rules.mjs'|" \
              scripts/character-builder/active-equipment-ui.js > /tmp/active-equipment-ui.mjs
          cat >/tmp/rules-stub.mjs <<'NODE'
          import{state}from'./state.mjs';
          export function selected(){return{bg:state.catalogs.backgrounds.find(x=>x.id===state.c?.refs?.background)||null}}
          NODE
          node --input-type=module <<'NODE'
          import{state}from'file:///tmp/state.mjs';
          import{ownedActiveEquipment}from'file:///tmp/active-equipment-ui.mjs';
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          state.G={armas:{Dagger:'Adaga'},armaduras:{Shield:'Escudo','Leather Armor':'Armadura de Couro'}};
          state.catalogs.weapons=[{id:'dagger',nome:'Adaga',nome_original:'Dagger',dano:'1d4 perfurante',categoria:'Simples corpo a corpo'}];
          state.catalogs.armors=[{id:'phb-2024-leather-armor',nome:'Leather Armor',categoria:'Leve',ca:'11 + Destreza'},{id:'phb-2024-shield',nome:'Shield',categoria:'Escudo',ca:'+2'}];
          state.catalogs.backgrounds=[{id:'bg:test',name:'Teste',equipmentOptions:[{id:'A',itens:[{nome:'Dagger',quantidade:1},{nome:'Shield',quantidade:1}]}],equipmentText:''}];
          state.c={refs:{background:'bg:test'},choices:{class:{level:1},background:{equipment:'A'},purchases:{quantities:{'armor:phb-2024-leather-armor':1,'weapon:dagger':2}},equipment:{armor:null,shield:false,weapon:null}}};
          let owned=ownedActiveEquipment();
          assert(owned.weapons.length===1,'A Adaga deve aparecer uma única vez consolidada.');
          assert(owned.weapons[0].qty===3,'A quantidade deve somar Antecedente e compra.');
          assert(owned.armors.some(x=>x.item.id==='phb-2024-leather-armor'),'Armadura comprada deve aparecer automaticamente.');
          assert(owned.shields.some(x=>x.item.id==='phb-2024-shield'),'Escudo do Antecedente deve aparecer automaticamente.');
          state.c.choices.background.equipment='B';
          owned=ownedActiveEquipment();
          assert(!owned.shields.length,'Pacote B não deve conceder o escudo do Pacote A.');
          assert(owned.weapons[0].qty===2,'Ao mudar para Pacote B deve restar apenas a quantidade comprada.');
          console.log('Antecedente e compras alimentam corretamente o equipamento ativo.');
          NODE
