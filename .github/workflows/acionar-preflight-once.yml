name: Etapa 3.09 - acionar apenas preflight OIDC uma vez (sem deploy)
on:
  push:
    branches:
      - feature/etapa-3-usuarios-acesso-20261120
    paths:
      - .github/workflows/acionar-preflight-once.yml
permissions:
  actions: write
  contents: read
jobs:
  preflight-somente:
    if: github.repository == 'eleuterio-coding/teias-de-anansi' && github.ref == 'refs/heads/feature/etapa-3-usuarios-acesso-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verificar main e Pages e solicitar SOMENTE preflight sem deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const base = 'https://api.github.com/repos/eleuterio-coding/teias-de-anansi';
          const headers = {
            authorization: 'Bearer ' + process.env.GH_TOKEN,
            accept: 'application/vnd.github+json',
            'x-github-api-version': '2022-11-28',
          };
          const get = async (path) => {
            const r = await fetch(base + path, { headers, signal: AbortSignal.timeout(15000) });
            assert.ok(r.ok, 'GitHub GET failed HTTP ' + r.status + ' at ' + path);
            return r.json();
          };
          const commit = await get('/commits/main');
          assert.equal(commit.sha, '31b7513a470631d842b679fb77d748df0fcd02d2', 'main mudou; preflight cancelado');
          for (const name of ['publicar-etapa-3-manual.yml', 'verificar-pages-preflight-manual.yml']) {
            const file = await get('/contents/.github/workflows/' + name + '?ref=main');
            assert.equal(file.type, 'file', 'workflow nao encontrado em main');
          }
          const page = await get('/pages');
          assert.equal(page.html_url, 'https://eleuterio-coding.github.io/teias-de-anansi/');
          assert.equal(page.build_type, 'legacy', 'Pages mudou inesperadamente; interromper');
          console.log('BEFORE_PREFLIGHT: main esperado; dois workflows; Pages legacy/URL original');

          const site = await fetch(page.html_url, { method: 'GET', signal: AbortSignal.timeout(15000) });
          assert.ok(site.ok, 'site publico inacessivel antes do preflight: HTTP ' + site.status);
          const html = await site.text();
          assert.ok(html.includes('<html') || html.includes('<!DOCTYPE html'), 'site nao retornou HTML');
          console.log('SITE_BEFORE: HTTP ' + site.status + ', HTML recebido');

          const r = await fetch(base + '/actions/workflows/verificar-pages-preflight-manual.yml/dispatches', {
            method: 'POST',
            headers: { ...headers, 'content-type': 'application/json' },
            body: JSON.stringify({ ref: 'main' }),
            signal: AbortSignal.timeout(15000),
          });
          assert.equal(r.status, 204, 'preflight nao foi disparado: HTTP ' + r.status);
          console.log('PREFLIGHT_ONLY_DISPATCHED: OIDC GET preflight acionado na main; A+B NAO acionado');
          for (let i = 0; i < 8; i++) {
            const runs = await get('/actions/workflows/verificar-pages-preflight-manual.yml/runs?event=workflow_dispatch&branch=main&per_page=3');
            const matching = (runs.workflow_runs || []).find(run => run.head_sha === commit.sha);
            if (matching) {
              console.log('PREFLIGHT_RUN', JSON.stringify({ id: matching.id, url: matching.html_url, status: matching.status, conclusion: matching.conclusion }));
              break;
            }
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          NODE
