name: Finalizar antecedentes SRD 5.2.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalizar-antecedentes-srd-5-2-1.yml'

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir versionamento e validar pacote
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('dados/antecedentes-srd-5.2.1.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          expected={
            'antecedentes:srd521:acolyte':'antecedentes:srd51:acolyte',
            'antecedentes:srd521:criminal':'antecedentes:srd51:criminal',
            'antecedentes:srd521:sage':'antecedentes:srd51:sage',
            'antecedentes:srd521:soldier':'antecedentes:srd51:soldier',
          }
          if len(data.get('items',[])) != 4:
            raise SystemExit('Quantidade de antecedentes diferente de 4')
          for item in data['items']:
            iid=item.get('id')
            if iid not in expected:
              raise SystemExit(f'ID inesperado: {iid}')
            comp=item['compatibilidade']
            comp['versao_de']=expected[iid]
            comp['substitui']=expected[iid]
            d=item['mecanica']['dados_especificos']
            required=[
              item.get('nome'), item.get('nome_original'), item.get('slug'),
              item.get('conteudo',{}).get('descricao'), item.get('conteudo',{}).get('texto_integral'),
              item.get('fonte',{}).get('titulo'), item.get('compatibilidade',{}).get('ruleset'),
              d.get('modelo_de_antecedente'), d.get('atributos_elegiveis'), d.get('talento_origem'),
              d.get('pericias'), d.get('equipamento_inicial')
            ]
            if any(v is None or v == '' or v == [] for v in required):
              raise SystemExit(f'{iid}: campo obrigatório ausente')
            if len(d['atributos_elegiveis']) != 3 or len(d['pericias']) != 2:
              raise SystemExit(f'{iid}: bloco mecânico inválido')
            if not d.get('ferramentas') and not d.get('ferramenta_escolha'):
              raise SystemExit(f'{iid}: proficiência de ferramenta ausente')
            eq=d['equipamento_inicial'].get('opcoes',[])
            if len(eq) != 2 or eq[1].get('itens',[{}])[0].get('quantidade') != 50:
              raise SystemExit(f'{iid}: opções de equipamento incompletas')
            if not item.get('controle',{}).get('completo') or item['controle'].get('status_completude') != 'publicado':
              raise SystemExit(f'{iid}: completude inválida')
          data['controle']['validado']=True
          data['controle']['quantidade']=4
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Compatibilidade com o endereço genérico antigo do módulo.
          gp=Path('biblioteca.html')
          s=gp.read_text(encoding='utf-8')
          old="""  if (modulo === 'Regras') {
    renderRegras();
  } else {
"""
          new="""  if (modulo === 'Regras') {
    renderRegras();
  } else if (modulo === 'Antecedentes') {
    location.replace('antecedentes.html?v=20260818-1541');
  } else {
"""
          if old not in s and "modulo === 'Antecedentes'" not in s:
            raise SystemExit('Não foi possível localizar o roteamento genérico da Biblioteca')
          if old in s:
            s=s.replace(old,new,1)
            gp.write_text(s,encoding='utf-8')
          PY
      - name: Remover workflow temporário
        run: rm -f .github/workflows/finalizar-antecedentes-srd-5-2-1.yml
      - name: Publicar validação final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finaliza 4 antecedentes SRD 5.2.1 com versionamento e validação"
          git pull --rebase origin main
          git push
