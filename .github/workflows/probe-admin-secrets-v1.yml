name: Probe Secrets administrativos v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-admin-secrets-v1.yml'

permissions:
  contents: read

env:
  E2E_FIREBASE_ADMIN_USERNAME: ${{ secrets.E2E_FIREBASE_ADMIN_USERNAME }}
  E2E_FIREBASE_ADMIN_PASSWORD: ${{ secrets.E2E_FIREBASE_ADMIN_PASSWORD }}

jobs:
  probe:
    name: Verificar presença sem expor valores
    runs-on: ubuntu-latest
    steps:
      - name: Preflight dos dois Secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in E2E_FIREBASE_ADMIN_USERNAME E2E_FIREBASE_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name ausente."
              missing=1
            else
              echo "$name presente."
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Os dois Secrets administrativos estão configurados."
