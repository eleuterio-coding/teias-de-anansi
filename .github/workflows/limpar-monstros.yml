name: Limpar conteúdo do módulo Monstros

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/limpar-monstros.yml'

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover conteúdo e referências de Monstros
        run: |
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p = Path('biblioteca.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  <script src="monstros.js"></script>\n', '')
          s = s.replace('  <script src="monstros-statblocks.js"></script>\n', '')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f monstros.js monstros-statblocks.js
          rm -f .github/workflows/aplicar-statblocks-monstros.yml
          rm -f .github/workflows/limpar-monstros.yml

      - name: Publicar limpeza
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Limpa conteúdo do módulo Monstros"
          git push
