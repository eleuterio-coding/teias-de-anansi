name: Verificar Etapa 2 — Design System

on:
  push:
    branches:
      - feature/etapa-2-design-system-20261120

permissions:
  contents: read

jobs:
  verificacao:
    name: Tipos, lint, testes, formatação e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter arquivos da branch
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências fixadas
        id: install
        run: npm ci

      - name: Verificar contrato obrigatório dos módulos (2.11)
        run: npm run verify:design-system

      - name: Verificar base integrada (2.12)
        run: npm run check

      # Executar auditorias mesmo se o Vitest interromper o check geral.
      # Nenhuma dessas etapas publica ou escreve no repositório.
      - name: Conferir formatação independentemente (2.12)
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Compilar independentemente (2.12)
        id: independent_build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Conferir artefato Pages sem publicar (2.12)
        if: ${{ always() && steps.independent_build.outcome == 'success' }}
        run: npm run pages:check
