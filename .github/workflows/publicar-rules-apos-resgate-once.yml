name: Etapa 3.09 - publicar Rules A apos site restaurado B
on:
  push:
    branches:
      - feature/etapa-3-usuarios-acesso-20261120
    paths:
      - .github/workflows/publicar-rules-apos-resgate-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: publicacao-etapa-3
  cancel-in-progress: false
jobs:
  publicar-a:
    name: Conferir B, backup cifrado, publicar e verificar Rules A
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_TELEMETRY: '1'
      GCLOUD_PROJECT: demo-teias-305
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/etapa-3-usuarios-acesso-20261120
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar e testar Hub antes de alterar Firebase
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Testar a integridade das Rules em ambiente totalmente isolado
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --legacy-peer-deps --no-audit --no-fund @firebase/rules-unit-testing@6.0.0 firebase-tools@15.37.0
          npx firebase emulators:exec --only firestore --project demo-teias-305 --config tests/firestore-emulator/firebase.json "node tests/firestore-emulator/run.mjs"
      - name: Conferir site B existente e main sem alteracao inesperada ANTES DE A
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://api.github.com/repos/eleuterio-coding/teias-de-anansi';
          const headers={authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'};
          async function get(path){
            const r=await fetch(base+path,{headers,signal:AbortSignal.timeout(20000)});
            assert.ok(r.ok,'GET '+path+' status '+r.status);
            return r.json();
          }
          const main=await get('/commits/main');
          assert.equal(main.sha,'b8479db3b3be882a004911d41ba1a30f27a456ee');
          const page=await get('/pages');
          assert.equal(page.build_type,'legacy');
          assert.equal(page.status,'built');
          assert.equal(page.source?.branch,'main');
          assert.equal(page.source?.path,'/');
          assert.equal(page.html_url,'https://eleuterio-coding.github.io/teias-de-anansi/');
          console.log('RULES_A_GATE_SITE_B_READY: main, Pages legacy built e URL preservada');
          NODE
          node scripts/verify-live-hub-pages.mjs
      - name: Auditar Auth, perfis, midias e chunks em producao apenas GET
        env:
          FIREBASE_SERVICE_ACCOUNT_TEIAS_DE_ANANSI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEIAS_DE_ANANSI }}
        run: node scripts/audit-media-legacy-readonly.mjs
      - name: Verificar Rules historicas e preparar backup AES-256-GCM
        env:
          FIREBASE_SERVICE_ACCOUNT_TEIAS_DE_ANANSI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEIAS_DE_ANANSI }}
        run: node scripts/deploy-etapa-3-rules.mjs prepare
      - name: Guardar backup criptografado antes de qualquer escrita
        uses: actions/upload-artifact@v4
        with:
          name: backup-rules-criptografado-publicacao-a-${{ github.run_id }}
          path: .deploy-private/rules-backup.aes256gcm.json
          if-no-files-found: error
          retention-days: 30
      - name: Conferir main intacta imediatamente antes de publicar A
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const r=await fetch('https://api.github.com/repos/eleuterio-coding/teias-de-anansi/commits/main',{headers:{
            authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json',
          },signal:AbortSignal.timeout(15000)});
          assert.ok(r.ok);
          assert.equal((await r.json()).sha,'b8479db3b3be882a004911d41ba1a30f27a456ee');
          console.log('RULES_A_MAIN_IMUTAVEL: build B confirmado');
          NODE
      - name: PUBLICAR A - regras Firestore restritas
        env:
          FIREBASE_SERVICE_ACCOUNT_TEIAS_DE_ANANSI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEIAS_DE_ANANSI }}
        run: node scripts/deploy-etapa-3-rules.mjs publish
      - name: Confirmar hash e release das Rules ativas
        env:
          FIREBASE_SERVICE_ACCOUNT_TEIAS_DE_ANANSI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEIAS_DE_ANANSI }}
        run: node scripts/deploy-etapa-3-rules.mjs verify
      - name: Confirmar que site B continua acessivel apos A
        run: node scripts/verify-live-hub-pages.mjs
      - name: Limpar temporarios confidenciais
        if: always()
        run: rm -rf .deploy-private
