name: Etapa 3.09 - verificacao final site apos limpeza da main (unica)
on:
  push:
    branches:
      - feature/etapa-3-usuarios-acesso-20261120
    paths:
      - .github/workflows/verificar-encerramento-309-once.yml
permissions:
  contents: read
jobs:
  conferir:
    name: Pages legacy e build publicado intactos
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/etapa-3-usuarios-acesso-20261120
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reconstituir build conhecido sem escrever em producao
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Confirmar HTML e JS reais no endereco publicado
        run: node scripts/verify-live-hub-pages.mjs
      - name: Confirmar mode Pages, main e ausencia dos workflows obsoletos
        env:
          GITHUB_TOKEN_READONLY: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://api.github.com/repos/eleuterio-coding/teias-de-anansi';
          const headers={ authorization:'Bearer '+process.env.GITHUB_TOKEN_READONLY,
            accept:'application/vnd.github+json', 'x-github-api-version':'2022-11-28' };
          async function get(path) {
            const r=await fetch(base+path,{headers,signal:AbortSignal.timeout(15000)});
            assert.ok(r.ok,'GET '+path+' HTTP '+r.status);
            return r.json();
          }
          const main=await get('/commits/main');
          assert.equal(main.sha,'a577d44694a1f471308c17f2dd20f1766d68c798');
          const page=await get('/pages');
          assert.equal(page.build_type,'legacy');
          assert.equal(page.source?.branch,'main');
          assert.equal(page.source?.path,'/');
          assert.equal(page.html_url,'https://eleuterio-coding.github.io/teias-de-anansi/');
          assert.equal(page.status,'built');
          const root=await get('/contents?ref=main');
          const names=new Set(root.map(x=>x.name));
          for(const name of ['index.html','assets','.nojekyll','README.md'])
            assert.ok(names.has(name),'Arquivo publico ausente: '+name);
          const index=await get('/contents/index.html?ref=main');
          assert.equal(index.type,'file');
          const code=await get('/contents/assets/index-Znu1Dy7h.js?ref=main');
          assert.equal(code.type,'file');
          console.log('ETAPA309_POST_CLEANUP_OK: main HEAD correto; Pages legacy built; index+JS+README intactos');
          NODE
