name: Publicar classes abertas SRD 5.2.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-classes-srd-5-2-1.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair, normalizar e validar classes
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path

          PIN='bfd3db4bcc31699cce703b46feb9af3f0ff08999'
          BASE=f'https://raw.githubusercontent.com/5e-bits/5e-database/{PIN}/src/2024/en'
          EXPECTED=['barbarian','bard','cleric','druid','fighter','monk','paladin','ranger','rogue','sorcerer','warlock','wizard']
          OVERVIEWS={
            'barbarian':('Guerreiro movido por poder primal e Fúria, especializado em resistência, força e pressão ofensiva.','Poder primal, ferocidade e resistência.','Combatente corpo a corpo resistente e agressivo.'),
            'bard':('Conjurador e especialista versátil que transforma arte, inspiração e conhecimento em magia, apoio e controle.','Arte, inspiração e magia.','Suporte versátil, perícias, controle e conjuração.'),
            'cleric':('Campeão de poder divino que combina magia, proteção, cura e capacidade de enfrentar ameaças diretamente.','Poder divino e devoção.','Conjurador divino de suporte, proteção e combate.'),
            'druid':('Conjurador primal ligado às forças da natureza, capaz de combinar magia, transformação e controle ambiental.','Natureza, transformação e poder primal.','Conjurador primal versátil, controle, suporte e transformação.'),
            'fighter':('Especialista marcial completo, treinado para dominar armas, armaduras, maestrias e técnicas adaptáveis de combate.','Disciplina e excelência marcial.','Combatente altamente adaptável e consistente.'),
            'monk':('Artista marcial que converte disciplina e foco sobrenatural em mobilidade, defesa e ataques desarmados precisos.','Disciplina, foco e artes marciais.','Combatente móvel, técnico e controlador.'),
            'paladin':('Guerreiro sagrado ligado a juramentos, combinando armamento pesado, proteção, cura e magia divina.','Juramentos, devoção e poder sagrado.','Defensor e atacante marcial com suporte mágico.'),
            'ranger':('Guerreiro explorador que combina perícia marcial, mobilidade, conhecimento do ambiente e magia primal.','Exploração, caça e magia primal.','Combatente versátil de exploração e precisão.'),
            'rogue':('Especialista em precisão, mobilidade, furtividade e perícias, capaz de explorar oportunidades para causar grande impacto.','Astúcia, precisão e perícia.','Especialista móvel, furtivo e de alta precisão.'),
            'sorcerer':('Conjurador cujo poder mágico é inato, moldando magia por meio de Carisma e recursos que alteram a forma de conjurar.','Magia inata e transformação arcana.','Conjurador explosivo e flexível por Metamagia.'),
            'warlock':('Ocultista que recebe e desenvolve poderes sobrenaturais por pactos e invocações, com uma estrutura própria de conjuração.','Pactos, invocações e poder oculto.','Conjurador customizável com recursos de recuperação curta.'),
            'wizard':('Estudioso da magia arcana que registra, prepara e domina um repertório amplo de magias por estudo sistemático.','Estudo arcano e domínio de grimório.','Conjurador de grande amplitude e preparação tática.')
          }

          def get_json(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Teias-de-Anansi-Hub/1.0'})
            with urllib.request.urlopen(req,timeout=45) as r:
              return json.loads(r.read().decode('utf-8'))

          classes=get_json(f'{BASE}/5e-SRD-Classes.json')
          levels=get_json(f'{BASE}/5e-SRD-Levels.json')
          features=get_json(f'{BASE}/5e-SRD-Features.json')
          fmap={f['index']:f for f in features}
          found=[c['index'] for c in classes]
          if sorted(found)!=sorted(EXPECTED):
            raise SystemExit(f'Conjunto inesperado de classes: {found}')

          items=[]
          for c in classes:
            slug=c['index']
            for key in ('name','hit_die','primary_ability','saving_throws','proficiencies','starting_equipment_options','multi_classing'):
              if key not in c:
                raise SystemExit(f'{slug}: campo obrigatório ausente: {key}')
            ls=sorted([x for x in levels if x.get('class',{}).get('index')==slug],key=lambda x:x['level'])
            if [x['level'] for x in ls] != list(range(1,21)):
              raise SystemExit(f'{slug}: progressão não cobre níveis 1–20')
            refs=[]; first_level={}
            for lv in ls:
              for f in lv.get('features',[]):
                idx=f['index']
                if idx not in first_level:first_level[idx]=lv['level']
                if idx not in refs:refs.append(idx)
            feats=[]
            for idx in refs:
              if idx not in fmap:raise SystemExit(f'{slug}: feature não resolvida: {idx}')
              f=dict(fmap[idx]); text=f.get('description')
              if not isinstance(text,str) or not text.strip():raise SystemExit(f'{slug}: feature sem descrição completa: {idx}')
              f['_nivel']=first_level[idx]; feats.append(f)
            conj=None
            if c.get('spellcasting'):
              endpoint=f'https://www.dnd5eapi.co/api/2024/classes/{slug}/spells'
              payload=get_json(endpoint)
              spells=payload.get('results') if isinstance(payload,dict) else None
              if not isinstance(spells,list) or not spells:
                raise SystemExit(f'{slug}: lista de magias aberta não resolvida')
              conj=dict(c['spellcasting']); conj['lista_magias']=spells; conj['fonte_lista']=endpoint
            desc,fantasia,papel=OVERVIEWS[slug]
            items.append({
              'identidade':{'id':f'classes:srd521:{slug}','nome':c['name'],'nome_original':c['name'],'aliases':[],'slug':slug,'modulo':'Classes','subtipo':'classe'},
              'classificacao':{'categorias':['Player Class'],'tags':['SRD 5.2.1','core 2024'],'status':'atual','natureza':'SRD'},
              'conteudo':{'resumo':desc,'descricao':desc,'fantasia':fantasia,'papel':papel,'texto_integral':'Mecânica integral estruturada nos campos de progressão, características, proficiências, equipamento, multiclasse e conjuração.'},
              'mecanica':{'dados_base':c,'atributo_principal':c['primary_ability'],'dado_de_vida':c['hit_die'],'salvaguardas':c['saving_throws'],'proficiencias':{'fixas':c['proficiencies'],'escolhas':c.get('proficiency_choices',[])},'equipamento_inicial':{'opcoes':c['starting_equipment_options']},'progressao':ls,'caracteristicas':feats,'conjuracao':conj,'multiclasse':c['multi_classing']},
              'fonte':{'publicacao_id':'srd-5.2.1','titulo':'System Reference Document 5.2.1','titulo_original':'System Reference Document 5.2.1','editora':'Wizards of the Coast LLC','autores':[],'ano':2025,'data_publicacao':'2025-05-01','natureza':'SRD','ruleset':'5.5e','url_original':'https://www.dndbeyond.com/srd','transcricao_estruturada':f'https://github.com/5e-bits/5e-database/tree/{PIN}/src/2024/en'},
              'compatibilidade':{'ruleset':'5.5e','revisao_core':2024,'versao_de':f'classes:srd51:{slug}','substitui':f'classes:srd51:{slug}'},
              'relacoes':{'subclasses':[x['name'] for x in c.get('subclasses',[])],'magias':[x['name'] for x in (conj or {}).get('lista_magias',[])]},
              'assets':[],
              'controle':{'completo':True,'status_completude':'publicado','dependencias_nao_resolvidas':[],'referencias_externas':[],'avisos_de_extracao':[],'revisao_manual':False}
            })

          if len(items)!=12 or any(not x['controle']['completo'] for x in items):
            raise SystemExit('Validação final falhou')
          out={'schema':'hub-rpg/classes/v1','gerado_em':'2026-08-18','politica_sobreposicao':'5.5e/2024 substitui equivalentes 5e/2014 no catálogo ativo','controle':{'validado':True,'quantidade':12,'filtro':'somente conteúdo aberto e mecanicamente completo'},'licenca':{'nome':'Creative Commons Attribution 4.0 International','atribuicao':'This work includes material from the System Reference Document 5.2.1 (“SRD 5.2.1”) by Wizards of the Coast LLC, available at https://www.dndbeyond.com/srd. The SRD 5.2.1 is licensed under the Creative Commons Attribution 4.0 International License.'},'items':items}
          Path('dados').mkdir(exist_ok=True)
          Path('dados/classes-srd-5.2.1.json').write_text(json.dumps(out,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          p=Path('bibliotecas.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'<li><a href="classes\.html\?v=[^"]+"><span class="nome">Classes</span><span class="contagem">\d+ itens</span></a></li>', '<li><a href="classes.html?v=20260818-1530"><span class="nome">Classes</span><span class="contagem">12 itens</span></a></li>', s)
          s=s.replace('index.html?v=20260818-1525','index.html?v=20260818-1530')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remover workflow temporário
        run: rm -f .github/workflows/publicar-classes-srd-5-2-1.yml
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publica 12 classes abertas e completas do SRD 5.2.1"
          git pull --rebase origin main
          git push
