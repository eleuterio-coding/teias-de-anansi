name: Auditar regras 5e e 5.5e

on:
  push:
    branches: [main]
    paths:
      - 'dados/**'
      - 'scripts/**'
      - '*.html'
      - '.github/workflows/auditar-regras-5e-55e.yml'
  pull_request:
    paths:
      - 'dados/**'
      - 'scripts/**'
      - '*.html'
      - '.github/workflows/auditar-regras-5e-55e.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar política global
        id: global-audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/auditar_regras_5e_55e.py 2>&1 | tee /tmp/auditoria-regras.log
      - name: Publicar diagnóstico no PR
        if: steps.global-audit.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Falha na auditoria 5e/5.5e'
            echo
            echo '```text'
            cat /tmp/auditoria-regras.log
            echo '```'
          } > /tmp/auditoria-regras-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/auditoria-regras-comment.md
      - name: Reprovar política global se necessário
        if: steps.global-audit.outcome == 'failure'
        run: exit 1
      - name: Validar JavaScript auditado
        run: |
          node --check scripts/character-builder.js
          node --check scripts/character-builder/state.js
          node --check scripts/character-builder/compatibility.js
          node --check scripts/character-builder/catalogs.js
          node --check scripts/character-builder/rules.js
          node --check scripts/character-builder/rules-base.js
          node --check scripts/character-builder/language-mechanics.js
          node --check scripts/character-builder/house-rules-ui.js
          node --check scripts/character-builder/spells.js
          node --check scripts/character-builder/spell-selection-ui.js
          node --check scripts/character-builder/spell-quota-ui.js
          node --check scripts/concentracao-expandida-selos.js
          node --check scripts/regras-srd-view-v7.js
          node --check scripts/politica-regras-biblioteca.js
          node --check scripts/politica-era-cenario.js
          node --check scripts/module-clean-loader.js
