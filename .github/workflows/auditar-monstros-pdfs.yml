name: Auditar monstros PDFs
on:
  push:
    paths:
      - '.github/workflows/auditar-monstros-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auditar fontes
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')
          srcdir=root/'dados'/'monstros-fontes'
          files=['xge','xdmg','mpmm','erlw','tce','efa','fraif']
          def reasons(m):
              r=[]
              if m.get('_copy'): r.append('_copy')
              for k in ['name','size','type','ac','hp','speed','str','dex','con','int','wis','cha','cr']:
                  if m.get(k) is None: r.append('sem_'+k)
              return r
          out={'schema':'hub-rpg/auditoria-monstros-pdfs/v2','fontes':{},'faltantes_no_filtro_atual':[],'totais':{}}
          total=direct=copy=incomplete=0
          for sid in files:
              p=srcdir/f'{sid}.json'
              d=json.loads(p.read_text())
              arr=d.get('monster',[])
              info={'total':len(arr),'diretos_completos':0,'copias':0,'outros_incompletos':0,'rejeitados':[]}
              for i,m in enumerate(arr):
                  rs=reasons(m)
                  # reproduz o filtro complete5 atual do site
                  visible=(not m.get('_copy') and all(m.get(k) is not None for k in ['name','size','type','ac','hp','speed','str','dex','con','int','wis','cha','cr']))
                  if visible: info['diretos_completos']+=1
                  else:
                      if m.get('_copy'): info['copias']+=1
                      else: info['outros_incompletos']+=1
                      rec={'fonte':sid,'indice':i,'nome':m.get('name'),'pagina':m.get('page'),'motivos':rs,'copy':m.get('_copy')}
                      info['rejeitados'].append(rec)
                      out['faltantes_no_filtro_atual'].append(rec)
              out['fontes'][sid]=info
              total+=len(arr); direct+=info['diretos_completos']; copy+=info['copias']; incomplete+=info['outros_incompletos']
          extras=json.loads((root/'dados'/'monstros-pdf-extras.json').read_text()).get('items',[])
          out['extras_pdf']={'total':len(extras),'nomes':[x.get('name') for x in extras]}
          out['totais']={'estruturados':total,'visiveis_pelo_filtro_atual':direct,'copias_rejeitadas':copy,'outros_rejeitados':incomplete,'extras_pdf':len(extras),'potencial_publicado_atual':direct+len(extras)}
          (root/'dados'/'auditoria-monstros-pdfs.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out['totais'],indent=2))
          PY
      - name: Commit auditoria
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dados/auditoria-monstros-pdfs.json
          git commit -m 'Audita cobertura dos monstros dos dois PDFs' || exit 0
          git push
