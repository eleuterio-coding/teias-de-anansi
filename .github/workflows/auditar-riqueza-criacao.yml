name: Auditar riqueza de criação

on:
  pull_request:
    paths:
      - 'dados/regras-casa-adicionais.json'
      - 'scripts/character-builder/starting-equipment-rules.js'
      - 'scripts/character-builder/starting-equipment-ui.js'
      - 'scripts/character-builder/starting-equipment-review-ui.js'
      - 'scripts/character-builder/package-b-purchase-ui.js'
      - 'scripts/character-builder/background-wealth-tier-ui.js'
      - 'scripts/character-builder/wealth-purchase-ui.js'
      - 'scripts/character-builder/economy-state.js'
      - 'scripts/character-builder/post-creation-economy-guard.js'
      - 'scripts/character-builder/equipment-ownership.js'
      - 'scripts/character-builder/state.js'
      - 'scripts/character-sheet-equipment-ownership.js'
      - 'tests/auditar-riqueza-criacao.mjs'
      - 'tests/auditar-revisao-riqueza-criacao.mjs'
      - 'tests/auditar-economia-ficha.mjs'
      - 'tests/auditar-saldo-pos-criacao.mjs'
      - '.github/workflows/auditar-riqueza-criacao.yml'
  push:
    branches: [main]
    paths:
      - 'dados/regras-casa-adicionais.json'
      - 'scripts/character-builder/starting-equipment-rules.js'
      - 'scripts/character-builder/starting-equipment-ui.js'
      - 'scripts/character-builder/starting-equipment-review-ui.js'
      - 'scripts/character-builder/package-b-purchase-ui.js'
      - 'scripts/character-builder/background-wealth-tier-ui.js'
      - 'scripts/character-builder/wealth-purchase-ui.js'
      - 'scripts/character-builder/economy-state.js'
      - 'scripts/character-builder/post-creation-economy-guard.js'
      - 'scripts/character-builder/equipment-ownership.js'
      - 'scripts/character-builder/state.js'
      - 'scripts/character-sheet-equipment-ownership.js'
      - 'tests/auditar-riqueza-criacao.mjs'
      - 'tests/auditar-revisao-riqueza-criacao.mjs'
      - 'tests/auditar-economia-ficha.mjs'
      - 'tests/auditar-saldo-pos-criacao.mjs'

permissions:
  contents: read

jobs:
  riqueza-criacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Auditar fórmula, pacotes e regra normativa
        run: node tests/auditar-riqueza-criacao.mjs
      - name: Auditar resumo econômico da Revisão
        run: node tests/auditar-revisao-riqueza-criacao.mjs
      - name: Auditar persistência econômica na ficha
        run: node tests/auditar-economia-ficha.mjs
      - name: Auditar saldo atual pós-criação
        run: node tests/auditar-saldo-pos-criacao.mjs
