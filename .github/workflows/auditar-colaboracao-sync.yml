name: Auditar usuários, colaboração e sincronização — Bloco 15
on:
  pull_request:
    paths:
      - 'scripts/collaboration-model.js'
      - 'scripts/collaboration-sync.js'
      - 'scripts/firebase-collaboration-provider.js'
      - 'scripts/collaboration-ui.js'
      - 'scripts/storage-registry.js'
      - 'dados/firebase-config.json'
      - 'firebase/**'
      - 'firebase.json'
      - 'usuarios.html'
      - 'collaboration.css'
      - 'FIREBASE-PROVISIONAMENTO.md'
      - 'tests/auditar-colaboracao-sync.mjs'
      - 'tests/auditar-colaboracao-provisionamento.mjs'
      - 'ROADMAP-V1.md'
      - '.github/workflows/auditar-colaboracao-sync.yml'
  workflow_dispatch:
jobs:
  colaboracao-arquitetura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxe
        run: |
          node --check scripts/collaboration-model.js
          node --check scripts/collaboration-sync.js
          node --check scripts/firebase-collaboration-provider.js
          node --check scripts/collaboration-ui.js
          node --check tests/auditar-colaboracao-sync.mjs
      - name: 15A–15Y · Identidade, papéis, privacidade, convites e sync
        run: node tests/auditar-colaboracao-sync.mjs
      - name: Regressão de persistência e portabilidade
        run: node tests/auditar-persistencia-portabilidade.mjs
      - name: Regressão Campanhas/Mesas
        run: node tests/auditar-campanhas-mesas.mjs
      - name: Proibir Supabase
        run: |
          if grep -Rni --exclude-dir=.git --exclude='*.md' 'supabase' scripts firebase dados/firebase-config.json usuarios.html collaboration.css; then
            echo 'Backend proibido encontrado.' >&2
            exit 1
          fi
  provisionamento-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 15Z · Provedor real configurado
        run: node tests/auditar-colaboracao-provisionamento.mjs
