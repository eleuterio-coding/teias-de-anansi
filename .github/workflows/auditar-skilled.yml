name: Auditar Skilled

on:
  pull_request:
    paths:
      - 'scripts/character-builder/skilled-feat-ui.js'
      - 'scripts/character-builder/package-b-purchase-ui.js'
      - 'scripts/character-builder.js'
      - '.github/workflows/auditar-skilled.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/character-builder/skilled-feat-ui.js'
      - 'scripts/character-builder/package-b-purchase-ui.js'
      - 'scripts/character-builder.js'
      - '.github/workflows/auditar-skilled.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check scripts/character-builder/skilled-feat-ui.js
          node --check scripts/character-builder/package-b-purchase-ui.js
          node --check scripts/character-builder.js
      - name: Testar escolhas do Skilled
        run: |
          node --input-type=module <<'JS'
          const mod=await import('./scripts/character-builder/skilled-feat-ui.js');
          let rows=[];
          rows=mod.setSkilledDraftRow(rows,0,'skill','Arcanismo');
          rows=mod.setSkilledDraftRow(rows,1,'tool','Ferramentas de ladrão');
          rows=mod.setSkilledDraftRow(rows,2,'skill','Percepção');
          if(rows.filter(mod.skilledRowComplete).length!==3)throw new Error('Skilled deve aceitar três escolhas completas em qualquer combinação.');
          const available=mod.availableSkilledSkills(['História','Persuasão'],rows,0);
          if(available.includes('História')||available.includes('Persuasão'))throw new Error('Perícias já existentes no personagem não podem aparecer no Skilled.');
          if(available.includes('Percepção'))throw new Error('Perícia usada em outra escolha do Skilled não pode aparecer novamente.');
          if(!available.includes('Arcanismo'))throw new Error('A escolha atual válida deve permanecer disponível no próprio campo.');
          const pruned=mod.pruneUnavailableSkilledSkills(['Arcanismo'],rows);
          if(!pruned.changed||pruned.rows[0]?.value)throw new Error('Uma escolha do Skilled deve ser limpa se a perícia passar a vir de outra fonte.');
          if(pruned.rows[1]?.value!=='Ferramentas de ladrão')throw new Error('Ferramentas não devem ser removidas pelo filtro de perícias existentes.');
          console.log('Skilled validado: exclui perícias já proficientes e preserva escolhas válidas.');
          JS
      - name: Verificar integração no construtor
        run: |
          python - <<'PY'
          from pathlib import Path
          skilled=Path('scripts/character-builder/skilled-feat-ui.js').read_text(encoding='utf-8')
          package=Path('scripts/character-builder/package-b-purchase-ui.js').read_text(encoding='utf-8')
          builder=Path('scripts/character-builder.js').read_text(encoding='utf-8')
          assert "addEventListener('change',onChange,true)" in skilled, 'A interface do Skilled deve interceptar suas próprias escolhas.'
          assert 'Escolha uma perícia ou ferramenta' in skilled
          assert '<optgroup label="Perícias">' in skilled
          assert "'Ferramenta…'" in skilled
          assert 'availableSkilledSkills' in skilled and 'pruneUnavailableSkilledSkills' in skilled
          assert 'existingSkillsExcludingSkilled' in skilled and 'derive()?.skills' in skilled
          assert 'hub:class-skills-changed' in skilled
          assert 'data-skilled-direct' in skilled and 'data-skilled-tool' in skilled
          assert 'initSkilledFeatUi' in package
          assert 'skilled-feat-ui.js?v=20260825-skilled-existing1' in package
          assert 'package-b-purchase-ui.js?v=20260831-magic-rarity2' in builder
          assert 'wealth-purchase-ui.js?v=20260831-magic-rarity2' in package
          assert 'supabase' not in (skilled+package).lower()
          print('Integração do Skilled com filtro de perícias existentes e revisão de riqueza vigente validada.')
          PY
