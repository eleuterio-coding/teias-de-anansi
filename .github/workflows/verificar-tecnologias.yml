name: Validar tecnologias, navegacao e build Pages - etapa 1

on:
  push:
    branches:
      - feature/etapa-1-fundacao-8-etapas
  workflow_dispatch:

# Permissao TEMPORARIA para resolver o lockfile na branch isolada.
# Remover ao concluir o item 1.07.
permissions:
  contents: write

jobs:
  validacao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter codigo da branch
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolver lockfile atualizado
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Instalar dependencias reproduziveis
        run: npm ci --no-audit --no-fund
      - name: Conferir tipos TypeScript
        run: npm run typecheck
      - name: Verificar ESLint
        run: npm run lint
      - name: Executar Vitest
        run: npm run test:run
      - name: Conferir Prettier
        run: npm run format:check
      - name: Compilar aplicacao minima
        run: npm run build
      - name: Validar referencias do build para GitHub Pages
        run: npm run pages:check
      - name: Registrar lockfile APENAS na branch de fundacao apos validacoes
        if: github.ref_name == 'feature/etapa-1-fundacao-8-etapas'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(1.07): atualizar lockfile Firebase [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Arquivar build como artefato de CI sem deploy
        uses: actions/upload-artifact@v4
        with:
          name: teias-de-anansi-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
