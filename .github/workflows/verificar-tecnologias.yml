name: Validar tecnologias, navegação e build Pages - etapa 1

on:
  push:
    branches:
      - feature/etapa-1-fundacao-8-etapas
  workflow_dispatch:

# Apenas leitura. Nenhuma permissão pages:write ou id-token:write.
permissions:
  contents: read

jobs:
  validacao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código da branch
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências reproduzíveis
        run: npm ci --no-audit --no-fund
      - name: Conferir tipos TypeScript
        run: npm run typecheck
      - name: Verificar ESLint
        run: npm run lint
      - name: Executar Vitest
        run: npm run test:run
      - name: Conferir Prettier
        run: npm run format:check
      - name: Compilar aplicação mínima
        run: npm run build
      - name: Validar referências do build para GitHub Pages
        run: npm run pages:check
      - name: Arquivar build apenas como artefato de CI (sem deploy)
        uses: actions/upload-artifact@v4
        with:
          name: teias-de-anansi-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
