name: Verificar tecnologias - etapa 1.04

on:
  push:
    branches:
      - feature/etapa-1-fundacao-8-etapas
  workflow_dispatch:

# Lockfile já versionado; validação somente leitura, sem publicação.
permissions:
  contents: read

jobs:
  tecnologias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código da branch
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências reproduzíveis
        run: npm ci --no-audit --no-fund
      - name: Conferir tipos TypeScript
        run: npm run typecheck
      - name: Verificar ESLint
        run: npm run lint
      - name: Executar Vitest
        run: npm run test:run
      - name: Conferir Prettier
        run: npm run format:check
      - name: Compilar aplicação mínima
        run: npm run build
      - name: Garantir ausência de publicação
        run: |
          echo "Verificação técnica concluída sem deployment ou alterações no Firebase."
