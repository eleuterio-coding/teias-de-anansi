name: Validar tecnologias, navegacao e Firebase planejado - etapa 1

on:
  push:
    branches:
      - feature/etapa-1-fundacao-8-etapas
  workflow_dispatch:

# Sem gravacao no repositorio e sem permissao de publicar GitHub Pages.
permissions:
  contents: read

jobs:
  validacao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter codigo da branch
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias reproduziveis
        run: npm ci --no-audit --no-fund
      - name: Conferir tipos TypeScript
        run: npm run typecheck
      - name: Verificar ESLint
        run: npm run lint
      - name: Executar Vitest (SDK Firebase simulado, sem rede real)
        run: npm run test:run
      - name: Conferir Prettier
        run: npm run format:check
      - name: Compilar aplicacao minima
        run: npm run build
      - name: Validar referencias do build para GitHub Pages
        run: npm run pages:check
      - name: Arquivar build somente como artefato de CI (sem deploy)
        uses: actions/upload-artifact@v4
        with:
          name: teias-de-anansi-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
