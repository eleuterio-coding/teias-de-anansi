name: Auditar upload de imagens

on:
  pull_request:
    paths:
      - 'scripts/image-media.js'
      - 'scripts/campaign-state.js'
      - 'scripts/adventure-state.js'
      - 'scripts/campaign-list-ui.js'
      - 'scripts/campaign-table-ui.js'
      - 'scripts/campaign-table-router.js'
      - 'scripts/adventure-ui.js'
      - 'scripts/adventure-router.js'
      - 'scripts/campaign-sessions-ui.js'
      - 'scripts/collaboration-model.js'
      - 'scripts/firebase-collaboration-provider.js'
      - 'firebase/firestore.rules'
      - 'campanhas.html'
      - 'aventuras.html'
      - 'sessoes.html'
      - 'tests/auditar-upload-imagens.mjs'
      - '.github/workflows/auditar-upload-imagens.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/image-media.js'
      - 'scripts/campaign-state.js'
      - 'scripts/adventure-state.js'
      - 'scripts/campaign-list-ui.js'
      - 'scripts/campaign-table-ui.js'
      - 'scripts/campaign-table-router.js'
      - 'scripts/adventure-ui.js'
      - 'scripts/adventure-router.js'
      - 'scripts/campaign-sessions-ui.js'
      - 'scripts/collaboration-model.js'
      - 'scripts/firebase-collaboration-provider.js'
      - 'firebase/firestore.rules'
      - 'campanhas.html'
      - 'aventuras.html'
      - 'sessoes.html'
      - 'tests/auditar-upload-imagens.mjs'
      - '.github/workflows/auditar-upload-imagens.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditar pipeline de imagens
        run: node tests/auditar-upload-imagens.mjs
