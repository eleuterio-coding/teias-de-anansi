name: Publicar regras do Firestore

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - 'scripts/deploy-firestore-rules-rest.mjs'
      - 'e2e/collaboration-real.spec.js'
      - '.github/workflows/deploy-firestore-rules.yml'

permissions:
  contents: read

concurrency:
  group: deploy-firestore-rules-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: teais-de-anansi
  E2E_FIREBASE_ADMIN_USERNAME: ${{ secrets.E2E_FIREBASE_ADMIN_USERNAME }}
  E2E_FIREBASE_ADMIN_PASSWORD: ${{ secrets.E2E_FIREBASE_ADMIN_PASSWORD }}

jobs:
  validar-e-publicar:
    name: Validar, publicar e homologar Security Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências do projeto
        run: npm install --no-audit --no-fund

      - name: Auditar contrato de colaboração
        run: |
          node tests/auditar-colaboracao-provisionamento.mjs
          node tests/auditar-colaboracao-sync.mjs

      - name: Exigir credenciais
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEIAS_DE_ANANSI }}
        run: |
          missing=0
          for name in FIREBASE_SERVICE_ACCOUNT E2E_FIREBASE_ADMIN_USERNAME E2E_FIREBASE_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name não está configurado nos GitHub Actions Secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Publicar Firestore Security Rules pela API oficial
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEIAS_DE_ANANSI }}
        run: node scripts/deploy-firestore-rules-rest.mjs

      - name: Instalar Chromium para homologação real
        run: npx playwright install --with-deps chromium

      - name: Homologar Firebase real · Mestre x Jogador
        run: npm run test:e2e:firebase

      - name: Guardar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-firestore-rules-report
          path: playwright-report/
          retention-days: 7

      - name: Confirmar publicação
        run: echo "Firestore Security Rules publicadas e homologadas no projeto $FIREBASE_PROJECT_ID."
