name: Publicar regras do Firestore

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firestore-rules.yml'

permissions:
  contents: read

concurrency:
  group: deploy-firestore-rules-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: teais-de-anansi

jobs:
  validar-e-publicar:
    name: Validar e publicar Security Rules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Auditar contrato de colaboração
        run: |
          node tests/auditar-colaboracao-provisionamento.mjs
          node tests/auditar-colaboracao-sync.mjs

      - name: Exigir credencial de deploy
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEIAS_DE_ANANSI }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::O secret FIREBASE_SERVICE_ACCOUNT_TEIAS_DE_ANANSI não está configurado."
            exit 1
          fi

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEIAS_DE_ANANSI }}
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Publicar Firestore Security Rules
        run: >-
          npx --yes firebase-tools@latest deploy
          --only firestore:rules
          --project "$FIREBASE_PROJECT_ID"
          --non-interactive
          --force

      - name: Confirmar publicação
        run: echo "Firestore Security Rules publicadas no projeto $FIREBASE_PROJECT_ID."
