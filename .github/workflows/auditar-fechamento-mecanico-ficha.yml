name: Auditar fechamento mecânico da Ficha — Bloco 10

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ROADMAP-V1.md'
      - 'scripts/character-builder/**'
      - 'scripts/character-builder.js'
      - 'scripts/character-sheet*.js'
      - 'tests/auditar-fechamento-mecanico-ficha.mjs'
      - 'tests/auditar-barbarian-core-bloco10.mjs'
      - 'tests/auditar-magic-item-state-bloco10.mjs'
      - '.github/workflows/auditar-fechamento-mecanico-ficha.yml'
  push:
    branches: [main]
    paths:
      - 'ROADMAP-V1.md'
      - 'scripts/character-builder/**'
      - 'scripts/character-builder.js'
      - 'scripts/character-sheet*.js'
      - 'tests/auditar-fechamento-mecanico-ficha.mjs'
      - 'tests/auditar-barbarian-core-bloco10.mjs'
      - 'tests/auditar-magic-item-state-bloco10.mjs'
      - '.github/workflows/auditar-fechamento-mecanico-ficha.yml'

permissions:
  contents: read

jobs:
  fechamento-mecanico-ficha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe dos gates
        run: |
          node --check tests/auditar-fechamento-mecanico-ficha.mjs
          node --check tests/auditar-barbarian-core-bloco10.mjs
          node --check tests/auditar-magic-item-state-bloco10.mjs
      - name: 10A–10D · Cobertura estrutural e efeitos existentes
        run: node tests/auditar-fechamento-mecanico-ficha.mjs
      - name: 10E · Núcleo mecânico do Bárbaro
        run: node tests/auditar-barbarian-core-bloco10.mjs
      - name: 10F · Estado persistente de itens mágicos
        run: node tests/auditar-magic-item-state-bloco10.mjs
