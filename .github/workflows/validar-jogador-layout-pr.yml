name: Validar Jornada do Jogador — layout e permissões

on:
  pull_request:
    paths:
      - '.github/workflows/validar-jogador-layout-pr.yml'
      - 'e2e/player-visibility.spec.js'
      - 'scripts/campaign-player-view.js'
      - 'scripts/adventure-router.js'
      - 'scripts/campaign-table-router.js'
      - 'scripts/campaign-sessions-ui.js'
      - 'scripts/character-list-ui.js'
      - 'scripts/campaign-shared-layout.js'
      - 'scripts/collaboration-view.js'
      - 'hub-components.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jogador:
    name: Jogador ${{ matrix.version }} — desktop/mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: [baseline-main, design-pr]
    steps:
      - name: Checkout da versão correspondente
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version == 'baseline-main' && (github.event.pull_request.base.sha || 'main') || (github.event.pull_request.head.sha || github.sha) }}
      - name: Aplicar a mesma especificação isolada à main, sem alterar a branch
        if: matrix.version == 'baseline-main'
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git show "${{ github.event.pull_request.head.sha || github.sha }}:e2e/player-visibility.spec.js" > e2e/player-visibility.spec.js
      - name: Registrar revisão da aplicação
        run: git log -1 --format="%H %s"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar testes de navegador
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verificar visibilidade, Aventura atribuída e bloqueio de edição
        run: npx playwright test e2e/player-visibility.spec.js --project=desktop-chromium --project=mobile-chromium --reporter=line
      - name: Preservar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jogador-layout-${{ matrix.version }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
