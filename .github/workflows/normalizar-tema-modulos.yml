name: Normalizar tema claro dos módulos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: normalizar-tema-modulos
  cancel-in-progress: true

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Aplicar tema claro aos módulos da Biblioteca
        id: tema
        shell: bash
        run: |
          python scripts/normalizar_tema_modulos.py
          if git diff --quiet -- '*.html'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Persistir páginas normalizadas
        if: steps.tema.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.html
          git commit -m "Normaliza tema claro dos módulos da Biblioteca"
          git push origin HEAD:main

      - name: Republicar GitHub Pages com páginas normalizadas
        if: steps.tema.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run deploy-pages.yml --ref main
