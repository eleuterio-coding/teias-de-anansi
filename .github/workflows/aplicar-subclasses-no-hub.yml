name: Aplicar Subclasses no Hub

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aplicar-subclasses-no-hub.yml'
      - 'subclasses.html'

permissions:
  contents: write

jobs:
  patch-biblioteca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ligar catálogo de Subclasses à Biblioteca
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('biblioteca.html')
          html = path.read_text(encoding='utf-8')

          old_count = "const CONTAGENS = Object.fromEntries(MODULOS.map(m => [m, m === 'Regras' ? REGRAS.length : 0]));"
          new_count = old_count + "\nCONTAGENS.Subclasses = 129;"
          if new_count not in html:
              if old_count not in html:
                  raise SystemExit('Não encontrei a definição esperada de CONTAGENS')
              html = html.replace(old_count, new_count, 1)

          old_link = """function linkModulo(nome) {
            return `biblioteca.html?modulo=${encodeURIComponent(nome)}`;
          }"""
          new_link = """function linkModulo(nome) {
            if (nome === 'Subclasses') return 'subclasses.html';
            return `biblioteca.html?modulo=${encodeURIComponent(nome)}`;
          }"""
          if new_link not in html:
              if old_link not in html:
                  raise SystemExit('Não encontrei a função linkModulo esperada')
              html = html.replace(old_link, new_link, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Publicar correção
        run: |
          if git diff --quiet -- biblioteca.html; then
            echo "Biblioteca já está ligada às Subclasses."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biblioteca.html
          git commit -m "Liga Subclasses ao menu Biblioteca"
          git push
