name: Normalizar rules.js central com segurança

on:
  push:
    branches: [audit/normativa-total-criacao]
    paths:
      - '.github/workflows/normalizar-rules-central-seguro.yml'

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/normativa-total-criacao
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalizar motor central e propagar invalidação de cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          REV='20260831-class-tools1'
          central=re.compile(r'(?<![A-Za-z0-9_-])rules\.js\?v=[A-Za-z0-9._-]+')
          runtime=list(Path('scripts').rglob('*.js'))
          html=list(Path('.').glob('*.html'))
          changed=set()

          # 1) Altera somente imports do motor central rules.js.
          scope=list(Path('scripts/character-builder').rglob('*.js'))+list(Path('scripts').glob('character-sheet*.js'))
          for p in scope:
              text=p.read_text(encoding='utf-8')
              new=central.sub(f'rules.js?v={REV}',text)
              if new!=text:
                  p.write_text(new,encoding='utf-8')
                  changed.add(p)

          # 2) Propaga a nova revisão pelos importadores dos arquivos efetivamente alterados.
          #    É um fechamento transitivo: se A mudou e B importa A, B é invalidado; se C importa B, C também.
          candidates=runtime+html
          progressed=True
          while progressed:
              progressed=False
              names={p.name for p in changed}
              for p in candidates:
                  text=p.read_text(encoding='utf-8')
                  new=text
                  for name in names:
                      pat=re.compile(rf'(?<![A-Za-z0-9_-]){re.escape(name)}\?v=[A-Za-z0-9._-]+')
                      new=pat.sub(f'{name}?v={REV}',new)
                  if new!=text:
                      p.write_text(new,encoding='utf-8')
                      if p not in changed:
                          changed.add(p)
                          progressed=True

          # 3) Atualiza o teste de regressão para a revisão única que agora atravessa a cadeia alterada.
          p=Path('tests/auditar-criacao-sem-travamento.mjs')
          text=p.read_text(encoding='utf-8')
          new=re.sub(r"const REV='[^']+'",f"const REV='{REV}'",text)
          new=re.sub(r"const SKILL_REV='[^']+'",f"const SKILL_REV='{REV}'",new)
          new=re.sub(r"const WEALTH_REV='[^']+'",f"const WEALTH_REV='{REV}'",new)
          if new!=text:
              p.write_text(new,encoding='utf-8')
              changed.add(p)

          print(f'Arquivos alterados: {len(changed)}')
          for p in sorted(changed,key=str): print(p)
          PY
      - name: Provar que revisões internas de módulos especializados foram preservadas
        run: |
          git diff -- scripts | grep -E '^[-+].*(ability-score-rules|spell-progression-rules|starting-equipment-rules|skill-check-mechanics)\.js\?v=' && exit 1 || true
      - name: Validar antes de publicar
        run: |
          node tests/auditar-revisao-unica-rules.mjs
          node tests/auditar-criacao-sem-travamento.mjs
          find scripts/character-builder -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Publicar normalização
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts '*.html' tests/auditar-criacao-sem-travamento.mjs
          git commit -m 'Unifica rules.js central e propaga invalidação de cache'
          git push origin HEAD:audit/normativa-total-criacao
