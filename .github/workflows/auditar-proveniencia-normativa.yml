name: Auditar proveniência normativa da criação

on:
  pull_request:
    paths:
      - 'dados/auditoria-criacao-escopo.json'
      - 'dados/auditoria-normativa-*.json'
      - 'dados/fontes-normativas-criacao.json'
      - 'dados/precedencia-subclasses.json'
      - 'dados/politica-compatibilidade-5e-5.5e.json'
      - 'dados/classes-base-2024.json'
      - 'dados/classes-ptbr/**'
      - 'dados/artificer-2025.json'
      - 'dados/subclasses-*.json'
      - 'dados/especies-*.json'
      - 'dados/tiefling-variantes.json'
      - 'dados/antecedentes-*.json'
      - 'dados/talentos-*.json'
      - 'dados/idiomas-*.json'
      - 'dados/armas-*.json'
      - 'dados/armaduras-*.json'
      - 'dados/equipamentos-*.json'
      - 'dados/ferramentas-*.json'
      - 'dados/maestrias-de-arma-pdfs.json'
      - 'dados/itens-magicos/**'
      - 'dados/magias-*.json'
      - 'dados/regras-*.json'
      - 'dados/localizacao-*.json'
      - 'scripts/character-builder/**'
      - 'scripts/character-builder.js'
      - 'criacao-personagem.html'
      - 'tests/auditar-proveniencia-normativa.mjs'
      - 'tests/auditar-semantica-*.mjs'
      - 'tests/auditar-precedencia-*.mjs'
      - 'tests/auditar-ferramentas-classe.mjs'
      - 'tests/auditar-revisao-unica-rules.mjs'
      - '.github/workflows/auditar-proveniencia-normativa.yml'
  push:
    branches: [main]
    paths:
      - 'dados/**'
      - 'scripts/character-builder/**'
      - 'scripts/character-builder.js'
      - 'criacao-personagem.html'
      - 'tests/auditar-proveniencia-normativa.mjs'
      - 'tests/auditar-semantica-*.mjs'
      - 'tests/auditar-precedencia-*.mjs'
      - 'tests/auditar-ferramentas-classe.mjs'
      - 'tests/auditar-revisao-unica-rules.mjs'
      - '.github/workflows/auditar-proveniencia-normativa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proveniencia-normativa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 11A · Validar proveniência normativa fail-closed
        run: node tests/auditar-proveniencia-normativa.mjs
      - name: 11B · Validar semântica das classes core 2024
        run: node tests/auditar-semantica-classes-core.mjs
      - name: 11B · Validar ferramentas de Classe
        run: node tests/auditar-ferramentas-classe.mjs
      - name: 11B · Validar subclasses PHB 2024
        run: node tests/auditar-semantica-subclasses-phb-2024.mjs
      - name: 11B · Validar semântica das subclasses Tasha 2020
        run: node tests/auditar-semantica-subclasses-tasha-2020.mjs
      - name: 11B · Validar semântica das subclasses Xanathar 2017
        run: node tests/auditar-semantica-subclasses-xanathar-2017.mjs
      - name: 11B · Validar semântica das subclasses Forge 2025
        run: node tests/auditar-semantica-subclasses-forge-2025.mjs
      - name: 11B · Validar semântica das subclasses Heroes of Faerûn 2025
        run: node tests/auditar-semantica-subclasses-heroes-faerun-2025.mjs
      - name: 11B/11C · Validar Quickstone 2024 como terceiro compatível
        run: node tests/auditar-semantica-subclasses-quickstone-2024.mjs
      - name: 11B/11C · Validar L’Arsène como terceiro compatível
        run: node tests/auditar-semantica-subclasses-larsene-ledger-2024.mjs
      - name: 11B · Validar espécies PHB 2024
        run: node tests/auditar-semantica-especies-phb-2024.mjs
      - name: 11B · Validar espécies Forge 2025
        run: node tests/auditar-semantica-especies-forge-2025.mjs
      - name: 11B/11C · Validar espécies Quickstone 2024 como terceiro compatível
        run: node tests/auditar-semantica-especies-quickstone-2024.mjs
      - name: 11B/11C · Validar espécies MotM 2022 como legado compatível
        run: node tests/auditar-semantica-especies-motm-2022.mjs
      - name: 11C · Validar precedência Tiefling 2024, legado e Quickstone
        run: node tests/auditar-precedencia-tiefling.mjs
      - name: 11B · Validar antecedentes PHB 2024
        run: node tests/auditar-semantica-antecedentes-phb-2024.mjs
      - name: 11C · Validar precedência Tasha 2020 → PHB 2024
        run: node tests/auditar-precedencia-subclasses-tasha-2020.mjs
      - name: 11C · Validar precedência Xanathar 2017 → PHB 2024
        run: node tests/auditar-precedencia-subclasses-xanathar-2017.mjs
      - name: 11E · Impedir múltiplas revisões do motor de regras
        run: node tests/auditar-revisao-unica-rules.mjs
