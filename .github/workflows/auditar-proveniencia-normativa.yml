name: Auditar proveniência normativa da criação

on:
  pull_request:
    paths:
      - 'dados/auditoria-criacao-escopo.json'
      - 'dados/auditoria-normativa-*.json'
      - 'dados/fontes-normativas-criacao.json'
      - 'dados/politica-compatibilidade-5e-5.5e.json'
      - 'dados/classes-base-2024.json'
      - 'dados/classes-ptbr/**'
      - 'dados/artificer-2025.json'
      - 'dados/subclasses-*.json'
      - 'dados/especies-*.json'
      - 'dados/tiefling-variantes.json'
      - 'dados/antecedentes-*.json'
      - 'dados/talentos-*.json'
      - 'dados/idiomas-*.json'
      - 'dados/armas-*.json'
      - 'dados/armaduras-*.json'
      - 'dados/equipamentos-*.json'
      - 'dados/ferramentas-*.json'
      - 'dados/maestrias-de-arma-pdfs.json'
      - 'dados/itens-magicos/**'
      - 'dados/magias-*.json'
      - 'dados/regras-*.json'
      - 'dados/localizacao-*.json'
      - 'tests/auditar-proveniencia-normativa.mjs'
      - 'tests/auditar-semantica-*.mjs'
      - '.github/workflows/auditar-proveniencia-normativa.yml'
  push:
    branches: [main]
    paths:
      - 'dados/**'
      - 'tests/auditar-proveniencia-normativa.mjs'
      - 'tests/auditar-semantica-*.mjs'
      - '.github/workflows/auditar-proveniencia-normativa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proveniencia-normativa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 11A · Validar proveniência normativa fail-closed
        run: node tests/auditar-proveniencia-normativa.mjs
      - name: 11B · Validar semântica das classes core 2024
        run: node tests/auditar-semantica-classes-core.mjs
