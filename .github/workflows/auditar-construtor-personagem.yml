name: Auditar construtor de personagem

on:
  pull_request:
    paths:
      - 'criacao-personagem.html'
      - 'lista-personagens.html'
      - 'personagens.html'
      - 'scripts/character-builder.js'
      - 'scripts/character-builder/**'
      - 'dados/magias-personagem-2024.json'
  push:
    branches: [main]
    paths:
      - 'criacao-personagem.html'
      - 'lista-personagens.html'
      - 'personagens.html'
      - 'scripts/character-builder.js'
      - 'scripts/character-builder/**'
      - 'dados/magias-personagem-2024.json'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check scripts/character-builder.js
          node --check scripts/character-builder/state.js
          node --check scripts/character-builder/catalogs.js
          node --check scripts/character-builder/rules.js
          node --check scripts/character-builder/spells.js
          node --check scripts/character-builder/ui.js
      - name: Auditar contrato da interface
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('criacao-personagem.html').read_text(encoding='utf-8')
          list_html=Path('lista-personagens.html').read_text(encoding='utf-8')
          js='\n'.join(Path(p).read_text(encoding='utf-8') for p in [
              'scripts/character-builder/state.js','scripts/character-builder/catalogs.js',
              'scripts/character-builder/rules.js','scripts/character-builder/spells.js','scripts/character-builder/ui.js'])
          ids=set(re.findall(r'id="([^"]+)"',html))
          required={'builder','classe','nivel','especie','antecedente','magias-escolhas','sheet-ac','sheet-hp','save-values','skill-values','combat','spellcasting','base-bonus-forca','base-bonus-destreza','base-bonus-constituicao','base-bonus-inteligencia','base-bonus-sabedoria','base-bonus-carisma'}
          missing=required-ids
          if missing: raise RuntimeError('IDs obrigatórios ausentes: '+', '.join(sorted(missing)))
          if 'ruleset' in ids: raise RuntimeError('Seletor de regras não pode existir na interface.')
          forbidden=['id="hp-mode"','hpMode','hpRolls','Valores antes dos bônus de origem','A armadura, o escudo e a arma selecionados','Alterações ficam locais até salvar','Escolhas permitidas para','Regras 2024','Proveniência mecânica','bg-p111']
          for token in forbidden:
              if token in html or token in list_html or token in js: raise RuntimeError('Texto ou controle proibido na interface: '+token)
          required_tokens=["hub-rpg:characters:v4","subclassLevel","trainedArmor","spellProgress","spellOptions","loadSpells","magias-personagem-2024.json","k.hitDie+con","ch.plusOnes=bg.abilities.slice(0,3)","for(const a of bg.abilities.slice(0,3))"]
          for token in required_tokens:
              if token not in js: raise RuntimeError('Contrato mecânico ausente: '+token)
          if 'type="module"' not in html: raise RuntimeError('Loader ES module ausente.')
          print('Construtor v4 validado: +1/+1/+1 definido pelo antecedente, exibido sem edição, indicadores de atributo e interface limpa presentes.')
          PY
