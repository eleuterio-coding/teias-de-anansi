name: Auditar construtor de personagem

on:
  pull_request:
    paths:
      - 'criacao-personagem.html'
      - 'ficha-personagem.html'
      - 'lista-personagens.html'
      - 'personagens.html'
      - 'scripts/character-sheet.js'
      - 'scripts/character-builder.js'
      - 'scripts/character-builder/**'
      - 'dados/magias-personagem-2024.json'
  push:
    branches: [main]
    paths:
      - 'criacao-personagem.html'
      - 'ficha-personagem.html'
      - 'lista-personagens.html'
      - 'personagens.html'
      - 'scripts/character-sheet.js'
      - 'scripts/character-builder.js'
      - 'scripts/character-builder/**'
      - 'dados/magias-personagem-2024.json'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          node --check scripts/character-sheet.js
          node --check scripts/character-builder.js
          node --check scripts/character-builder/state.js
          node --check scripts/character-builder/catalogs.js
          node --check scripts/character-builder/rules.js
          node --check scripts/character-builder/spells.js
          node --check scripts/character-builder/ui.js
          node --check scripts/character-builder/profile-ui.js
          node --check scripts/character-builder/species-trait-ui.js
          node --check scripts/character-builder/spell-selection-ui.js
          node --check scripts/character-builder/spell-quota-ui.js
      - name: Auditar contrato da interface
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('criacao-personagem.html').read_text(encoding='utf-8')
          sheet_html=Path('ficha-personagem.html').read_text(encoding='utf-8')
          list_html=Path('lista-personagens.html').read_text(encoding='utf-8')
          js='\n'.join(Path(p).read_text(encoding='utf-8') for p in [
              'scripts/character-builder/state.js','scripts/character-builder/catalogs.js',
              'scripts/character-builder/rules.js','scripts/character-builder/spells.js',
              'scripts/character-builder/ui.js','scripts/character-builder/profile-ui.js',
              'scripts/character-builder/species-trait-ui.js','scripts/character-builder/spell-selection-ui.js',
              'scripts/character-builder/spell-quota-ui.js'])
          loader=Path('scripts/character-builder.js').read_text(encoding='utf-8')
          sheet_js=Path('scripts/character-sheet.js').read_text(encoding='utf-8')
          spell_selection=Path('scripts/character-builder/spell-selection-ui.js').read_text(encoding='utf-8')
          spell_quota=Path('scripts/character-builder/spell-quota-ui.js').read_text(encoding='utf-8')
          ids=set(re.findall(r'id="([^"]+)"',html))
          required={'builder','classe','nivel','especie','antecedente','magias-escolhas','sheet-ac','sheet-hp','save-values','skill-values','combat','spellcasting','base-bonus-forca','base-bonus-destreza','base-bonus-constituicao','base-bonus-inteligencia','base-bonus-sabedoria','base-bonus-carisma'}
          creation_required={'profile-player','profile-experience','profile-age','profile-gender','profile-height','profile-weight','profile-hair','profile-eyes','profile-skin','profile-alignment','profile-faith','profile-languages','personality','ideal','bond','flaw','coin-cp','coin-sp','coin-ep','coin-gp','coin-pp','inventory-notes','magic-items','other-holdings','extra-spells','creation-profile','creation-roleplay','creation-proficiencies','creation-inventory'}
          missing=(required|creation_required)-ids
          if missing: raise RuntimeError('IDs obrigatórios ausentes: '+', '.join(sorted(missing)))
          if 'ruleset' in ids: raise RuntimeError('Seletor de regras não pode existir na interface.')
          forbidden=['id="hp-mode"','hpMode','hpRolls','Valores antes dos bônus de origem','A armadura, o escudo e a arma selecionados','Alterações ficam locais até salvar','Escolhas permitidas para','Regras 2024','Proveniência mecânica','bg-p111']
          for token in forbidden:
              if token in html or token in list_html or token in js: raise RuntimeError('Texto ou controle proibido na interface: '+token)
          required_tokens=["hub-rpg:characters:v4","subclassLevel","trainedArmor","spellProgress","spellOptions","loadSpells","magias-personagem-2024.json","k.hitDie+con","ch.plusOnes=bg.abilities.slice(0,3)","for(const a of bg.abilities.slice(0,3))","ensureSheetState","initCharacterProfileUi","speciesTraitChoiceDefs","sanitizeSpeciesTraitChoices","traitChoices","initSpeciesTraitUi","initSpellSelectionUi","hub:spell-selection-changed","renderSpellPreview","spellCreditState"]
          for token in required_tokens:
              if token not in js and token not in loader:
                  raise RuntimeError('Contrato mecânico ausente: '+token)
          if "dispatchEvent(new Event('input'))" in spell_selection:
              raise RuntimeError('Seleção de magia não pode disparar renderização global via campo de nome.')
          if 'spellOptions(' in spell_selection:
              raise RuntimeError('Seleção incremental não deve reconstruir opções completas de magia a cada clique.')
          if 'canSelectLeveledSpell' in spell_quota:
              raise RuntimeError('Contadores de magia não devem recalcular a elegibilidade individual de todo o catálogo.')
          if 'type="module"' not in html: raise RuntimeError('Loader ES module ausente.')

          sheet_ids=set(re.findall(r'id="([^"]+)"',sheet_html))
          sheet_required={'sheet','pc-name','core-metrics','abilities','saves','skills','combat-summary','current-hp','conditions','species-features','class-features','background-data','proficiencies','starting-equipment','spell-overview','spell-slots','cantrip-list','leveled-spells','save-sheet'}
          sheet_missing=sheet_required-sheet_ids
          if sheet_missing: raise RuntimeError('IDs obrigatórios da ficha ausentes: '+', '.join(sorted(sheet_missing)))
          if 'ficha-personagem.html' not in list_html: raise RuntimeError('Lista de personagens não oferece acesso à ficha digital.')
          for token in ['ensureSheetState','spellSlotsUsed','currentHp','conditions','renderFeatures','renderSpells','saveCharacter']:
              if token not in sheet_js: raise RuntimeError('Contrato da ficha digital ausente: '+token)
          print('Construtor e ficha digital validados: seleção de magias usa atualização localizada e cálculo único de cotas, sem renderização global por clique.')
          PY
