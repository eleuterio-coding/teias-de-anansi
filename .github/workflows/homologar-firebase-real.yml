name: Homologar colaboração Firebase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dados/firebase-config.json'
      - 'firebase/**'
      - 'scripts/collaboration-model.js'
      - 'scripts/collaboration-ui.js'
      - 'scripts/collaboration-sync.js'
      - 'scripts/firebase-collaboration-provider.js'
      - 'usuarios.html'
      - 'e2e/collaboration-real.spec.js'
      - '.github/workflows/homologar-firebase-real.yml'

permissions:
  contents: read

concurrency:
  group: homologar-colaboracao-firebase
  cancel-in-progress: true

env:
  E2E_FIREBASE_ADMIN_USERNAME: ${{ secrets.E2E_FIREBASE_ADMIN_USERNAME }}
  E2E_FIREBASE_ADMIN_PASSWORD: ${{ secrets.E2E_FIREBASE_ADMIN_PASSWORD }}

jobs:
  firebase-real:
    name: Firebase real · visibilidade Mestre x Jogador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exigir somente a conta principal E2E
        shell: bash
        run: |
          missing=0
          for name in E2E_FIREBASE_ADMIN_USERNAME E2E_FIREBASE_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name não está configurado nos GitHub Actions Secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditar contrato simples de colaboração
        run: |
          node tests/auditar-colaboracao-provisionamento.mjs
          node tests/auditar-colaboracao-sync.mjs
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Validar Firebase real com Mestre e Jogador efêmero
        run: npm run test:e2e:firebase
      - name: Guardar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-firebase-real-report
          path: playwright-report/
          retention-days: 7
