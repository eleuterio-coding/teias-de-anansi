name: Homologar Firebase real v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homologar-firebase-real-v1
  cancel-in-progress: false

env:
  E2E_FIREBASE_ADMIN_USERNAME: ${{ secrets.E2E_FIREBASE_ADMIN_USERNAME }}
  E2E_FIREBASE_ADMIN_PASSWORD: ${{ secrets.E2E_FIREBASE_ADMIN_PASSWORD }}

jobs:
  firebase-real:
    name: Firebase multiusuário real · Mestre x Jogador efêmero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exigir credenciais administrativas E2E reais
        shell: bash
        run: |
          missing=0
          for name in E2E_FIREBASE_ADMIN_USERNAME E2E_FIREBASE_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name não está configurado nos GitHub Actions Secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "O gate Firebase real exige somente a identidade administrativa já homologada. O Jogador E2E é criado e removido automaticamente pelo teste."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:firebase
      - name: Guardar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-firebase-real-report
          path: playwright-report/
          retention-days: 7
