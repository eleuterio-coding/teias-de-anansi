name: Auditar Estado das Categorias de Compras

on:
  pull_request:
    paths:
      - 'scripts/character-builder/package-b-purchase-ui.js'
      - '.github/workflows/auditar-estado-categorias-compras.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/character-builder/package-b-purchase-ui.js'
      - '.github/workflows/auditar-estado-categorias-compras.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: node --check scripts/character-builder/package-b-purchase-ui.js
      - name: Auditar preservação persistente do estado aberto e fechado
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('scripts/character-builder/package-b-purchase-ui.js').read_text(encoding='utf-8')
          required=[
              'bindPurchaseCollapseGuard',
              'rememberedOpenAreas',
              'MutationObserver',
              'purchaseListObserver.observe(box,{childList:true})',
              '#wealth-purchase-card .wealth-buy, #wealth-purchase-card .wealth-qty',
              '#wealth-shop-list details.wealth-area > summary',
              'rememberOpenAreas()',
              'restoreOpenAreas(box)',
              'details.open=rememberedOpenAreas.has(areaName(details))',
              'Promise.resolve(result).then(()=>bindPurchaseCollapseGuard())'
          ]
          missing=[token for token in required if token not in source]
          if missing:
              raise RuntimeError('Proteções persistentes ausentes: '+', '.join(missing))
          print('Toda reconstrução do catálogo reaplica o estado aberto/fechado escolhido pelo usuário.')
          PY
