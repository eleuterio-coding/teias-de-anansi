name: Normalizar revisão central rules para Invocações

on:
  push:
    branches: [audit/normativa-total-criacao]
    paths:
      - '.github/workflows/normalizar-revisao-rules-invocacoes.yml'

permissions:
  contents: write

jobs:
  normalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/normativa-total-criacao
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalizar somente o motor central
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          old='20260831-class-tools1'
          new='20260831-warlock-invocations2'
          central=re.compile(r'(?P<prefix>[\'"/])rules\.js\?v='+re.escape(old))
          files=list(Path('scripts/character-builder').rglob('*.js'))+list(Path('scripts').glob('character-sheet*.js'))+[Path('scripts/character-builder.js')]
          changed=[]
          for path in files:
              text=path.read_text(encoding='utf-8')
              updated=central.sub(lambda m:f"{m.group('prefix')}rules.js?v={new}",text)
              if updated!=text:
                  path.write_text(updated,encoding='utf-8')
                  changed.append(str(path))

          loader=Path('scripts/character-builder.js')
          text=loader.read_text(encoding='utf-8')
          text=text.replace(f"ui.js?v={old}",f"ui.js?v={new}").replace(f"class-skill-ui.js?v={old}",f"class-skill-ui.js?v={new}")
          loader.write_text(text,encoding='utf-8')

          html=Path('criacao-personagem.html')
          text=html.read_text(encoding='utf-8').replace(f"character-builder.js?v={old}",f"character-builder.js?v={new}")
          html.write_text(text,encoding='utf-8')

          test=Path('tests/auditar-revisao-unica-rules.mjs')
          text=test.read_text(encoding='utf-8').replace(f"REV='{old}'",f"REV='{new}'")
          test.write_text(text,encoding='utf-8')

          print('Importadores centrais atualizados:')
          for path in changed: print(' -',path)
          PY
          node tests/auditar-revisao-unica-rules.mjs
          node tests/auditar-invocacoes-bruxo-2024.mjs
          node --check scripts/character-builder.js
          find scripts/character-builder -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          git diff --check
      - name: Publicar e remover workflow temporário
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/normalizar-revisao-rules-invocacoes.yml
          git add scripts criacao-personagem.html tests/auditar-revisao-unica-rules.mjs
          git commit -m 'Normalizar revisão central do rules para Invocações'
          git push origin HEAD:audit/normativa-total-criacao
