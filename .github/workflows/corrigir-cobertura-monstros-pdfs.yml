name: Corrigir cobertura monstros PDFs
on:
  push:
    paths:
      - '.github/workflows/corrigir-cobertura-monstros-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir módulo Monstros
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('monstros.html')
          s=p.read_text()
          old="function complete5(m){return !!(m&&!m._copy&&m.name&&m.size&&m.type&&m.ac&&m.hp&&m.speed&&m.str!=null&&m.dex!=null&&m.con!=null&&m.int!=null&&m.wis!=null&&m.cha!=null&&m.cr!=null)}"
          new="function complete5(m){return !!(m&&m.name&&(m._copy||(m.size&&m.type&&m.ac&&m.hp&&m.speed&&m.str!=null&&m.dex!=null&&m.con!=null&&m.int!=null&&m.wis!=null&&m.cha!=null)))}"
          if old not in s:
              raise SystemExit('Filtro antigo não encontrado')
          s=s.replace(old,new)
          old2="function render5(row){const m=row.record;return `"
          new2="function render5(row){const m=row.record;if(m._copy){const b=m._copy||{};return `<h2>${esc(m.name)}</h2><div class=\"meta\"><span><b>Fonte:</b> ${esc(row.sourceTitle)}</span><span><b>Ano:</b> ${row.year}</span><span><b>PDF:</b> ${esc(row.pdf)}</span><span><b>Página:</b> ${esc(m.page??'—')}</span><span><b>Status:</b> publicado · bloco composto por referência</span></div><div class=\"stat\"><p><b>Base mecânica:</b> ${esc(b.name||'—')} (${esc(b.source||'—')}). Esta entrada é definida no próprio livro como as estatísticas da criatura-base com as alterações abaixo; por isso o HUB preserva a dependência em vez de descartar a criatura.</p>${m.size?`<p><b>Tamanho:</b> ${esc(txt(m.size))}</p>`:''}${m.type?`<p><b>Tipo:</b> ${esc(typeText(m))}</p>`:''}${m.hp?`<p><b>PV próprio:</b> ${esc(txt(m.hp))}</p>`:''}<h3>Alterações sobre a base</h3><pre class=\"pdftext\">${esc(JSON.stringify(b._templates||b._mod||b,null,2))}</pre><details class=\"raw\"><summary>Registro estruturado completo da referência</summary><pre>${esc(JSON.stringify(m,null,2))}</pre></details></div>`}return `"
          if old2 not in s:
              raise SystemExit('render5 não encontrado')
          s=s.replace(old2,new2)
          s=s.replace("<b>CR</b> ${esc(txt(m.cr))}","<b>CR</b> ${esc(m.cr==null?'Sem CR (estatística dinâmica/associada a característica)':txt(m.cr))}")
          s=s.replace('v=20260818-2028','v=20260819-1011')
          p.write_text(s)

          ap=Path('dados/auditoria-monstros-pdfs.json')
          a=json.loads(ap.read_text())
          missing=[x.get('nome') for x in a.get('faltantes_no_filtro_atual',[])]
          a['status_correcao']='corrigido_e_publicado'
          a['corrigido_em']='2026-08-19T10:11:00-03:00'
          a['registros_estruturados_agora_carregados']=395
          a['extras_pdf_carregados']=92
          a['registros_pdf_publicados']=487
          a['faltantes_corrigidos']=missing
          ap.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n')

          mp=Path('dados/importacao-pdfs-manifest.json')
          m=json.loads(mp.read_text())
          m['revisado_em']='2026-08-19T10:11:00-03:00'
          m['registros_estruturados_carregados']=395
          m['monstros_extras_carregados']=92
          m['registros_pdf_publicados']=487
          m['falha_corrigida']='filtro antigo rejeitava criaturas sem CR e entradas definidas por _copy/referência'
          m['faltantes_corrigidos']=missing
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')

          bp=Path('bibliotecas.html')
          b=bp.read_text().replace('monstros.html?v=20260819-1003','monstros.html?v=20260819-1011')
          bp.write_text(b)
          PY
      - name: Validar cobertura
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=['xge','xdmg','mpmm','erlw','tce','efa','fraif']
          total=sum(len(json.loads((Path('dados/monstros-fontes')/f'{x}.json').read_text()).get('monster',[])) for x in files)
          extras=len(json.loads(Path('dados/monstros-pdf-extras.json').read_text()).get('items',[]))
          html=Path('monstros.html').read_text()
          assert total==395, total
          assert extras==92, extras
          assert '!m._copy' not in html
          assert 'm.cr!=null' not in html
          assert 'bloco composto por referência' in html
          print({'estruturados':total,'extras':extras,'total_pdf':total+extras})
          PY
      - name: Limpar workflows temporários e publicar
        run: |
          rm -f .github/workflows/auditar-monstros-pdfs.yml
          rm -f .github/workflows/corrigir-cobertura-monstros-pdfs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Publica todos os monstros encontrados nos dois PDFs' || exit 0
          git push
