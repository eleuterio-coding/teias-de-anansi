name: Gerar catálogo consolidado de magias

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/gerar_magias_catalogo.py'
      - 'scripts/unificar_consumidores_magias.py'
      - 'dados/magias-suplementos-locais.json'
      - '.github/workflows/gerar-magias-catalogo.yml'

permissions:
  contents: write

concurrency:
  group: gerar-magias-catalogo
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar catálogo consolidado único
        run: python scripts/gerar_magias_catalogo.py

      - name: Unificar Biblioteca e Criação de Personagem
        run: python scripts/unificar_consumidores_magias.py

      - name: Validar catálogo compartilhado
        run: |
          python -m json.tool dados/magias-catalogo.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('dados/magias-catalogo.json').read_text(encoding='utf-8'))
          items = data.get('itens', [])
          if len(items) <= 394:
              raise RuntimeError(f'Catálogo consolidado anormalmente reduzido: {len(items)} magias.')
          if int(data.get('controle', {}).get('quantidade', len(items))) != len(items):
              raise RuntimeError('Quantidade declarada do catálogo diverge da lista de itens.')
          required = {'phb-2024', 'xanathar-2017', 'tasha-2020', 'fr-heroes-2025', 'eberron-forge-2025'}
          available = set(data.get('fontes', {}))
          missing = sorted(required - available)
          if missing:
              raise RuntimeError('Fontes consolidadas ausentes: ' + ', '.join(missing))
          print(f'Catálogo compartilhado validado: {len(items)} magias.')
          PY

      - name: Remover catálogo reduzido legado
        run: rm -f dados/magias-personagem-2024.json

      - name: Publicar catálogo único e consumidor da Biblioteca
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dados/magias-catalogo.json magias.html
          git add -u -- dados/magias-personagem-2024.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Sem alterações no catálogo compartilhado.'
          else
            git commit -m 'Atualiza catálogo compartilhado de magias'
            git push
          fi
