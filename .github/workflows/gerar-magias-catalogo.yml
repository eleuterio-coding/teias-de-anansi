name: Gerar catálogo consolidado de magias

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/gerar_magias_catalogo.py'
      - 'dados/magias-suplementos-locais.json'
      - '.github/workflows/gerar-magias-catalogo.yml'
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: gerar-magias-catalogo
  cancel-in-progress: false

jobs:
  gerar:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[hub] gerar magias')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar catálogo
        run: python scripts/gerar_magias_catalogo.py

      - name: Validar JSON
        run: python -m json.tool dados/magias-catalogo.json > /dev/null

      - name: Publicar catálogo gerado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dados/magias-catalogo.json
          if git diff --cached --quiet; then
            echo 'Sem alterações no catálogo.'
          else
            git commit -m 'Atualiza catálogo consolidado de magias'
            git push
          fi
