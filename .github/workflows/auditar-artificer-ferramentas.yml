name: Auditar Ferramentas do Artífice

on:
  pull_request:
    paths:
      - 'scripts/character-builder/artificer-subclass-mechanics.js'
      - 'scripts/character-builder/artificer-subclass-ui.js'
      - 'dados/ferramentas-pdfs.json'
      - 'tests/auditar-artificer-ferramentas.mjs'
      - '.github/workflows/auditar-artificer-ferramentas.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/character-builder/artificer-subclass-mechanics.js'
      - 'scripts/character-builder/artificer-subclass-ui.js'
      - 'dados/ferramentas-pdfs.json'
      - 'tests/auditar-artificer-ferramentas.mjs'
      - '.github/workflows/auditar-artificer-ferramentas.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: |
          node --check scripts/character-builder/artificer-subclass-mechanics.js
          node --check scripts/character-builder/artificer-subclass-ui.js
          node --check tests/auditar-artificer-ferramentas.mjs
      - name: Auditar catálogo e duplicidades
        run: node tests/auditar-artificer-ferramentas.mjs
