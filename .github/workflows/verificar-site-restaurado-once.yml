name: Etapa 3.09 - confirmar recuperacao de URL e JS no Pages
on:
  push:
    branches:
      - feature/etapa-3-usuarios-acesso-20261120
    paths:
      - .github/workflows/verificar-site-restaurado-once.yml
permissions:
  contents: read
  pages: read
jobs:
  smoke:
    name: Conferir site real sem acessar Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/etapa-3-usuarios-acesso-20261120
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Recriar artefato Vite para comparar HTML/JS publicos
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Verificar publicacao real do mesmo Hub por HTTP
        run: node scripts/verify-live-hub-pages.mjs
      - name: Confirmar build e source legacy em GET do GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const h={authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json'};
          const base='https://api.github.com/repos/eleuterio-coding/teias-de-anansi';
          const r=await fetch(base+'/pages',{headers:h,signal:AbortSignal.timeout(15000)});
          assert.ok(r.ok,'Pages GET '+r.status);
          const p=await r.json();
          assert.equal(p.html_url,'https://eleuterio-coding.github.io/teias-de-anansi/');
          assert.equal(p.build_type,'legacy');
          assert.equal(p.status,'built');
          console.log('SITE_RESTAURADO_PAGE_SOURCE_OK: legacy com URL preservada');
          const b=await fetch(base+'/pages/builds/latest',{headers:h,signal:AbortSignal.timeout(15000)});
          if(b.ok){const v=await b.json();console.log('SITE_RESTAURADO_BUILD',JSON.stringify({status:v.status,error:v.error?.message??null}));}
          NODE
