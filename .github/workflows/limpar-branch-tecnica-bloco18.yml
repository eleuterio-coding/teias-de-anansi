name: Limpar branch técnica Bloco 18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/limpar-branch-tecnica-bloco18.yml'

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Excluir branch técnica já encerrada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init cleanup
          cd cleanup
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin refs/heads/codex/bloco-18-validar-gates >/dev/null 2>&1; then
            git push origin --delete codex/bloco-18-validar-gates
          else
            echo 'Branch técnica já ausente.'
          fi
