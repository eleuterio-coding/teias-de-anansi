name: Auditar Mago

on:
  pull_request:
    paths:
      - 'scripts/character-builder/wizard-subclass-mechanics.js'
      - 'scripts/character-builder/wizard-subclass-ui.js'
      - 'scripts/character-builder/class-skill-ui.js'
      - 'scripts/character-builder/rules.js'
      - 'tests/auditar-mago-subclasses.mjs'
      - '.github/workflows/auditar-mago.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/character-builder/wizard-subclass-mechanics.js'
      - 'scripts/character-builder/wizard-subclass-ui.js'
      - 'scripts/character-builder/class-skill-ui.js'
      - 'scripts/character-builder/rules.js'
      - 'tests/auditar-mago-subclasses.mjs'
      - '.github/workflows/auditar-mago.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Mago 8/8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar subclasses de Mago
        run: node tests/auditar-mago-subclasses.mjs
      - name: Validar sintaxe
        run: |
          node --check scripts/character-builder/wizard-subclass-mechanics.js
          node --check scripts/character-builder/wizard-subclass-ui.js
          node --check scripts/character-builder/rules.js
          node --check scripts/character-builder/class-skill-ui.js
