name: Auditar 95 magias de Xanathar
on:
  push:
    paths:
      - 'dados/magias-xanathar-usuario.json'
      - 'magias.html'
      - 'scripts/character-sheet-unified-spells.js'
      - 'scripts/character-builder/spells.js'
      - 'scripts/catalog-registry.js'
      - 'tests/auditar-xanathar-95-magias.mjs'
      - '.github/workflows/auditar-xanathar-95-magias.yml'
  pull_request:
    paths:
      - 'dados/magias-xanathar-usuario.json'
      - 'magias.html'
      - 'scripts/character-sheet-unified-spells.js'
      - 'scripts/character-builder/spells.js'
      - 'scripts/catalog-registry.js'
      - 'tests/auditar-xanathar-95-magias.mjs'
      - '.github/workflows/auditar-xanathar-95-magias.yml'
jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe dos módulos JavaScript
        run: |
          node --check scripts/character-builder/spells.js
          node --check scripts/character-sheet-unified-spells.js
          node --check scripts/catalog-registry.js
      - name: Conferir integridade, proveniência e vínculos dos textos
        run: node tests/auditar-xanathar-95-magias.mjs
