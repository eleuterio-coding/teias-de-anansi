name: Preflight manual Pages Etapa 3 — SEM deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preflight-pages-etapa-3
  cancel-in-progress: false

jobs:
  somente-verificar:
    name: Conferir identidade do runner e Pages sem publicar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
    steps:
      - name: Exigir disparo na branch principal
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "eleuterio-coding/teias-de-anansi"
          test "$GITHUB_REF" = "refs/heads/main"
      - name: Comprovar emissao de OIDC no ambiente autorizado, sem imprimir token
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { Buffer } from 'node:buffer';

          const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const runtimeToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          assert.ok(url && runtimeToken, 'id-token:write nao foi disponibilizado pelo runner');
          const audience = 'https://github.com/eleuterio-coding';
          const endpoint = new URL(url);
          endpoint.searchParams.set('audience', audience);
          const response = await fetch(endpoint, {
            headers: { authorization: 'Bearer ' + runtimeToken, accept: 'application/json' },
            signal: AbortSignal.timeout(15000),
          });
          assert.ok(response.ok, 'OIDC HTTP ' + response.status);
          const jwt = (await response.json()).value;
          assert.ok(typeof jwt === 'string' && jwt.split('.').length === 3, 'Resposta OIDC incompleta');
          const claims = JSON.parse(Buffer.from(jwt.split('.')[1], 'base64url').toString('utf8'));
          assert.equal(claims.repository, 'eleuterio-coding/teias-de-anansi');
          assert.equal(claims.ref, 'refs/heads/main');
          assert.equal(claims.aud, audience);
          assert.ok(claims.sub?.includes('environment:github-pages'), 'OIDC nao reconhece environment');
          console.log('PREFLIGHT_OIDC_OK: identidade main/github-pages comprovada; token nao exibido');
          NODE
      - name: Ler apenas estado do mesmo site Pages, sem criar deployments
        env:
          GITHUB_TOKEN_READONLY: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const response = await fetch('https://api.github.com/repos/eleuterio-coding/teias-de-anansi/pages', {
            headers: {
              authorization: 'Bearer ' + process.env.GITHUB_TOKEN_READONLY,
              accept: 'application/vnd.github+json',
              'x-github-api-version': '2022-11-28',
            },
            signal: AbortSignal.timeout(15000),
          });
          assert.ok(response.ok, 'Pages GET HTTP ' + response.status);
          const page = await response.json();
          assert.equal(page.html_url, 'https://eleuterio-coding.github.io/teias-de-anansi/');
          assert.ok(['legacy', 'workflow'].includes(page.build_type), 'Modo Pages desconhecido');
          console.log('PREFLIGHT_PAGES_GET_OK: source=' + page.build_type + '; URL original preservada');
          console.log(page.build_type === 'workflow'
            ? 'PREFLIGHT_SOURCE_READY: o modo Actions esta configurado; nenhuma publicacao foi feita'
            : 'PREFLIGHT_SOURCE_PENDING: Pages ainda legacy; nao executar A+B');
          console.log('PREFLIGHT_LIMITATION: pages:write declarado, mas nao testado para escrita (nenhum deploy ocorreu)');
          NODE

# Este workflow nao faz checkout, nao usa service account Firebase, nao faz upload ou deploy.
# Uma execucao bem-sucedida confirma OIDC/branch/Pages GET, NAO a permissao de deploy Pages.
