name: Validar cards e exploração de Aventuras
on:
  push:
    branches: [main]
    paths:
      - 'scripts/adventure-ui.js'
      - 'scripts/adventure-exploration-ui.js'
      - 'scripts/adventure-router.js'
      - 'adventure-exploration.css'
      - 'timeline-flowchart.css'
      - 'scripts/timeline-flowchart.js'
      - 'tests/auditar-aventuras.mjs'
      - 'aventuras.html'
      - 'e2e/adventure-exploration.spec.js'
      - 'e2e/adventure-six-panels-actions.spec.js'
      - '.github/workflows/validar-cards-aventura.yml'
  pull_request:
    paths:
      - 'scripts/adventure-ui.js'
      - 'scripts/adventure-exploration-ui.js'
      - 'scripts/adventure-router.js'
      - 'scripts/collaboration-model.js'
      - 'adventure-exploration.css'
      - 'timeline-flowchart.css'
      - 'scripts/timeline-flowchart.js'
      - 'tests/auditar-aventuras.mjs'
      - 'hub-detail-layout.css'
      - 'aventuras.html'
      - 'e2e/adventure-exploration.spec.js'
      - 'e2e/adventure-six-panels-actions.spec.js'
      - '.github/workflows/validar-cards-aventura.yml'
  workflow_dispatch:
jobs:
  explore-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Auditoria de Cenas e Linha do Tempo
        run: node tests/auditar-aventuras.mjs
      - run: npx playwright install --with-deps chromium
      - name: Validar cards independentes e persistência em desktop e celular
        run: npx playwright test e2e/adventure-exploration.spec.js e2e/adventure-six-panels-actions.spec.js --project=desktop-chromium --project=mobile-chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aventura-exploracao-playwright
          path: |
            test-results/
            playwright-report/
          retention-days: 7
