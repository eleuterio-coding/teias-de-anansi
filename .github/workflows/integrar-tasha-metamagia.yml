name: Integrar Tasha e Metamagia

on:
  push:
    branches:
      - audit/normativa-total-criacao
    paths:
      - '.github/tasha-metamagia-trigger'

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/normativa-total-criacao
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar integração
        run: python3 scripts/integrar_tasha_metamagia.py
      - name: Validar sintaxe e gates críticos
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/character-builder/feat-mechanics.js
          node --check scripts/character-builder/class-skill-ui.js
          node --check scripts/character-builder/rules.js
          node --check scripts/character-builder/tasha-feat-mechanics.js
          node --check scripts/character-builder/tasha-feat-ui.js
          node --check scripts/character-builder/metamagic-mechanics.js
          node --check scripts/character-builder/metamagic-ui.js
          node tests/auditar-proveniencia-normativa.mjs
          node tests/auditar-escopo-criacao.mjs
          node tests/auditar-cobertura-total-criacao.mjs
          node tests/auditar-invocacoes-bruxo-2024.mjs
          node tests/auditar-metamagias-feiticeiro-2024.mjs
          node tests/auditar-talentos-tasha-2020.mjs
          node tests/auditar-revisao-unica-rules.mjs
          node tests/auditar-criacao-sem-travamento.mjs
          for test in tests/auditar-*.mjs; do
            case "$test" in
              tests/auditar-proveniencia-normativa.mjs|tests/auditar-escopo-criacao.mjs|tests/auditar-cobertura-total-criacao.mjs|tests/auditar-invocacoes-bruxo-2024.mjs|tests/auditar-metamagias-feiticeiro-2024.mjs|tests/auditar-talentos-tasha-2020.mjs|tests/auditar-revisao-unica-rules.mjs|tests/auditar-criacao-sem-travamento.mjs) continue ;;
            esac
            node "$test"
          done
          git diff --check
      - name: Publicar integração validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrar-tasha-metamagia.yml .github/tasha-metamagia-trigger scripts/integrar_tasha_metamagia.py
          git add .
          git commit -m 'Integrar Metamagia 2024 e talentos Tasha com gates fail-closed'
          git push origin HEAD:audit/normativa-total-criacao
