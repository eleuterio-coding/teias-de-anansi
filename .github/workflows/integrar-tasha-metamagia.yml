name: Integrar Tasha e Metamagia

on:
  push:
    branches:
      - audit/normativa-total-criacao
    paths:
      - '.github/tasha-metamagia-trigger'

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/normativa-total-criacao
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar integração
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/integrar_tasha_metamagia.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/auditar-invocacoes-bruxo-2024.mjs')
          s=p.read_text(encoding='utf-8')
          old="state.c.choices.class.level=1;let eligible=invocationEligibleOptions();assert.ok(eligible.some(x=>x.id==='pact-of-the-blade'));assert.ok(!eligible.some(x=>x.id==='devouring-blade'));\nlet check=invocationPrerequisiteResult(byId('agonizing-blast'),{consumer:'class',selectedIds:[]});assert.equal(check.ok,true);"
          new="state.c.choices.class.level=1;let eligible=invocationEligibleOptions();assert.ok(eligible.some(x=>x.id==='pact-of-the-blade'));assert.ok(!eligible.some(x=>x.id==='devouring-blade'));\nstate.c.choices.class.level=2;let check=invocationPrerequisiteResult(byId('agonizing-blast'),{consumer:'class',selectedIds:[]});assert.equal(check.ok,true,'Agonizing Blast deve ser elegível no nível 2 quando há truque de dano de Bruxo compatível.');"
          if old in s: s=s.replace(old,new,1)
          old2="state.c.refs.class='wizard';check=invocationPrerequisiteResult(byId('pact-of-the-blade'),{consumer:'feat',selectedIds:[]});assert.equal(check.ok,false,'Pactos atuais exigem níveis de Bruxo mesmo quando consultados por talento.');\nstate.c.refs.class='warlock';"
          new2="state.c.refs.class='wizard';check=invocationPrerequisiteResult(byId('pact-of-the-blade'),{consumer:'feat',selectedIds:[]});assert.equal(check.ok,true,'Pact of the Blade 2024 não possui pré-requisito e pode ser escolhido por Eldritch Adept sob a precedência atual.');check=invocationPrerequisiteResult(byId('agonizing-blast'),{consumer:'feat',selectedIds:[]});assert.equal(check.ok,false,'Invocação que exige níveis de Bruxo deve permanecer bloqueada para não-Bruxos.');\nstate.c.refs.class='warlock';"
          if old2 in s: s=s.replace(old2,new2,1)
          old3="clean=sanitizeInvocationSlots([{id:'thirsting-blade',choice:null},{id:'devouring-blade',choice:null}],{consumer:'class',limit:2});assert.equal(clean.slots[1].id,'devouring-blade');"
          new3="clean=sanitizeInvocationSlots([{id:'pact-of-the-blade',choice:{weaponId:'longsword'}},{id:'thirsting-blade',choice:null},{id:'devouring-blade',choice:null}],{consumer:'class',limit:3});assert.equal(clean.slots[2].id,'devouring-blade','A cadeia Pact of the Blade → Thirsting Blade → Devouring Blade deve permanecer válida no nível 12.');"
          if old3 in s: s=s.replace(old3,new3,1)
          if new not in s or new2 not in s or new3 not in s: raise SystemExit('cenários atualizados de Invocações não encontrados')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/auditar-talentos-tasha-2020.mjs')
          s=p.read_text(encoding='utf-8')
          old="assert.ok(d.legacyInvocationEffects.some(x=>x.source==='Eldritch Adept'&&x.flags.includes('armorOfShadows')));"
          new="assert.ok(d.legacyInvocationEffects.some(x=>x.source==='Eldritch Adept'&&x.spellGrants.some(g=>g.spell?.id==='mage-armor'&&g.noSlot&&g.usage==='à vontade')),'Armor of Shadows via Eldritch Adept deve conceder Mage Armor à vontade e sem espaço.');"
          if old in s: s=s.replace(old,new,1)
          if new not in s: raise SystemExit('cenário de Armor of Shadows atualizado não encontrado')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar sintaxe e gates críticos
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/character-builder/feat-mechanics.js
          node --check scripts/character-builder/class-skill-ui.js
          node --check scripts/character-builder/rules.js
          node --check scripts/character-builder/tasha-feat-mechanics.js
          node --check scripts/character-builder/tasha-feat-ui.js
          node --check scripts/character-builder/metamagic-mechanics.js
          node --check scripts/character-builder/metamagic-ui.js
          node tests/auditar-proveniencia-normativa.mjs
          node tests/auditar-escopo-criacao.mjs
          node tests/auditar-cobertura-total-criacao.mjs
          node tests/auditar-invocacoes-bruxo-2024.mjs
          node tests/auditar-metamagias-feiticeiro-2024.mjs
          node tests/auditar-talentos-tasha-2020.mjs
          node tests/auditar-revisao-unica-rules.mjs
          node tests/auditar-criacao-sem-travamento.mjs
          for test in tests/auditar-*.mjs; do
            case "$test" in
              tests/auditar-proveniencia-normativa.mjs|tests/auditar-escopo-criacao.mjs|tests/auditar-cobertura-total-criacao.mjs|tests/auditar-invocacoes-bruxo-2024.mjs|tests/auditar-metamagias-feiticeiro-2024.mjs|tests/auditar-talentos-tasha-2020.mjs|tests/auditar-revisao-unica-rules.mjs|tests/auditar-criacao-sem-travamento.mjs) continue ;;
            esac
            node "$test"
          done
          git diff --check
      - name: Publicar código validado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # GitHub Apps sem permissão workflows não podem publicar mudanças em .github/workflows.
          # Esses arquivos serão atualizados pelo conector após este commit de código/dados/testes.
          git checkout HEAD -- .github/workflows/auditar-proveniencia-normativa.yml .github/workflows/auditar-skilled.yml .github/workflows/auditar-escolhas-raca-pacote-b.yml .github/workflows/integrar-tasha-metamagia.yml
          git rm .github/tasha-metamagia-trigger scripts/integrar_tasha_metamagia.py
          git add .
          git commit -m 'Integrar Metamagia 2024 e talentos Tasha com gates fail-closed'
          git push origin HEAD:audit/normativa-total-criacao
