<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classes - Biblioteca - Teias de Anansi</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--b:#8885;--soft:#f5f5f5}
*{box-sizing:border-box}html,body{background:#fff;color:#000}body{max-width:1120px;margin:auto;padding:24px;line-height:1.55}a{color:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:18px 0}
.card{border:1px solid var(--b);border-radius:10px;padding:13px;text-decoration:none;display:block}
.card:hover,.card:focus-visible{background:var(--soft)}.card strong{display:block}.card small{opacity:.7}
@media(max-width:650px){body{padding:16px}}
</style>
</head>
<body>
<p><a href="bibliotecas.html">← Bibliotecas</a></p>
<header><h1>Classes</h1></header>
<main class="grid" id="grid" aria-label="Classes disponíveis"></main>
<script>
const CLASSES=[
 ['Artífice','artificer'],['Bárbaro','barbarian'],['Bardo','bard'],
 ['Bruxo','warlock'],['Clérigo','cleric'],['Druida','druid'],
 ['Feiticeiro','sorcerer'],['Guerreiro','fighter'],['Ladino','rogue'],
 ['Mago','wizard'],['Monge','monk'],['Paladino','paladin'],
 ['Patrulheiro','ranger']
];
const V='20261031-class-cards1';
document.getElementById('grid').innerHTML=CLASSES.sort((a,b)=>a[0].localeCompare(b[0],'pt-BR',{sensitivity:'base'}))
 .map(([nome,slug])=>{
  const ref=slug==='artificer'?'classes:pdf24merged1:artificer:2025':'classes:srd521:'+slug;
  const subtitle=slug==='artificer'?'Eberron: Forge of the Artificer · 2025':'Livro do Jogador · 2024';
  return `<a class="card" href="classes-v3.html?v=${V}&ref=${encodeURIComponent(ref)}"><strong>${nome}</strong><small>${subtitle}</small></a>`;
 }).join('');
</script>
</body>
</html>
