async function getJSON(url){const r=await fetch(url,{cache:'default'});if(!r.ok)throw new Error(`${url}: HTTP ${r.status}`);return r.json()}

 while(prev!==s){prev=s;s=s.replace(/\{@[^{}]+\}/g,m=>{const body=m.slice(2,-1);const bits=body.split('|');let first=bits[0].replace(/^\w+\s+/,'');let shown=(bits.length>2&&bits[2])?bits[2]:first;return shown.replace(/\s*\[[^\]]+\]/g,'')})}
