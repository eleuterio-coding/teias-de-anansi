<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magias - Biblioteca - Teias de Anansi</title>
<link rel="stylesheet" href="biblioteca-light.css?v=20261104-catalogo">
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--line:#d9dfe5}
*{box-sizing:border-box}body{max-width:1320px;margin:auto;padding:24px;color:#15191e;background:#fff}
a{color:inherit}.layout{display:grid;grid-template-columns:minmax(270px,355px) minmax(0,1fr);gap:16px;align-items:start}
.painel,.box,.stat{border:1px solid var(--line);border-radius:11px}.painel{overflow:hidden}
.tools{display:grid;gap:9px;padding:13px;background:#fff;border-bottom:1px solid var(--line)}
.tools input,.tools select{font:inherit;padding:10px;width:100%;border:1px solid var(--line);border-radius:7px;background:#fff}
.lista{max-height:72vh;overflow:auto}.item{display:block;width:100%;background:#fff;text-align:left;border:0;border-bottom:1px solid var(--line);padding:10px 13px;cursor:pointer;font:inherit}
.item:hover,.item.on{background:#f3f6f9}.item strong,.item small{display:block}.item small,.muted{color:#667180}
.detalhe{padding:18px;min-height:340px}.detalhe h2{margin:0 0 8px}
.badge{display:inline-block;border:1px solid #cbd5df;border-radius:40px;padding:3px 9px;font-size:.8rem;margin:3px 4px 3px 0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:16px 0}
.stat{padding:10px 12px;overflow-wrap:anywhere}.stat strong,.stat span{display:block}.stat strong{font-size:.78rem;color:#5d6875;text-transform:uppercase}
.box{padding:14px 16px;margin-top:12px}.box h3{margin:0 0 8px}.box p{margin:8px 0;white-space:pre-line}
.livro{border-top:1px solid var(--line);margin-top:18px;padding-top:13px;font-size:.9rem}
.resultado{padding:0 13px;font-size:.82rem;color:#667180}
@media(max-width:800px){body{padding:13px}.layout{grid-template-columns:1fr}.lista{max-height:320px}.detalhe{padding:14px}}
</style>
<script src="scripts/biblioteca-padroes.js?v=20261104"></script>
</head>
<body>
<p><a href="bibliotecas.html">← Bibliotecas</a></p>
<header><h1>Magias</h1></header>
<main class="layout">
<section class="painel" aria-label="Lista de magias">
<div class="tools"><input id="q" type="search" placeholder="Buscar magia..." aria-label="Buscar magia"><select id="circulo" aria-label="Filtrar por círculo"><option value="">Todos os círculos</option></select><select id="classe" aria-label="Filtrar por classe"><option value="">Todas as classes</option></select></div>
<p class="resultado" id="resultado">Carregando catálogo...</p><div class="lista" id="lista"></div>
</section>
<section class="painel detalhe" id="detalhe" aria-live="polite"><p class="muted">Selecione uma magia.</p></section>
</main>
<script>
'use strict';
const esc=HubBiblioteca.esc;
const norm=s=>HubBiblioteca.normalize(s);
const campos=[['tempo_conjuracao','Tempo de Conjuração'],['alcance','Alcance'],['componentes','Componentes'],['duracao','Duração'],['concentracao','Concentração'],['ritual','Ritual'],['ataque_salvaguarda','Ataque/Salvaguarda'],['dano','Dano']];
let magias=[],selecionada='';
const q=document.getElementById('q'),circulo=document.getElementById('circulo'),classe=document.getElementById('classe'),lista=document.getElementById('lista'),resultado=document.getElementById('resultado'),detalhe=document.getElementById('detalhe');
function fragmento(s){return esc(s||'—').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').split(/\n\s*\n/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')}
function renderDetalhe(m){
 selecionada=m.id;
 const params=new URL(location.href);params.searchParams.set('magia',m.id);params.searchParams.delete('ref');history.replaceState(null,'',params);
 detalhe.innerHTML='<h2>'+esc(m.nome)+'</h2><div><span class="badge">'+esc(m.circulo)+'</span><span class="badge">'+esc(m.escola)+'</span><span class="badge">CE · '+esc(m.concentracao_expandida)+'</span></div>'+
 '<div class="stats">'+campos.map(([key,label])=>'<div class="stat"><strong>'+label+'</strong><span>'+esc(m[key]||'—')+'</span></div>').join('')+'</div>'+
 '<section class="box"><h3>Concentração Expandida</h3>'+fragmento(m.concentracao_expandida)+'</section>'+
 '<section class="box"><h3>Efeito e Descrição</h3>'+fragmento(m.descricao)+'</section>'+
 '<section class="box"><h3>Classes</h3>'+fragmento(m.classes)+'</section>'+
 '<footer class="livro"><strong>Livro:</strong> '+esc(HubBiblioteca.livro(m.livro))+'</footer>';
 lista.querySelectorAll('.item').forEach(el=>el.classList.toggle('on',el.dataset.id===m.id));
}
function renderLista(){
 const termo=norm(q.value.trim()),n=circulo.value,c=norm(classe.value);
 const items=magias.filter(m=>(!n||String(m.nivel)===n)&&(!c||norm(m.classes).includes(c))&&(!termo||norm([m.nome,m.escola,m.descricao,m.livro,m.classes].join(' ')).includes(termo)));
 resultado.textContent=items.length+' de '+magias.length+' magias';
 lista.innerHTML=items.map(m=>'<button type="button" class="item '+(m.id===selecionada?'on':'')+'" data-id="'+esc(m.id)+'"><strong>'+esc(m.nome)+'</strong><small>'+esc(m.circulo)+' · '+esc(m.escola)+'</small></button>').join('')||'<p class="resultado">Nenhuma magia encontrada.</p>';
}
lista.addEventListener('click',event=>{const b=event.target.closest('button.item');if(b){const m=magias.find(x=>x.id===b.dataset.id);if(m)renderDetalhe(m)}});
q.addEventListener('input',renderLista);circulo.addEventListener('change',renderLista);classe.addEventListener('change',renderLista);
fetch('dados/catalogo-magias-20261104.json?v=20261104',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{
 if(data.itens?.length!==581)throw Error('O catálogo não contém 581 magias.');
 magias=data.itens;
 circulo.innerHTML='<option value="">Todos os círculos</option>'+Array.from({length:10},(_,n)=>'<option value="'+n+'">'+(n?n+'º círculo':'Truques')+'</option>').join('');
 const classes=[...new Set(magias.flatMap(m=>(m.classes||'').split(',').map(x=>x.trim().replace(/\s*\(.*$/,'')).filter(x=>/^(Artífice|Bardo|Bruxo|Clérigo|Druida|Feiticeiro|Mago|Paladino|Patrulheiro)$/.test(x))))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
 classe.innerHTML='<option value="">Todas as classes</option>'+classes.map(x=>'<option>'+esc(x)+'</option>').join('');
 renderLista();
 const args=new URLSearchParams(location.search),ref=args.get('magia')||args.get('ref')||'';
 const m=magias.find(x=>x.id===ref)||magias.find(x=>norm(x.nome)===norm(ref))||magias[0];
 if(m)renderDetalhe(m);
}).catch(e=>{resultado.textContent='Não foi possível carregar as magias.';detalhe.textContent=e.message});
</script>
<script type="module" src="scripts/hub-ux.js?v=20261028-library-hub-layout1"></script>
</body></html>
