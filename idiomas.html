<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Idiomas - Biblioteca - Teias de Anansi</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { max-width: 1050px; margin: 0 auto; padding: 24px; line-height: 1.55; }
    a { color: inherit; }
    .resumo, .meta { opacity: .78; }
    .controles { display: grid; grid-template-columns: minmax(220px,1fr) minmax(220px,320px); gap: 10px; margin: 18px 0 10px; }
    input, select { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border: 1px solid #8887; border-radius: 8px; background: transparent; color: inherit; }
    .resultado { margin: 8px 0 16px; opacity: .75; }
    .idioma { margin: 10px 0; border: 1px solid #8885; border-radius: 10px; overflow: hidden; }
    .idioma summary { cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
    .idioma summary:hover { background: #8881; }
    .categoria { font-size: .86rem; opacity: .68; white-space: nowrap; }
    .corpo { padding: 0 16px 16px; }
    .meta { border-top: 1px solid #8883; margin-top: 12px; padding-top: 10px; font-size: .9rem; display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .nota { padding: 12px 14px; border: 1px dashed #8888; border-radius: 10px; margin: 14px 0; }
    .erro { padding: 14px; border: 1px solid #b44; border-radius: 10px; }
    @media (max-width: 750px) {
      body { padding: 16px; }
      .controles { grid-template-columns: 1fr; }
      .idioma summary { display: block; }
      .categoria { display: block; margin-top: 5px; }
    }
  </style>
</head>
<body>
  <p><a href="bibliotecas.html?v=20260819-1043">← Bibliotecas</a></p>
  <header>
    <h1>Idiomas</h1>
  </header>

  <div class="controles">
    <input id="busca" type="search" placeholder="Buscar idioma, fonte ou origem...">
    <select id="filtro">
      <option value="">Todas as categorias</option>
      <option value="Core — Standard">Core — Standard</option>
      <option value="Core — Rare">Core — Rare</option>
      <option value="Expanded — Forgotten Realms">Expanded — Forgotten Realms</option>
      <option value="Expanded — Eberron">Expanded — Eberron</option>
      <option value="Expanded — Ravnica">Expanded — Ravnica</option>
      <option value="Expanded — Theros">Expanded — Theros</option>
      <option value="Expanded — Wildemount">Expanded — Wildemount</option>
      <option value="Expanded — Planar">Expanded — Planar</option>
      <option value="Expanded — Spelljammer">Expanded — Spelljammer</option>
      <option value="Expanded — Dragonlance">Expanded — Dragonlance</option>
    </select>
  </div>
  <p class="resultado" id="resultado">Carregando idiomas...</p>
  <main id="lista"></main>

<script>
let IDIOMAS = [];
const busca = document.getElementById('busca');
const filtro = document.getElementById('filtro');
const lista = document.getElementById('lista');
const resultado = document.getElementById('resultado');

function esc(v='') { return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function texto(i) { return [i.nome,i.categoria,i.fonte,i.origem,i.descricao,i.status].join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function render() {
  const termo = busca.value.trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const itens = IDIOMAS.filter(i => (!termo || texto(i).includes(termo)) && (!filtro.value || i.categoria === filtro.value));
  resultado.textContent = `${itens.length} de ${IDIOMAS.length} idiomas`;
  lista.innerHTML = itens.map(i => `
    <details class="idioma">
      <summary><strong>${esc(i.nome)}</strong><span class="categoria">${esc(i.categoria)}</span></summary>
      <div class="corpo">
        <p>${esc(i.descricao)}</p>
        <div class="meta">
          <span><strong>Tipo:</strong> Idioma</span>
          <span><strong>Livro:</strong> ${esc(i.fonte)}</span>
          <span><strong>Origem:</strong> ${esc(i.origem)}</span>
          <span><strong>Status:</strong> ${esc(i.status)}</span>
        </div>
      </div>
    </details>`).join('');
}

async function iniciar() {
  try {
    const urls = [
      'dados/idiomas-core-standard.json?v=20260819-1043',
      'dados/idiomas-core-rare.json?v=20260819-1043',
      'dados/idiomas-forgotten-realms.json?v=20260819-1043',
      'dados/idiomas-eberron.json?v=20260819-1043',
      'dados/idiomas-outros.json?v=20260819-1043'
    ];
    const respostas = await Promise.all(urls.map(url => fetch(url, {cache:'no-store'})));
    const falha = respostas.find(r => !r.ok);
    if (falha) throw new Error(`HTTP ${falha.status}`);
    const grupos = await Promise.all(respostas.map(r => r.json()));
    IDIOMAS = grupos.flat().sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    render();
  } catch (erro) {
    resultado.textContent = 'Falha ao carregar o catálogo.';
    lista.innerHTML = `<p class="erro">Não foi possível carregar os idiomas. Atualize a página para tentar novamente.</p>`;
    console.error(erro);
  }
}

busca.addEventListener('input', render);
filtro.addEventListener('change', render);
iniciar();
</script>
</body>
</html>
