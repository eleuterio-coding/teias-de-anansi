<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Idiomas - Biblioteca - Teias de Anansi</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { max-width: 1050px; margin: 0 auto; padding: 24px; line-height: 1.55; }
    a { color: inherit; }
    .meta { opacity: .78; }
    .controles { display: grid; grid-template-columns: minmax(220px,1fr) minmax(220px,320px); gap: 10px; margin: 18px 0 10px; }
    input, select { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border: 1px solid #8887; border-radius: 8px; background: transparent; color: inherit; }
    .resultado { margin: 8px 0 16px; opacity: .75; }
    .idioma { margin: 10px 0; border: 1px solid #8885; border-radius: 10px; overflow: hidden; }
    .idioma summary { cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
    .idioma summary:hover { background: #8881; }
    .corpo { padding: 0 16px 16px; }
    .meta { border-top: 1px solid #8883; margin-top: 12px; padding-top: 10px; font-size: .9rem; display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .erro { padding: 14px; border: 1px solid #b44; border-radius: 10px; }
    @media (max-width: 750px) {
      body { padding: 16px; }
      .controles { grid-template-columns: 1fr; }
      .idioma summary { display: block; }
      .categoria { display: block; margin-top: 5px; }
    }
  </style>
  <link rel="stylesheet" href="biblioteca-light.css?v=20261028-hub-layout1">
</head>
<body>
  <p><a href="bibliotecas.html?v=20261028-library-hub-layout1">← Bibliotecas</a></p>
  <header>
    <h1>Idiomas</h1>
  </header>

  <div class="controles">
    <input id="busca" type="search" placeholder="Buscar idioma, categoria ou fonte...">
    <select id="filtro">
      <option value="">Todas as categorias</option>
    </select>
  </div>
  <p class="resultado" id="resultado">Carregando idiomas...</p>
  <main id="lista"></main>

<script>
let IDIOMAS = [];
// Apenas a apresentação pública é traduzida: os identificadores canônicos
// dos catálogos continuam intactos para as regras de personagem.
const TRADUCOES_IDIOMAS = [["Common Sign Language","Língua de Sinais Comum"],["Venomous Demesne","Domínio Peçonhento"],["Thieves’ Cant","Gíria dos Ladrões"],["Thieves' Cant","Gíria dos Ladrões"],["Deep Speech","Língua Profunda"],["Undercommon","Subcomum"],["Kenderspeak","Fala Kender"],["Serpentine","Serpentino"],["Stonegrind","Móipedra"],["dragonborn","draconato"],["Kharolian","Kharoliano"],["Vedalken","Vedalkiano"],["Expanded","Expandido"],["Standard","Padrão"],["Draconic","Dracônico"],["Dwarvish","Anão"],["Minotaur","Minotauro"],["Halfling","Pequenino"],["Gnomish","Gnômico"],["Druidic","Druídico"],["Loxodon","Loxodônico"],["Common","Comum"],["Elvish","Élfico"],["Leonin","Leonino"],["Sylvan","Silvestre"],["Tauric","Táurico"],["Terran","Terrano"],["Giant","Gigante"],["Harpy","Harpia"],["Aquan","Aquano"],["Auran","Aurano"],["Ignan","Ignano"],["Rare","Raro"],["Core","Base"],["Ogre","Ogro"]];
function localizarIdioma(valor) {
  return TRADUCOES_IDIOMAS.reduce(
    (texto, [original, traduzido]) => texto.split(original).join(traduzido),
    String(valor ?? '')
  );
}
// Curadoria da Biblioteca: preservar as fontes integrais para regras de personagem e demais módulos.
// Idiomas nativos associados às raças em scripts/species-language-rules.js.
const IDIOMAS_RACIAIS = ["Draconic","Dwarvish","Elvish","Giant","Gnomish","Goblin","Halfling","Orc","Aquan","Celestial","Infernal","Primordial","Sylvan","Gith","Gnoll","Harpy","Quori","Serpentine"];
// Idiomas adicionais associados a povos e espécies dos cenários.
const IDIOMAS_DE_POVOS = ["Daelkyr","Stonegrind","Tauric","Wuura'gaa","Kraul","Loxodon","Vedalken","Leonin","Hadozee","Thri-kreen","Kenderspeak","Ogre"];
// Seleção expressamente mantida na Biblioteca, além dos grupos anteriores.
const IDIOMAS_ADICIONAIS = ["Undercommon","Common","Thieves’ Cant","Common Sign Language","Abyssal","Deep Speech","Druidic","Auran","Ignan","Terran"];
const IDIOMAS_VISIVEIS = new Set([...IDIOMAS_RACIAIS, ...IDIOMAS_DE_POVOS, ...IDIOMAS_ADICIONAIS]);
const busca = document.getElementById('busca');
const filtro = document.getElementById('filtro');
const lista = document.getElementById('lista');
const resultado = document.getElementById('resultado');

function esc(v='') { return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function texto(i) { return [i.nome,i.categoria,i.fonte,i.descricao,i.status,localizarIdioma(i.nome),localizarIdioma(i.categoria),localizarIdioma(i.descricao)].join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
// O rodapé mostra somente títulos de livros; proveniência permanece nos dados internos.
function livrosDaFonte(i) {
  if (i.nome === 'Gith') return ['Mordenkainen’s Tome of Foes (2018)'];
  return String(i.fonte || '')
    .replace('Player’s Handbook · Basic Rules (2024)', 'Player’s Handbook (2024)')
    .split(' · ')
    .map(livro => livro.trim())
    .filter(livro => livro && !/^Regra da Casa\b/i.test(livro) && !/^legado de edições anteriores\b/i.test(livro));
}
function render() {
  const termo = busca.value.trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const itens = IDIOMAS.filter(i => (!termo || texto(i).includes(termo)) && (!filtro.value || i.categoria === filtro.value));
  resultado.textContent = `${itens.length} de ${IDIOMAS.length} idiomas`;
  lista.innerHTML = itens.map(i => `
    <details class="idioma">
      <summary><strong>${esc(localizarIdioma(i.nome))}</strong></summary>
      <div class="corpo">
        <p>${esc(localizarIdioma(i.descricao))}</p>
        <div class="meta">
          <span><strong>${livrosDaFonte(i).length === 1 ? "Livro" : "Livros"}:</strong> ${esc(livrosDaFonte(i).join(" · "))}</span>
        </div>
      </div>
    </details>`).join('');
}

async function iniciar() {
  try {
    const urls = [
      'dados/idiomas-core-standard.json?v=20261031-idiomas-40-ptbr1',
      'dados/idiomas-core-rare.json?v=20261031-idiomas-40-ptbr1',
      'dados/idiomas-eberron.json?v=20261031-idiomas-40-ptbr1',
      'dados/idiomas-outros.json?v=20261031-idiomas-40-ptbr1'
    ];
    const respostas = await Promise.all(urls.map(url => fetch(url, {cache:'default'})));
    const falha = respostas.find(r => !r.ok);
    if (falha) throw new Error(`HTTP ${falha.status}`);
    const grupos = await Promise.all(respostas.map(r => r.json()));
    IDIOMAS = grupos.flat().filter(i => IDIOMAS_VISIVEIS.has(i.nome)).sort((a,b) => localizarIdioma(a.nome).localeCompare(localizarIdioma(b.nome), 'pt-BR'));
    if (IDIOMAS.length !== 40 || new Set(IDIOMAS.map(i => i.nome)).size !== 40) throw new Error('Catálogo de idiomas: esperado exatamente 40 registros únicos.');
    const categorias = [...new Set(IDIOMAS.map(i => i.categoria))].sort((a,b) => a.localeCompare(b, 'pt-BR'));
    filtro.innerHTML = '<option value="">Todas as categorias</option>' +
      categorias.map(c => `<option value="${esc(c)}">${esc(localizarIdioma(c))}</option>`).join('');
    render();
  } catch (erro) {
    resultado.textContent = 'Falha ao carregar o catálogo.';
    lista.innerHTML = `<p class="erro">Não foi possível carregar os idiomas. Atualize a página para tentar novamente.</p>`;
    console.error(erro);
  }
}

busca.addEventListener('input', render);
filtro.addEventListener('change', render);
iniciar();
</script>
<script type="module" src="scripts/hub-ux.js?v=20261028-library-hub-layout1"></script>
</body>
</html>
