<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Usuários - Teias de Anansi</title>
<link rel="stylesheet" href="hub-ux.css?v=20261021-player-self1">
<link rel="stylesheet" href="campaigns.css?v=20261021-click-avatar1">
<link rel="stylesheet" href="user-directory.css?v=20261022-users-organization1">
</head>
<body>
<main id="main-content" class="hub-user-page hub-users-page">
<header class="top hub-users-main-header"><div><h1>Usuários</h1><p class="mini">Perfis, imagens e permissões de acesso do Hub.</p></div></header>
<section class="card hub-user-photo-card" id="own-profile-card">
<h2>Meu perfil</h2>
<p class="hub-user-own-name" id="own-display-name"></p><p class="hub-user-own-identity" id="own-username"></p>
<h3 class="hub-user-image-title">Minha Imagem</h3>
<div class="hub-user-avatar-preview" id="user-avatar-preview" role="button" tabindex="0" title="Selecionar imagem" aria-label="Selecionar minha imagem"><span aria-hidden="true">◇</span></div>
<div class="row-actions"><label class="btn" for="user-avatar-input">Selecionar imagem</label><input id="user-avatar-input" type="file" accept="image/png,image/jpeg,image/webp" hidden><button id="user-avatar-remove" type="button" class="secondary">Remover</button></div>
<p id="user-avatar-feedback" role="status" aria-live="polite"></p>
</section>
<section class="card hub-user-directory" hidden>
<div class="hub-users-heading"><div><h2>Usuários do Hub</h2><p class="mini hub-user-directory-subtitle">Selecione um usuário para consultar ou editar seu perfil.</p></div><div class="hub-user-directory-actions"><span id="hub-users-count" class="mini"></span><a class="btn secondary" id="hub-users-manage-access" href="usuarios.html" hidden>Gerenciar acessos</a></div></div>
<div id="hub-users-list" class="hub-users-list" aria-live="polite"></div>
<p id="hub-users-feedback" role="status" aria-live="polite"></p>
</section>
<section class="card hub-user-focus-card" id="hub-user-focused-profile" aria-labelledby="hub-focused-user-title" hidden>
 <div class="hub-user-focus-header"><h2 id="hub-focused-user-title">Perfil do jogador</h2><a class="btn secondary" href="mesa.html" id="hub-user-profile-back" hidden>Voltar</a></div>
 <div class="hub-user-focus-body"><div class="hub-user-focus-avatar" id="hub-focused-user-avatar" aria-label="Foto do jogador"><span aria-hidden="true">◇</span></div><div><strong id="hub-focused-user-name"></strong><p class="mini" id="hub-focused-user-login"></p><p class="mini" id="hub-focused-user-role"></p></div></div>
</section>
<section class="card hub-user-admin" id="user-admin-card" hidden>
<h2>Editar usuário</h2>
<form id="user-admin-form">
<div class="hub-user-admin-layout">
<div class="hub-user-admin-photo">
<button class="hub-user-admin-avatar" type="button" id="admin-avatar-preview" aria-label="Selecionar imagem deste usuário" title="Selecionar imagem"><span aria-hidden="true">◇</span></button>
<input type="file" id="admin-avatar-file" accept="image/png,image/jpeg,image/webp" hidden>
<div class="row-actions">
<label class="btn secondary" for="admin-avatar-file">Selecionar imagem</label>
<button class="secondary" id="admin-avatar-remove" type="button">Remover</button>
</div>
</div>
<div class="hub-user-admin-fields">
<label>Nome exibido<input id="admin-display-name" type="text" maxlength="80" autocomplete="off" required></label>
<p class="mini" id="admin-login-name"></p>
<div class="row-actions"><button type="submit" id="admin-save">Salvar alterações</button><button class="secondary" id="admin-cancel" type="button">Cancelar</button><a class="btn secondary" href="usuarios.html">Gerenciar acessos</a></div>
<p id="admin-feedback" role="status" aria-live="polite"></p>
</div>
</div>
</form>
</section>
</main>
<script type="module" src="scripts/hub-ux.js?v=20261022-dropdown-stable1"></script>
<script type="module" src="scripts/user-profile-ui.js?v=20261022-users-organization1"></script>
</body>
</html>
