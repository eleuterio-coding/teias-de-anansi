<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Equipamentos de Aventura - Teias de Anansi</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{max-width:1180px;margin:0 auto;padding:24px;line-height:1.5}a{color:inherit}.muted{opacity:.7}.badge{border:1px solid #8886;border-radius:999px;padding:4px 9px;font-size:.8rem}.layout{display:grid;grid-template-columns:minmax(290px,370px) minmax(0,1fr);gap:16px}.panel{border:1px solid #8885;border-radius:12px;overflow:hidden}.controls{display:grid;gap:8px;padding:12px;border-bottom:1px solid #8884}.controls input,.controls select{width:100%;padding:9px 10px;border:1px solid #8887;border-radius:8px;background:transparent;color:inherit}.list{max-height:72vh;overflow:auto}.item{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-bottom:1px solid #8883;background:transparent;color:inherit;cursor:pointer}.item:hover,.item.active{background:#8882}.item strong{display:block}.item small{opacity:.66}.detail{padding:18px;min-height:440px}.detail h2{margin-top:0}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 16px}.kv{display:grid;grid-template-columns:minmax(135px,.7fr) 1.6fr;gap:7px 14px;margin:12px 0}.kv dt{font-weight:700}.kv dd{margin:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem}th,td{padding:7px 8px;border-bottom:1px solid #8884;text-align:left;vertical-align:top}th{white-space:nowrap}.status{margin-top:16px;font-size:.88rem;opacity:.72}.empty{padding:18px;text-align:center;opacity:.7}@media(max-width:760px){body{padding:14px}.layout{grid-template-columns:1fr}.list{max-height:42vh}.detail{min-height:0}.kv{grid-template-columns:1fr}}
 .list .item{text-align:left!important} .equipment-section-card{border:1px solid #8885;border-radius:11px;padding:14px 16px;margin:12px 0}.equipment-section-card h3{margin:0 0 9px}.equipment-source{margin:18px 0 0;border-top:1px solid #8885;padding-top:11px;font-size:.85rem}</style>
  <link rel="stylesheet" href="biblioteca-light.css?v=20261028-hub-layout1">
<script src="scripts/biblioteca-padroes.js?v=20261103-1"></script></head>
<body>
<p><a href="bibliotecas.html?v=20261028-library-hub-layout1">← Bibliotecas</a></p>
<h1>Equipamentos de Aventura</h1>
<div class="layout">
<section class="panel"><div class="controls"><input id="busca" type="search" placeholder="Buscar item, subtipo, livro ou origem…"><select id="filtro"><option value="">Todos os subtipos</option></select></div><div class="list" id="lista"></div></section>
<section class="panel detail" id="detalhe"><p class="muted">Selecione uma entrada para ver os dados mecânicos.</p></section>
</div>
<p class="status" id="status" hidden></p>
<script>
const LABELS={recipiente:"Recipiente",municao:"Munição",kit:"Kit",iluminacao:"Iluminação",alimento:"Alimento",foco:"Foco",roupa:"Roupa",consumivel:"Consumível",explosivo:"Explosivo",armadilha_portatil:"Armadilha portátil",veneno:"Veneno",material:"Material",equipamento_especial:"Equipamento especial"};
let ALL=[],selected=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function expandCore(d){
 const conv=grupo=>grupo.itens.map(r=>({nome:r[0],subtipo:r[1],peso:r[2],custo:r[3],descricao:r[4],...(r[5]||{}),livro:grupo.livro,pdf:d.fonte_pdf,secao:grupo.secao}));
 const rows=[...conv(d.phb),...conv(d.heroes)];
 const ammunition=rows.find(x=>x.nome==='Ammunition');
 const arrows=ammunition?.variantes?.find(x=>x.nome==='Arrows');
 if(arrows)rows.push({nome:'Flecha',subtipo:'municao',peso:arrows.peso,custo:arrows.custo,quantidade:arrows.quantidade,descricao:'Variante de Munição para arcos, conforme a ficha de Munição.',livro:d.phb.livro,secao:d.phb.secao});
 // Preservar o item legado referenciado por antecedentes sem atribuir custo ou peso não documentados.
 rows.push({nome:'Roupas Comuns',subtipo:'roupa',peso:'Não informado',custo:'Não informado',descricao:'Roupa mencionada nos equipamentos de antecedentes legados do Hub; valores não disponíveis no catálogo de equipamentos de 2024.',livro:'Antecedentes legados'});
 return rows;
}
const H=HubBiblioteca;
function searchable(x){return [x.nome,x.original,LABELS[x.subtipo],x.descricao,x.livro,x.custo,x.peso,...(x.aliases||[])].join(" ").toLocaleLowerCase("pt-BR")}
function buildFilter(){const f=document.getElementById("filtro"),types=[...new Set(ALL.map(x=>x.subtipo))].sort((a,b)=>(LABELS[a]||a).localeCompare(LABELS[b]||b,"pt-BR"));f.innerHTML='<option value="">Todos os subtipos</option>'+types.map(t=>'<option value="'+esc(t)+'">'+esc(LABELS[t]||t)+'</option>').join("")}
function renderList(){
 const q=document.getElementById("busca").value.trim().toLocaleLowerCase("pt-BR"),f=document.getElementById("filtro").value;
 const arr=ALL.filter(x=>(!f||x.subtipo===f)&&(!q||searchable(x).includes(q)));
 const el=document.getElementById("lista");
 el.innerHTML=arr.length?arr.map(x=>'<button class="item'+(selected===x?' active':'')+'" data-id="'+x._id+'"><strong>'+esc(x.nome)+'</strong><small>'+esc(LABELS[x.subtipo]||x.subtipo)+'</small></button>').join(""):'<div class="empty">Nenhuma entrada encontrada.</div>';
 el.querySelectorAll(".item").forEach(b=>b.onclick=()=>{selected=ALL.find(x=>String(x._id)===b.dataset.id);renderList();renderDetail(selected)})
}
function genericFields(x){
 const fields=[["Custo",x.custo],["Peso",x.peso],["Capacidade",x.capacidade],["Quantidade",x.quantidade],["Cargas",x.cargas],["Consumo",x.consumo],["Duração",x.duracao]].filter(([,v])=>v!==undefined&&v!==null&&v!=="");
 return fields.length?'<dl class="kv">'+fields.map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+H.termosHtml(v)+'</dd>').join("")+'</dl>':'';
}
function variants(x){
 if(!x.variantes?.length)return "";
 const keys=[...new Set(x.variantes.flatMap(v=>Object.keys(v)))];
 return '<div class="equipment-section-card"><h3>Variantes</h3><div class="tablewrap"><table><thead><tr>'+keys.map(k=>'<th>'+esc(({nome:'Nome',quantidade:'Quantidade',armazenamento:'Armazenamento',peso:'Peso',custo:'Custo'})[k]||k)+'</th>').join("")+'</tr></thead><tbody>'+x.variantes.map(v=>'<tr>'+keys.map(k=>'<td>'+H.termosHtml(k==='nome'?H.equipamento(v[k]):k==='armazenamento'?H.equipamento(v[k]):v[k]??'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>';
}
function renderDetail(x){
 if(!x)return;
 let html='<h2>'+esc(x.nome)+'</h2><div class="meta"><span class="badge">'+esc(LABELS[x.subtipo]||x.subtipo)+'</span></div>';
 html+=genericFields(x)+'<section class="equipment-section-card"><h3>Descrição</h3><p>'+H.termosHtml(x.descricao)+'</p></section>';
 if(x.conteudo?.length)html+='<section class="equipment-section-card"><h3>Conteúdo</h3><ul>'+x.conteudo.map(v=>'<li>'+H.termosHtml(v)+'</li>').join('')+'</ul></section>';
 html+=variants(x);
 if(x.dc_colheita||x.dc_criacao||x.regras_especiais){
   html+='<div class="equipment-section-card">'+(x.dc_colheita?'<p><b>CD de coleta:</b> '+esc(x.dc_colheita)+'</p>':'')+(x.dc_criacao?'<p><b>CD de criação:</b> '+esc(x.dc_criacao)+'</p>':'')+(x.regras_especiais?.length?'<h3>Regras</h3><ul>'+x.regras_especiais.map(v=>'<li>'+H.termosHtml(v)+'</li>').join('')+'</ul>':'')+'</div>';
 }
 html+='<footer class="equipment-source"><b>Livro:</b> '+esc(H.livro(x.livro))+'</footer>';
 document.getElementById("detalhe").innerHTML=html;
}
fetch("dados/equipamentos-aventura-core-pdfs.json?v=20261031-core-only2",{cache:'default'}).then(r=>r.json()).then(core=>{ALL=[...expandCore(core)].map(x=>({...x,original:x.nome,nome:HubBiblioteca.equipamento(x.nome)})).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));ALL.forEach((x,i)=>x._id=i);buildFilter();selected=ALL.find(x=>HubBiblioteca.normalize(x.nome)===HubBiblioteca.normalize(new URLSearchParams(location.search).get("item"))||HubBiblioteca.normalize(x.original)===HubBiblioteca.normalize(new URLSearchParams(location.search).get("item")))||ALL[0];renderList();renderDetail(selected)}).catch(e=>{const status=document.getElementById("status");status.hidden=false;status.textContent=`Falha ao carregar catálogo: ${e.message}`});
document.getElementById("busca").addEventListener("input",renderList);document.getElementById("filtro").addEventListener("change",renderList);
</script>
<script type="module" src="scripts/hub-ux.js?v=20261028-library-hub-layout1"></script>
</body>
</html>
