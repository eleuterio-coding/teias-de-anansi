<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Equipamentos de Aventura - Teias de Anansi</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{max-width:1180px;margin:0 auto;padding:24px;line-height:1.5}a{color:inherit}.muted{opacity:.7}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{border:1px solid #8886;border-radius:999px;padding:4px 9px;font-size:.8rem}.note{border:1px solid #8885;border-radius:12px;padding:12px 14px;margin:16px 0;background:#8881}.layout{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:16px}.panel{border:1px solid #8885;border-radius:12px;overflow:hidden}.controls{display:grid;gap:8px;padding:12px;border-bottom:1px solid #8884}.controls input,.controls select{width:100%;padding:9px 10px;border:1px solid #8887;border-radius:8px;background:transparent;color:inherit}.list{max-height:70vh;overflow:auto}.item{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-bottom:1px solid #8883;background:transparent;color:inherit;cursor:pointer}.item:hover,.item.active{background:#8882}.item strong{display:block}.item small{opacity:.66}.detail{padding:18px;min-height:420px}.detail h2{margin-top:0}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 16px}.kv{display:grid;grid-template-columns:minmax(130px,.7fr) 1.6fr;gap:7px 14px;margin:12px 0}.kv dt{font-weight:700}.kv dd{margin:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem}th,td{padding:7px 8px;border-bottom:1px solid #8884;text-align:left;vertical-align:top}th{white-space:nowrap}.status{margin-top:16px;font-size:.88rem;opacity:.72}.empty{padding:18px;text-align:center;opacity:.7}@media(max-width:760px){body{padding:14px}.layout{grid-template-columns:1fr}.list{max-height:42vh}.detail{min-height:0}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<p><a href="bibliotecas.html?v=20260819-1100">← Bibliotecas</a></p>
<div class="top">
  <div><h1>Equipamentos de Aventura</h1><p class="muted">Materiais e componentes definidos nos dois PDFs registrados no Hub.</p></div>
  <div class="badges" id="badges"></div>
</div>
<div class="note"><strong>Critério do catálogo.</strong> <span id="criterio">Carregando…</span></div>
<div class="layout">
  <section class="panel">
    <div class="controls">
      <input id="busca" type="search" placeholder="Buscar item, origem, material ou livro…">
      <select id="filtro"><option value="">Todos os subtipos</option><option value="componente_de_criatura">Componentes de criatura</option><option value="componente_magico">Componentes mágicos</option><option value="material">Materiais</option></select>
    </div>
    <div class="list" id="lista"></div>
  </section>
  <section class="panel detail" id="detalhe"><p class="muted">Selecione uma entrada para ver os dados mecânicos.</p></section>
</div>
<p class="status" id="status"></p>
<script>
const LABELS={componente_de_criatura:"Componente de criatura",componente_magico:"Componente mágico",material:"Material"};
let ALL=[],DATA=null,selected=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const fmt=n=>Number.isInteger(n)?String(n):String(n).replace(".",",");
function expand(d){
  const out=[],map=new Map();
  for(const [tipo,dcs] of Object.entries(d.componentes.por_tipo)){
    for(const [dc,nomes] of Object.entries(dcs))for(const nome of nomes){
      if(!map.has(nome))map.set(nome,[]);
      map.get(nome).push({tipo,dc:Number(dc)});
    }
  }
  for(const [nome,origens] of map)out.push({nome,subtipo:"componente_de_criatura",descricao:"Componente colhível de criatura usado no subsistema de harvesting e crafting. A CD de coleta depende do tipo de criatura de origem.",origens,aliases:d.componentes.alias[nome]||[],livro:d.componentes.livro,pdf:d.componentes.fonte_pdf,secao:d.componentes.secao});
  for(const e of d.essencias.itens)out.push({nome:e.nome,subtipo:"componente_magico",descricao:`Essência mágica colhível de criaturas de ND ${e.cr}; sua categoria funciona como limite de poder no subsistema de crafting.`,...e,livro:d.essencias.livro,pdf:d.essencias.fonte_pdf,secao:d.essencias.secao});
  d.materiais_mundanos.itens.forEach(m=>out.push({nome:m.nome,subtipo:"material",descricao:`Ingrediente de ${m.categoria.toLowerCase()} do subsistema de harvesting. É coletado com ${m.ferramenta} e refinado com ${m.maquinaria} para produzir ${m.produto}.`,...m,terrenos:d.materiais_mundanos.terrenos,livro:d.materiais_mundanos.livro,pdf:d.materiais_mundanos.fonte_pdf,secao:d.materiais_mundanos.secao}));
  d.materiais_especiais.itens.forEach(m=>out.push({subtipo:"material",categoria:"Material mágico",...m,livro:d.materiais_especiais.livro,pdf:d.materiais_especiais.fonte_pdf,secao:`Harvesting - ${m.nome}`}));
  return out.sort((a,b)=>a.nome.localeCompare(b.nome,"en"));
}
function searchable(x){return [x.nome,LABELS[x.subtipo],x.descricao,x.livro,x.pdf,x.secao,...(x.aliases||[]),...(x.origens||[]).map(o=>o.tipo)].join(" ").toLocaleLowerCase("pt-BR")}
function renderList(){
  const q=document.getElementById("busca").value.trim().toLocaleLowerCase("pt-BR"),f=document.getElementById("filtro").value;
  const arr=ALL.filter(x=>(!f||x.subtipo===f)&&(!q||searchable(x).includes(q)));
  const el=document.getElementById("lista");
  el.innerHTML=arr.length?arr.map(x=>`<button class="item${selected===x?" active":""}" data-name="${esc(x.nome)}"><strong>${esc(x.nome)}</strong><small>${esc(LABELS[x.subtipo])}${x.origens?.length?` · ${x.origens.length} origem(ns)`:""}</small></button>`).join(""):`<div class="empty">Nenhuma entrada encontrada.</div>`;
  el.querySelectorAll(".item").forEach(b=>b.onclick=()=>{selected=arr.find(x=>x.nome===b.dataset.name);renderList();renderDetail(selected)});
}
function baseMeta(x){return `<div class="meta"><span class="badge">${esc(LABELS[x.subtipo])}</span><span class="badge">${esc(x.livro)}</span><span class="badge">${esc(x.pdf)}</span></div><p>${esc(x.descricao)}</p>`}
function renderDetail(x){
  if(!x)return;
  let h=`<h2>${esc(x.nome)}</h2>${baseMeta(x)}`;
  if(x.aliases?.length)h+=`<p><strong>Também aparece como:</strong> ${x.aliases.map(esc).join(", ")}</p>`;
  if(x.subtipo==="componente_de_criatura"){
    h+=`<h3>Origens e CDs de coleta</h3><div class="tablewrap"><table><thead><tr><th>Tipo de criatura</th><th>CD</th></tr></thead><tbody>${x.origens.map(o=>`<tr><td>${esc(o.tipo)}</td><td>${o.dc}</td></tr>`).join("")}</tbody></table></div>`;
    const trades=[...new Set(x.origens.map(o=>o.dc))].map(dc=>DATA.comercio_componentes.find(r=>r.dc===dc)).filter(Boolean);
    if(trades.length)h+=`<h3>Valores por CD</h3><div class="tablewrap"><table><thead><tr><th>CD</th><th>Venda</th><th>Compra</th><th>Venda c/ suprimentos</th><th>Compra c/ suprimentos</th></tr></thead><tbody>${trades.map(r=>`<tr><td>${r.dc}</td><td>${r.venda_sem}</td><td>${r.compra_sem}</td><td>${r.venda_com}</td><td>${r.compra_com}</td></tr>`).join("")}</tbody></table></div>`;
  } else if(x.subtipo==="componente_magico"){
    h+=`<dl class="kv"><dt>ND de origem</dt><dd>${esc(x.cr)}</dd><dt>CD de coleta</dt><dd>${x.dc}</dd><dt>Raridade</dt><dd>${esc(x.raridade)}</dd></dl><h3>Comércio</h3><div class="tablewrap"><table><thead><tr><th></th><th>Venda</th><th>Compra</th></tr></thead><tbody><tr><th>Sem suprimentos</th><td>${x.venda_sem}</td><td>${x.compra_sem}</td></tr><tr><th>Com suprimentos</th><td>${x.venda_com}</td><td>${x.compra_com}</td></tr></tbody></table></div>`;
  } else if(x.cd && x.terrenos){
    h+=`<dl class="kv"><dt>Categoria</dt><dd>${esc(x.categoria)}</dd><dt>Ferramenta</dt><dd>${esc(x.ferramenta)}</dd><dt>Maquinaria</dt><dd>${esc(x.maquinaria)}</dd><dt>Produto</dt><dd>${esc(x.produto)}</dd><dt>Peso bruto</dt><dd>${fmt(x.peso_bruto_lb)} lb</dd><dt>Peso refinado</dt><dd>${fmt(x.peso_refinado_lb)} lb</dd><dt>Valor refinado</dt><dd>${esc(x.valor_refinado)}</dd><dt>Valor bruto</dt><dd>metade do valor refinado</dd></dl>`;
    if(x.naturalmente_magico)h+=`<p><strong>Nota:</strong> a fonte trata esta matéria-prima como naturalmente mágica; itens mágicos acabados produzidos a partir dela permanecem fora deste módulo.</p>`;
    h+=`<h3>CD para encontrar por terreno</h3><div class="tablewrap"><table><tbody>${x.terrenos.map((t,i)=>`<tr><th>${esc(t)}</th><td>${x.cd[i]}</td></tr>`).join("")}</tbody></table></div>`;
  } else {
    h+=`<dl class="kv">${x.dc_colheita?`<dt>CD de coleta</dt><dd>${x.dc_colheita}</dd>`:""}${x.dc_criacao?`<dt>CD de criação</dt><dd>${x.dc_criacao}</dd>`:""}${x.pagina?`<dt>Página do livro</dt><dd>${x.pagina}</dd>`:""}</dl>`;
    if(x.regras_especiais?.length)h+=`<h3>Regras</h3><ul>${x.regras_especiais.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`;
  }
  h+=`<h3>Fonte</h3><p>${esc(x.livro)} · ${esc(x.pdf)} · ${esc(x.secao)}</p>`;
  document.getElementById("detalhe").innerHTML=h;
}
fetch("dados/equipamentos-aventura-pdfs.json?v=20260819-1100",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(d=>{
  DATA=d;ALL=expand(d);
  document.getElementById("criterio").textContent=d.criterio;
  const c=d.auditoria.por_subtipo;
  document.getElementById("badges").innerHTML=`<span class="badge">${ALL.length} itens</span><span class="badge">${c.componente_de_criatura} componentes de criatura</span><span class="badge">${c.componente_magico} componentes mágicos</span><span class="badge">${c.material} materiais</span><span class="badge">2 PDFs</span>`;
  document.getElementById("status").textContent=ALL.length===d.auditoria.total_publicado?`Publicado e verificado: ${ALL.length} entradas únicas consolidadas dos dois PDFs.`:`Atenção: a expansão produziu ${ALL.length} entradas, mas a auditoria esperava ${d.auditoria.total_publicado}.`;
  renderList();selected=ALL[0];renderList();renderDetail(selected);
}).catch(e=>{document.getElementById("status").textContent=`Falha ao carregar catálogo: ${e.message}`});
document.getElementById("busca").addEventListener("input",renderList);
document.getElementById("filtro").addEventListener("change",renderList);
</script>
</body>
</html>
