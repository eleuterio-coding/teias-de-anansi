:root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{max-width:1180px;margin:0 auto;padding:24px;line-height:1.5}a{color:inherit}.muted{opacity:.7}.badge{border:1px solid #8886;border-radius:999px;padding:4px 9px;font-size:.8rem}.layout{display:grid;grid-template-columns:minmax(290px,370px) minmax(0,1fr);gap:16px}.panel{border:1px solid #8885;border-radius:12px;overflow:hidden}.controls{display:grid;gap:8px;padding:12px;border-bottom:1px solid #8884}.controls input,.controls select{width:100%;padding:9px 10px;border:1px solid #8887;border-radius:8px;background:transparent;color:inherit}.list{max-height:72vh;overflow:auto}.item{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-bottom:1px solid #8883;background:transparent;color:inherit;cursor:pointer}.item:hover,.item.active{background:#8882}.item strong{display:block}.item small{opacity:.66}.detail{padding:18px;min-height:440px}.detail h2{margin-top:0}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 16px}.kv{display:grid;grid-template-columns:minmax(135px,.7fr) 1.6fr;gap:7px 14px;margin:12px 0}.kv dt{font-weight:700}.kv dd{margin:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem}th,td{padding:7px 8px;border-bottom:1px solid #8884;text-align:left;vertical-align:top}th{white-space:nowrap}.status{margin-top:16px;font-size:.88rem;opacity:.72}.empty{padding:18px;text-align:center;opacity:.7}@media(max-width:760px){body{padding:14px}.layout{grid-template-columns:1fr}.list{max-height:42vh}.detail{min-height:0}.kv{grid-template-columns:1fr}}

<body>
<p><a href="bibliotecas.html?v=20260819-1135">← Bibliotecas</a></p>
<h1>Equipamentos de Aventura</h1>
<div class="layout">
<section class="panel"><div class="controls"><input id="busca" type="search" placeholder="Buscar item, subtipo, livro ou origem…"><select id="filtro"><option value="">Todos os subtipos</option></select></div><div class="list" id="lista"></div></section>
<section class="panel detail" id="detalhe"><p class="muted">Selecione uma entrada para ver os dados mecânicos.</p></section>
</div>
<p class="status" id="status" hidden></p>
<script>
const LABELS={recipiente:"Recipiente",municao:"Munição",kit:"Kit",iluminacao:"Iluminação",alimento:"Alimento",foco:"Foco",roupa:"Roupa",consumivel:"Consumível",explosivo:"Explosivo",armadilha_portatil:"Armadilha portátil",veneno:"Veneno",material:"Material",componente_de_criatura:"Componente de criatura",componente_magico:"Componente mágico",equipamento_especial:"Equipamento especial"};
let ALL=[],BASE=null,selected=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const fmt=n=>Number.isInteger(n)?String(n):String(n).replace(".",",");
function expandBase(d){const out=[],map=new Map();for(const [tipo,dcs] of Object.entries(d.componentes.por_tipo)){for(const [dc,nomes] of Object.entries(dcs))for(const nome of nomes){if(!map.has(nome))map.set(nome,[]);map.get(nome).push({tipo,dc:Number(dc)})}}for(const [nome,origens] of map)out.push({nome,subtipo:"componente_de_criatura",descricao:"Componente colhível usado no subsistema de harvesting e crafting; a CD de coleta depende do tipo de criatura de origem.",origens,aliases:d.componentes.alias[nome]||[],livro:d.componentes.livro,pdf:d.componentes.fonte_pdf,secao:d.componentes.secao});for(const e of d.essencias.itens)out.push({nome:e.nome,subtipo:"componente_magico",descricao:`Essência mágica colhível de criaturas de ND ${e.cr}; sua categoria limita o poder no subsistema de crafting.`,...e,livro:d.essencias.livro,pdf:d.essencias.fonte_pdf,secao:d.essencias.secao});d.materiais_mundanos.itens.forEach(m=>out.push({nome:m.nome,subtipo:"material",descricao:`Ingrediente de ${m.categoria.toLowerCase()} coletado com ${m.ferramenta} e refinado com ${m.maquinaria} para produzir ${m.produto}.`,...m,terrenos:d.materiais_mundanos.terrenos,livro:d.materiais_mundanos.livro,pdf:d.materiais_mundanos.fonte_pdf,secao:d.materiais_mundanos.secao}));d.materiais_especiais.itens.forEach(m=>out.push({subtipo:"material",categoria:"Material especial",...m,livro:d.materiais_especiais.livro,pdf:d.materiais_especiais.fonte_pdf,secao:`Harvesting — ${m.nome}`}));return out}
function expandCore(d){const conv=(grupo)=>grupo.itens.map(r=>({nome:r[0],subtipo:r[1],peso:r[2],custo:r[3],descricao:r[4],...(r[5]||{}),livro:grupo.livro,pdf:d.fonte_pdf,secao:grupo.secao}));return [...conv(d.phb),...conv(d.heroes)]}
function searchable(x){return [x.nome,LABELS[x.subtipo],x.descricao,x.livro,x.pdf,x.secao,x.custo,x.peso,...(x.aliases||[]),...(x.origens||[]).map(o=>o.tipo),...(x.conteudo||[])].join(" ").toLocaleLowerCase("pt-BR")}
function buildFilter(){const f=document.getElementById("filtro"),types=[...new Set(ALL.map(x=>x.subtipo))].sort((a,b)=>(LABELS[a]||a).localeCompare(LABELS[b]||b,"pt-BR"));f.innerHTML='<option value="">Todos os subtipos</option>'+types.map(t=>`<option value="${esc(t)}">${esc(LABELS[t]||t)}</option>`).join("")}
function renderList(){const q=document.getElementById("busca").value.trim().toLocaleLowerCase("pt-BR"),f=document.getElementById("filtro").value;const arr=ALL.filter(x=>(!f||x.subtipo===f)&&(!q||searchable(x).includes(q)));const el=document.getElementById("lista");el.innerHTML=arr.length?arr.map((x,i)=>`<button class="item${selected===x?" active":""}" data-id="${x._id}"><strong>${esc(x.nome)}</strong><small>${esc(LABELS[x.subtipo]||x.subtipo)} · ${esc(x.livro)}</small></button>`).join(""):`<div class="empty">Nenhuma entrada encontrada.</div>`;el.querySelectorAll(".item").forEach(b=>b.onclick=()=>{selected=ALL.find(x=>String(x._id)===b.dataset.id);renderList();renderDetail(selected)})}
function baseMeta(x){return `<div class="meta"><span class="badge">${esc(LABELS[x.subtipo]||x.subtipo)}</span><span class="badge">${esc(x.livro)}</span><span class="badge">${esc(x.pdf)}</span></div><p>${esc(x.descricao)}</p>`}
function genericFields(x){const fields=[["Custo",x.custo],["Peso",x.peso],["Capacidade",x.capacidade],["Quantidade",x.quantidade],["Cargas",x.cargas],["Consumo",x.consumo],["Duração",x.duracao]].filter(([,v])=>v!==undefined&&v!==null&&v!=="");return fields.length?`<dl class="kv">${fields.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`:""}
function variants(x){if(!x.variantes?.length)return "";const keys=[...new Set(x.variantes.flatMap(v=>Object.keys(v)))];return `<h3>Variantes</h3><div class="tablewrap"><table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join("")}</tr></thead><tbody>${x.variantes.map(v=>`<tr>${keys.map(k=>`<td>${esc(v[k]??"—")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function renderDetail(x){if(!x)return;let h=`<h2>${esc(x.nome)}</h2>${baseMeta(x)}${genericFields(x)}`;if(x.aliases?.length)h+=`<p><strong>Também aparece como:</strong> ${x.aliases.map(esc).join(", ")}</p>`;if(x.conteudo?.length)h+=`<h3>Conteúdo</h3><ul>${x.conteudo.map(v=>`<li>${esc(v)}</li>`).join("")}</ul>`;h+=variants(x);if(x.subtipo==="componente_de_criatura"){h+=`<h3>Origens e CDs de coleta</h3><div class="tablewrap"><table><thead><tr><th>Tipo de criatura</th><th>CD</th></tr></thead><tbody>${x.origens.map(o=>`<tr><td>${esc(o.tipo)}</td><td>${o.dc}</td></tr>`).join("")}</tbody></table></div>`;const trades=[...new Set(x.origens.map(o=>o.dc))].map(dc=>BASE.comercio_componentes.find(r=>r.dc===dc)).filter(Boolean);if(trades.length)h+=`<h3>Comércio por CD</h3><div class="tablewrap"><table><thead><tr><th>CD</th><th>Venda</th><th>Compra</th><th>Venda c/ suprimentos</th><th>Compra c/ suprimentos</th></tr></thead><tbody>${trades.map(r=>`<tr><td>${r.dc}</td><td>${r.venda_sem}</td><td>${r.compra_sem}</td><td>${r.venda_com}</td><td>${r.compra_com}</td></tr>`).join("")}</tbody></table></div>`}else if(x.subtipo==="componente_magico"){h+=`<dl class="kv"><dt>ND de origem</dt><dd>${esc(x.cr)}</dd><dt>CD de coleta</dt><dd>${x.dc}</dd><dt>Raridade</dt><dd>${esc(x.raridade)}</dd></dl><h3>Comércio</h3><div class="tablewrap"><table><thead><tr><th></th><th>Venda</th><th>Compra</th></tr></thead><tbody><tr><th>Sem suprimentos</th><td>${x.venda_sem}</td><td>${x.compra_sem}</td></tr><tr><th>Com suprimentos</th><td>${x.venda_com}</td><td>${x.compra_com}</td></tr></tbody></table></div>`}else if(x.cd&&x.terrenos){h+=`<dl class="kv"><dt>Categoria</dt><dd>${esc(x.categoria)}</dd><dt>Ferramenta</dt><dd>${esc(x.ferramenta)}</dd><dt>Maquinaria</dt><dd>${esc(x.maquinaria)}</dd><dt>Produto</dt><dd>${esc(x.produto)}</dd><dt>Peso bruto</dt><dd>${fmt(x.peso_bruto_lb)} lb</dd><dt>Peso refinado</dt><dd>${fmt(x.peso_refinado_lb)} lb</dd><dt>Valor refinado</dt><dd>${esc(x.valor_refinado)}</dd></dl>`;if(x.naturalmente_magico)h+=`<p><strong>Nota:</strong> a matéria-prima é naturalmente mágica; itens acabados permanecem no módulo Itens Mágicos.</p>`;h+=`<h3>CD para encontrar por terreno</h3><div class="tablewrap"><table><tbody>${x.terrenos.map((t,i)=>`<tr><th>${esc(t)}</th><td>${x.cd[i]}</td></tr>`).join("")}</tbody></table></div>`}else if(x.dc_colheita||x.dc_criacao||x.regras_especiais){h+=`<dl class="kv">${x.dc_colheita?`<dt>CD de coleta</dt><dd>${x.dc_colheita}</dd>`:""}${x.dc_criacao?`<dt>CD de criação</dt><dd>${x.dc_criacao}</dd>`:""}${x.pagina?`<dt>Página do livro</dt><dd>${x.pagina}</dd>`:""}</dl>${x.regras_especiais?.length?`<h3>Regras</h3><ul>${x.regras_especiais.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}`};h+=`<h3>Fonte</h3><p>${esc(x.livro)} · ${esc(x.pdf)} · ${esc(x.secao)}</p>`;document.getElementById("detalhe").innerHTML=h}
Promise.all([fetch("dados/equipamentos-aventura-pdfs.json?v=20260819-1135",{cache:"no-store"}).then(r=>r.json()),fetch("dados/equipamentos-aventura-core-pdfs.json?v=20260819-1135",{cache:"no-store"}).then(r=>r.json())]).then(([base,core])=>{BASE=base;ALL=[...expandBase(base),...expandCore(core)].sort((a,b)=>a.nome.localeCompare(b.nome,"en"));ALL.forEach((x,i)=>x._id=i);buildFilter();selected=ALL[0];renderList();renderDetail(selected)}).catch(e=>{const status=document.getElementById("status");status.hidden=false;status.textContent=`Falha ao carregar catálogo: ${e.message}`});
document.getElementById("busca").addEventListener("input",renderList);document.getElementById("filtro").addEventListener("change",renderList);
</script>
