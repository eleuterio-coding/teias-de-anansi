<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Armaduras - Biblioteca - Teias de Anansi</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--b:#8885;--soft:#8881}*{box-sizing:border-box}body{max-width:1280px;margin:auto;padding:22px;line-height:1.5}a{color:inherit}.muted{opacity:.72}.badge{display:inline-block;border:1px solid var(--b);border-radius:999px;padding:3px 8px;font-size:.78rem;margin:2px}.nota{padding:12px 14px;border:1px dashed #8888;border-radius:10px;margin:14px 0}.layout{display:grid;grid-template-columns:minmax(290px,370px) minmax(0,1fr);gap:16px;align-items:start}.painel{border:1px solid var(--b);border-radius:11px;overflow:hidden}.tools{padding:11px;border-bottom:1px solid var(--b);display:grid;gap:8px;position:sticky;top:0;background:Canvas;z-index:3}.tools input,.tools select{font:inherit;padding:9px;border:1px solid #8887;border-radius:8px;background:transparent;color:inherit;width:100%}.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lista{max-height:76vh;overflow:auto}.item{display:block;width:100%;padding:10px 11px;text-align:left;border:0;border-bottom:1px solid #8883;background:transparent;color:inherit;cursor:pointer}.item:hover,.item.on{background:var(--soft)}.item strong,.item small{display:block}.item small{opacity:.63}.detalhe{padding:18px;min-height:510px}.meta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.88rem;opacity:.8}.box{border:1px solid #8884;border-radius:9px;padding:12px 14px;margin:12px 0}.box h3{margin-top:0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin:14px 0}.stat{border:1px solid #8884;border-radius:8px;padding:9px}.stat b,.stat span{display:block}.stat span{font-size:1.02rem;margin-top:2px}.count{font-size:.85rem;opacity:.72}.vazio{padding:18px;opacity:.7}.warning{font-weight:650}@media(max-width:820px){body{padding:14px}.layout{grid-template-columns:1fr}.lista{max-height:360px}.filtros{grid-template-columns:1fr}}
</style>
  <link rel="stylesheet" href="biblioteca-light.css?v=20260827-library-layout1">
</head>
<body>
<p><a href="bibliotecas.html?v=20260819-1100">← Bibliotecas</a></p>
<header><h1>Armaduras</h1></header>
<div class="layout"><aside class="painel"><div class="tools"><input id="q" type="search" placeholder="Buscar armadura, escudo, CA ou propriedade..."><div class="filtros"><select id="origem"><option value="">Todas as origens</option><option value="oficial">Oficial 2024</option><option value="demo">Demonstrativo</option></select><select id="categoria"><option value="">Todas as categorias</option></select></div><div id="count" class="count"></div></div><div id="lista" class="lista"></div></aside><section id="detalhe" class="painel detalhe"><div class="vazio">Selecione uma armadura para abrir os detalhes.</div></section></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let ALL=[],CURRENT='',DATA=null;
const origemLabel=x=>x.canonico?'Oficial 2024':'Demonstrativo / não canônico';const pdfLabel=x=>x.canonico?'pdf24_merged-1.pdf · valores mundanos conferidos no compilado':'pdf24_merged-1.pdf · tabela demonstrativa de Xyleff';
function renderDetail(id){CURRENT=id;renderList();const x=ALL.find(i=>i.id===id);if(!x)return;const extra=[x.dano?`<span><b>Dano:</b> ${esc(x.dano)}</span>`:'',x.propriedade?`<span><b>Propriedade:</b> ${esc(x.propriedade)}</span>`:'',x.maestria?`<span><b>Maestria:</b> ${esc(x.maestria)}</span>`:''].join('');const craft=x.fabricacao?`<div class="box"><h3>Fabricação — referência complementar</h3><div class="meta"><span><b>Materiais:</b> ${esc(x.fabricacao.custo_materiais)}</span><span><b>Ferramenta:</b> ${esc(x.fabricacao.ferramenta)}</span><span><b>Tempo:</b> ${esc(x.fabricacao.tempo_horas)} h</span><span><b>CD:</b> ${esc(x.fabricacao.cd)}</span></div><p class="muted">Tabela de fabricação conferida em pdf24_merged-1.pdf.</p></div>`:'';const special=x.regra_especial?`<div class="box"><h3>Regra especial</h3><p>${esc(x.regra_especial)}</p></div>`:'';document.getElementById('detalhe').innerHTML=`<h2>${esc(x.nome)}</h2><div class="meta"><span class="badge">${esc(x.categoria)}</span><span class="badge">${esc(origemLabel(x))}</span><span><b>Fonte:</b> ${esc(x.fonte)}</span><span><b>Ocorrência:</b> ${esc(pdfLabel(x))}</span></div><div class="stats"><div class="stat"><b>CA</b><span>${esc(x.ca)}</span></div><div class="stat"><b>Custo</b><span>${esc(x.custo)}</span></div><div class="stat"><b>Peso</b><span>${esc(x.peso)}</span></div><div class="stat"><b>Força mínima</b><span>${x.forca_minima?esc('For '+x.forca_minima):'—'}</span></div><div class="stat"><b>Furtividade</b><span>${esc(x.furtividade)}</span></div></div><div class="box"><p>${esc(x.descricao)}</p><div class="meta">${extra}</div>${x.canonico?'':`<p class="warning">Status editorial: não canonizar.</p>`}</div>${special}${craft}`}
function renderList(){const q=norm(document.getElementById('q').value),cat=document.getElementById('categoria').value,orig=document.getElementById('origem').value;const rows=ALL.filter(x=>(!cat||x.categoria===cat)&&(!orig||(orig==='oficial'&&x.canonico)||(orig==='demo'&&!x.canonico))&&(!q||norm([x.nome,x.categoria,x.ca,x.custo,x.peso,x.furtividade,x.fonte,x.dano,x.propriedade,x.maestria,x.regra_especial].join(' ')).includes(q)));document.getElementById('count').textContent=`${rows.length} de ${ALL.length} registros`;document.getElementById('lista').innerHTML=rows.map(x=>`<button class="item ${CURRENT===x.id?'on':''}" data-id="${esc(x.id)}"><strong>${esc(x.nome)}</strong><small>${esc(x.categoria)} · ${esc(origemLabel(x))} · CA ${esc(x.ca)}</small></button>`).join('')||'<div class="vazio">Nenhuma armadura encontrada.</div>';document.querySelectorAll('.item').forEach(b=>b.onclick=()=>renderDetail(b.dataset.id))}
(async()=>{try{const r=await fetch('dados/armaduras-pdfs.json?v=20260819-1118',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);DATA=await r.json();ALL=DATA.armaduras||[];if(ALL.length!==34)throw new Error(`catálogo incompleto: ${ALL.length}/34`);const cats=[...new Set(ALL.map(x=>x.categoria))];document.getElementById('categoria').innerHTML='<option value="">Todas as categorias</option>'+cats.map(t=>`<option>${esc(t)}</option>`).join('');renderList();if(ALL[0])renderDetail(ALL[0].id)}catch(e){document.getElementById('detalhe').innerHTML=`<div class="vazio"><strong>Falha ao carregar catálogo:</strong> ${esc(e.message)}</div>`}})();['q','categoria','origem'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',renderList));
</script>
