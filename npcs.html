<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NPCs - Teias de Anansi</title>
<link rel="stylesheet" href="campaigns.css?v=20261022-status-palette2"><link rel="stylesheet" href="hub-collections.css?v=20261021-unified-status-colors1"><link rel="stylesheet" href="hub-ux.css?v=20261022-status-palette2"><link rel="stylesheet" href="hub-directories.css?v=20261022-directories1"></head>
<body><main id="main-content" class="hub-directory">
<header class="hub-directory-heading"><div><h1>NPCs</h1><p id="npc-subtitle">Personagens não jogadores das suas campanhas.</p></div><div class="hub-directory-heading-actions" id="npc-master-actions" hidden><button type="button" id="link-npc" class="btn secondary">Vincular / configurar</button><a class="btn" href="criacao-personagem.html?npc=1">Novo NPC</a></div></header>
<section class="hub-directory-metrics" id="npc-metrics" aria-label="Resumo dos NPCs"></section>
<section class="hub-directory-editor" id="npc-editor" hidden aria-label="Configuração do NPC">
<div class="hub-directory-editor-top"><h2>Configurar NPC na campanha</h2><button type="button" class="secondary" id="close-npc-editor">Fechar</button></div>
<form id="npc-directory-form">
<div class="hub-directory-form-grid">
<label>Campanha<select id="npc-campaign" required></select></label><label>NPC existente<select id="npc-identity" required></select></label>
<label>Categoria<select id="npc-category"><option value="neutral">Neutro</option><option value="ally">Aliado</option><option value="enemy">Inimigo</option><option value="mentor">Mentor</option><option value="merchant">Comerciante</option><option value="antagonist">Antagonista</option><option value="contact">Contato</option></select></label>
<label>Papel narrativo<input id="npc-role" maxlength="200" placeholder="Ex.: conselheiro"></label>
<label>Facção verdadeira<input id="npc-faction" maxlength="200"></label><label>Relação verdadeira<input id="npc-relationship" maxlength="200"></label>
<label>Status verdadeiro<input id="npc-status" maxlength="80" placeholder="Ex.: vivo"></label><label>Localização verdadeira<input id="npc-location" maxlength="200"></label>
<label class="hub-directory-wide">Anotações exclusivas do mestre<textarea id="npc-notes" maxlength="6000"></textarea></label>
</div>
<fieldset class="hub-directory-public"><legend>Informações reveladas aos jogadores</legend>
<label class="hub-directory-checkbox"><input type="checkbox" id="npc-reveal"> Revelar este NPC aos jogadores com acesso à campanha</label>
<p class="hub-directory-hint">Somente os campos abaixo serão compartilhados. Campos em branco não revelam informações.</p>
<div class="hub-directory-form-grid">
<label>Nome conhecido<input id="npc-public-name" maxlength="200"></label><label>Ocupação conhecida<input id="npc-public-role" maxlength="200"></label>
<label>Facção conhecida<input id="npc-public-faction" maxlength="200"></label><label>Relação conhecida<input id="npc-public-relationship" maxlength="200"></label>
<label>Situação conhecida<input id="npc-public-status" maxlength="100"></label><label>Última localização conhecida<input id="npc-public-location" maxlength="200"></label>
<label>URL pública do retrato<input id="npc-public-portrait" maxlength="1000" type="url" placeholder="https://..."></label>
<label class="hub-directory-wide">Descrição pública<textarea id="npc-public-description" maxlength="2000"></textarea></label>
</div></fieldset>
<div class="row-actions"><button type="submit" id="save-npc-entry">Salvar vínculo e visibilidade</button><button type="button" id="unlink-npc-entry" class="secondary" hidden>Desvincular desta campanha</button></div>
</form></section>
<section class="hub-directory-filters" aria-label="Filtros de NPCs"><label>Pesquisar<input type="search" id="npc-search" placeholder="Nome, função, facção"></label><label>Campanha<select id="npc-campaign-filter"><option value="all">Todas as campanhas</option></select></label><label>Categoria<select id="npc-category-filter"><option value="all">Todas as categorias</option><option value="ally">Aliados</option><option value="enemy">Inimigos</option><option value="neutral">Neutros</option><option value="mentor">Mentores</option><option value="merchant">Comerciantes</option><option value="antagonist">Antagonistas</option><option value="contact">Contatos</option></select></label><label>Situação<select id="npc-visibility-filter"><option value="all">Todas</option><option value="revealed">Revelados</option><option value="hidden">Não revelados</option></select></label><div class="hub-directory-display" role="group" aria-label="Visualização"><button type="button" id="npc-view-cards" aria-pressed="true">Cards</button><button type="button" id="npc-view-list" aria-pressed="false">Lista</button></div></section>
<section aria-labelledby="npc-list-title"><h2 class="hub-directory-section-title" id="npc-list-title">Lista de NPCs</h2><div id="npc-list" class="hub-directory-grid" aria-live="polite"></div></section>
</main><script type="module" src="scripts/hub-ux.js?v=20261022-settings-users-layout1"></script><script type="module" src="scripts/npc-list-ui.js?v=20261022-directories1"></script></body></html>
