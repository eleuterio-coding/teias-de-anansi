<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Classes — 5.5e - Biblioteca - Teias de Anansi</title><style>:root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--b:#8885;--soft:#f5f5f5}*{box-sizing:border-box}html,body{background:#fff;color:#000}body{max-width:1180px;margin:auto;padding:24px;line-height:1.55}a{color:inherit}.muted{opacity:.72}.nota,.erro,.vazio{padding:13px 15px;border:1px dashed #8888;border-radius:10px;margin:14px 0}.controles{display:grid;grid-template-columns:minmax(230px,1fr) minmax(180px,260px);gap:10px;margin:18px 0 8px}input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid #8887;border-radius:8px;background:#fff;color:#000}.resultado{opacity:.7}.classe{border:1px solid var(--b);border-radius:12px;margin:10px 0;overflow:hidden}.classe>summary{cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:16px}.classe>summary:hover{background:var(--soft)}.sub{font-size:.85rem;opacity:.68}.corpo{padding:0 16px 18px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.stat{border:1px solid var(--b);border-radius:9px;padding:9px 10px}.stat strong{display:block;font-size:.78rem;opacity:.7;text-transform:uppercase}.bloco{margin-top:18px}.feature{border-left:3px solid #8886;padding-left:11px;margin:11px 0}.feature h4{margin:0}.feature p{white-space:pre-line}.tabela-wrap{overflow:auto;border:1px solid var(--b);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid #8883}th{background:#fff;font-size:.82rem}.meta{border-top:1px solid #8883;margin-top:18px;padding-top:11px;font-size:.88rem;opacity:.78;display:flex;gap:8px 20px;flex-wrap:wrap}@media(max-width:700px){body{padding:16px}.controles{grid-template-columns:1fr}.classe>summary{display:block}.sub{display:block;margin-top:4px}}</style><link rel="stylesheet" href="biblioteca-light.css?v=20261028-hub-layout1"></head><body>
<p><a href="classes.html?v=20261028-library-hub-layout1">← Classes</a></p><header><h1>Classes — 5.5e</h1></header><div class="controles"><input id="busca" type="search" placeholder="Buscar classe, atributo ou característica..."><select id="filtro"><option value="">Todas as classes</option><option value="conjurador">Com conjuração</option><option value="nao-conjurador">Sem conjuração</option></select></div><p class="resultado" id="resultado">Carregando...</p><main id="lista"></main>

<script>
const PIN='bfd3db4bcc31699cce703b46feb9af3f0ff08999',RAW=`https://raw.githubusercontent.com/5e-bits/5e-database/${PIN}/src/2024/en`,V='20260823-rules-audit1',STANDARD_ASI=new Set([4,8,12,16,19]);
const EXPECTED=['barbarian','bard','cleric','druid','fighter','monk','paladin','ranger','rogue','sorcerer','warlock','wizard'],LOCFILES={barbarian:'barbaro',bard:'bardo',cleric:'clerigo',druid:'druida',fighter:'guerreiro',monk:'monge',paladin:'paladino',ranger:'patrulheiro',rogue:'ladino',sorcerer:'feiticeiro',warlock:'bruxo',wizard:'mago'},DESCR={barbarian:'Guerreiro movido por poder primal e Fúria.',bard:'Conjurador e especialista versátil.',cleric:'Campeão de poder divino.',druid:'Conjurador primal ligado à natureza.',fighter:'Especialista marcial completo.',monk:'Artista marcial móvel e disciplinado.',paladin:'Guerreiro sagrado de juramento.',ranger:'Guerreiro explorador e conjurador primal.',rogue:'Especialista em precisão, furtividade e perícias.',sorcerer:'Conjurador de poder inato.',warlock:'Ocultista de pactos e invocações.',wizard:'Estudioso da magia arcana.'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),arr=v=>Array.isArray(v)?v:[],fold=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR');let G={},LOC={},DATA=[];
async function json(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
function t(v){if(v==null)return'';let s=String(v);for(const d of[G.classes,G.atributos,G.pericias,G.condicoes,G.danos,G.tamanhos,G.acoes,G.regras,G.armas,G.armaduras])for(const[k,val]of Object.entries(d||{}))s=s.replace(new RegExp(`\\b${k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'g'),val);return s}
function nomes(v){return arr(v).map(x=>t(x?.name||x?.desc||String(x))).filter(Boolean).join(', ')}function primary(c){return t(c.primary_ability?.desc||nomes(c.primary_ability?.ability_scores)||'—')}
function levelsFor(levels,slug){const seen=new Set;return arr(levels).filter(x=>x?.class?.index===slug||String(x?.index||'').startsWith(`${slug}-`)).sort((a,b)=>Number(a.level)-Number(b.level)).filter(x=>{const n=Number(x.level);if(n<1||n>20||seen.has(n))return false;seen.add(n);return true})}
function featureLoc(slug,f){const feats=LOC[slug]?.features||{};if(feats[f.index])return feats[f.index];let key=String(f.index||'').replace(/-\d+$/,'');if(feats[key])return feats[key];return{nome:t(f.name||'Característica'),descricao:arr(f.desc).join('\n')||''}}
function isAsi(slug,f){const l=featureLoc(slug,f);return/ability score improvement|melhoria de atributo|aumento de atributo/i.test(`${f?.name||''} ${l?.nome||''}`)}function activeRef(slug,f,level){return!(STANDARD_ASI.has(Number(level))&&isAsi(slug,f))}
function featureList(levels,slug,fmap){const out=[],seen=new Set;for(const l of levelsFor(levels,slug))for(const ref of arr(l.features)){if(!activeRef(slug,ref,l.level)||seen.has(ref.index))continue;seen.add(ref.index);const raw=fmap.get(ref.index)||ref,loc=featureLoc(slug,raw);out.push({...loc,index:ref.index,_nivel:l.level})}return out}
function normalize(c,levels,fmap){const ls=levelsFor(levels,c.index);return{slug:c.index,nome:LOC[c.index]?.nome||t(c.name),descricao:DESCR[c.index]||'',dados:c,levels:ls,features:featureList(levels,c.index,fmap),caster:!!c.spellcasting}}

const ARTIFICER_FEATURES={
 'Spellcasting':'Conjuração',"Tinker's Magic":'Magia de Funileiro',
 'Replicate Magic Item':'Replicar Item Mágico','Artificer Subclass':'Subclasse de Artífice',
 'Subclass feature':'Característica de subclasse','Ability Score Improvement':'Aumento de Atributo',
 'Magic Item Tinker':'Funileiro de Itens Mágicos','Flash of Genius':'Clarão de Genialidade',
 'Magic Item Adept':'Adepto de Itens Mágicos','Spell-Storing Item':'Item de Armazenar Magia',
 'Advanced Artifice':'Artificiaria Avançada','Magic Item Master':'Mestre dos Itens Mágicos',
 'Epic Boon':'Dádiva Épica','Soul of Artifice':'Alma da Artificiaria'
};
function artNames(s){return String(s||'—').split(';').map(x=>ARTIFICER_FEATURES[x.trim()]||x.trim()).join('; ')}
function normalizeArtificer(pkg){
  if(!pkg?.controle?.completo||!pkg.classe)throw new Error('Artífice: registro incompleto.');
  const c=pkg.classe;
  return {slug:'artificer',nome:'Artífice',descricao:c.descricao,
    dados:{hit_die:8},levels:arr(c.progressao),features:arr(c.caracteristicas),
    caster:true,artificer:c};
}
function renderArtificer(i){
  const c=i.artificer,d=c.dados_base||{},levels=arr(c.progressao);
  const show=(v)=>esc(String(v||'—'));
  const features=[
    {nivel:1,nome:'Conjuração',descricao:[c.conjuracao?.preparo,c.conjuracao?.foco,c.conjuracao?.slots].filter(Boolean).join(' ')},
    {nivel:1,nome:'Magia de Funileiro',descricao:c.tinkers_magic?.descricao||''},
    {nivel:2,nome:'Replicar Item Mágico',descricao:c.replicate_magic_item?.regras||''},
    ...arr(c.caracteristicas).filter(f=>!([4,8,12,16].includes(Number(f.nivel))&&/ability score improvement/i.test(f.nome||'')))
      .map(f=>({nivel:f.nivel,nome:artNames(f.nome),descricao:f.descricao}))
  ];
  return `<div class="corpo">
    <p>${show(i.descricao)}</p>
    <div class="stats"><div class="stat"><strong>Atributo principal</strong>Inteligência</div>
      <div class="stat"><strong>Dado de Vida</strong>d8</div>
      <div class="stat"><strong>Salvaguardas</strong>Constituição, Inteligência</div>
      <div class="stat"><strong>Subclasses</strong>Alquimista, Armeiro, Artilheiro, Ferreiro de Batalha, Cartógrafo</div>
    </div>
    <section class="bloco"><h3>Proficiências</h3>
      <p><strong>Armas:</strong> Armas simples. <strong>Armaduras:</strong> Armaduras leves, médias e escudos.
      <strong>Perícias:</strong> ${show(d.pericias)}
      <strong>Ferramentas:</strong> ${show(d.ferramentas)}</p></section>
    <section class="bloco"><h3>Progressão — níveis 1–20</h3>
      <div class="tabela-wrap"><table><thead><tr><th>Nível</th><th>BP</th><th>Características</th><th>Planos</th><th>Itens mágicos</th><th>Truques</th><th>Magias preparadas</th></tr></thead>
      <tbody>${levels.map(l=>`<tr><td>${l.nivel}</td><td>${show(l.pb)}</td><td>${show(artNames(l.caracteristicas))}</td><td>${show(l.planos)}</td><td>${show(l.itens_magicos)}</td><td>${show(l.cantrips)}</td><td>${show(l.magias_preparadas)}</td></tr>`).join('')}</tbody></table></div></section>
    <section class="bloco"><h3>Características ativas da classe</h3>
      ${features.map(f=>`<article class="feature"><h4>${show(f.nome)} <span class="muted">— nível ${show(f.nivel)}</span></h4><p>${show(f.descricao)}</p></article>`).join('')}
    </section><div class="biomancia-slot"></div>
    <div class="meta"><span><strong>Livro:</strong> Eberron: Forge of the Artificer (2025)</span>
    <span><strong>Progressão Talento/atributo:</strong> Regra da Casa do Hub</span></div></div>`;
}

function progress(i){const metrics=[...new Set(i.levels.flatMap(l=>Object.keys(l.class_specific||{})))];return`<div class="tabela-wrap"><table><thead><tr><th>Nível</th><th>BP</th><th>Características ativas no Hub</th>${metrics.map(k=>`<th>${esc(t(k.replaceAll('_',' ')))}</th>`).join('')}</tr></thead><tbody>${i.levels.map(l=>{const fs=arr(l.features).filter(f=>activeRef(i.slug,f,l.level)).map(f=>featureLoc(i.slug,f).nome);const house=[];if([1,3,6,9,12,15,18].includes(Number(l.level)))house.push('Talento — Regra da Casa');if([4,8,12,16,20].includes(Number(l.level)))house.push('+1 atributo — Regra da Casa');return`<tr><td>${l.level}</td><td>+${l.prof_bonus}</td><td>${esc([...fs,...house].join(', ')||'—')}</td>${metrics.map(k=>`<td>${esc(l.class_specific?.[k]??'—')}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>`}
function renderClass(i){if(i.slug==='artificer')return renderArtificer(i);const c=i.dados;return`<div class="corpo"><p>${esc(i.descricao)}</p><div class="stats"><div class="stat"><strong>Atributo principal</strong>${esc(primary(c))}</div><div class="stat"><strong>Dado de Vida</strong>d${esc(c.hit_die)}</div><div class="stat"><strong>Salvaguardas</strong>${esc(nomes(c.saving_throws))}</div><div class="stat"><strong>Subclasse SRD</strong>${esc(nomes(c.subclasses)||'—')}</div></div><section class="bloco"><h3>Proficiências</h3><p>${esc(nomes(c.proficiencies)||'—')}</p></section><section class="bloco"><h3>Progressão — níveis 1–20</h3>${progress(i)}</section><section class="bloco"><h3>Características ativas da classe</h3>${i.features.map(f=>`<article class="feature"><h4>${esc(f.nome)} <span class="muted">— nível ${esc(f._nivel)}</span></h4><p>${esc(f.descricao)}</p></article>`).join('')}</section>${['druid','sorcerer','wizard'].includes(i.slug)?'<div class="biomancia-slot"></div>':''}<div class="meta"><span><strong>Regras-base:</strong> 5.5e / 2024</span><span><strong>Progressão Talento/atributo:</strong> Regra da Casa do Hub</span></div></div>`}
function render(){const q=fold(document.getElementById('busca').value.trim()),filter=document.getElementById('filtro').value,items=DATA.filter(i=>(!filter||(filter==='conjurador'?i.caster:!i.caster))&&(!q||fold([i.nome,i.descricao,...i.features.flatMap(f=>[f.nome,f.descricao])].join(' ')).includes(q)));document.getElementById('resultado').textContent=`${items.length} de ${DATA.length} classes`;const l=document.getElementById('lista');l.innerHTML=items.map(i=>`<details class="classe" data-id="${esc(i.slug)}" id="ref-${esc(i.slug==='artificer'?'classes:pdf24merged1:artificer:2025':'classes:srd521:'+i.slug)}"><summary><strong>${esc(i.nome)}</strong><span class="sub">d${esc(i.dados.hit_die)} • ${esc(primary(i.dados))}</span></summary><div class="slot"></div></details>`).join('')||'<div class="vazio">Nenhuma classe corresponde aos filtros.</div>';l.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{if(d.open&&!d.dataset.rendered){d.querySelector('.slot').innerHTML=renderClass(DATA.find(x=>x.slug===d.dataset.id));window.HubBiomancia?.mount(d.querySelector('.biomancia-slot'),{slug:d.dataset.id==='artificer'?'alchemist':d.dataset.id});d.dataset.rendered='1'}}));const ref=new URLSearchParams(location.search).get('ref');if(ref){const el=document.getElementById(`ref-${ref}`);if(el){el.open=true;setTimeout(()=>el.scrollIntoView({block:'start'}),30)}}}
(async()=>{try{const res=await Promise.all([json(`dados/localizacao-ptbr-global.json?v=${V}`),...EXPECTED.map(s=>json(`dados/classes-ptbr/${LOCFILES[s]}.json?v=${V}`)),json(`${RAW}/5e-SRD-Classes.json`),json(`${RAW}/5e-SRD-Levels.json`),json(`${RAW}/5e-SRD-Features.json`),json(`dados/artificer-2025.json?v=${V}`)]);G=res[0];EXPECTED.forEach((s,i)=>LOC[s]=res[1+i]);const classes=res[13],levels=res[14],features=res[15],fmap=new Map(arr(features).map(f=>[f.index,f]));DATA=arr(classes).filter(c=>EXPECTED.includes(c.index)).map(c=>normalize(c,levels,fmap));DATA.push(normalizeArtificer(res[16]));DATA.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{sensitivity:'base'}));render()}catch(e){document.getElementById('resultado').textContent='Falha ao carregar';document.getElementById('lista').innerHTML=`<div class="erro">${esc(e.message)}</div>`}})();document.getElementById('busca').addEventListener('input',render);document.getElementById('filtro').addEventListener('change',render);
</script><script type="module" src="scripts/hub-ux.js?v=20261028-library-hub-layout1"></script>
