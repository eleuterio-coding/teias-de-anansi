<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Armas - Biblioteca - Teias de Anansi</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--b:#8885;--soft:#8881;--warn:#c77b2224}
*{box-sizing:border-box}body{max-width:1320px;margin:auto;padding:22px;line-height:1.5}a{color:inherit}.muted{opacity:.72}.badge{display:inline-block;border:1px solid var(--b);border-radius:999px;padding:3px 8px;font-size:.78rem;margin:2px}.badge.demo{border-style:dashed}.nota{padding:12px 14px;border:1px dashed #8888;border-radius:10px;margin:14px 0}.nota.demo{background:var(--warn)}.layout{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);gap:16px;align-items:start}.painel{border:1px solid var(--b);border-radius:11px;overflow:hidden}.tools{padding:11px;border-bottom:1px solid var(--b);display:grid;gap:8px;position:sticky;top:0;background:Canvas;z-index:3}.tools input,.tools select{font:inherit;padding:9px;border:1px solid #8887;border-radius:8px;background:transparent;color:inherit;width:100%}.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lista{max-height:76vh;overflow:auto}.item{display:block;width:100%;padding:10px 11px;text-align:left;border:0;border-bottom:1px solid #8883;background:transparent;color:inherit;cursor:pointer}.item:hover,.item.on{background:var(--soft)}.item.demo{border-left:4px solid #9998}.item strong,.item small{display:block}.item small{opacity:.65}.detalhe{padding:18px;min-height:540px}.meta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.88rem;opacity:.82}.box{border:1px solid #8884;border-radius:9px;padding:12px 14px;margin:12px 0}.box h3{margin-top:0}.box.demo{border-style:dashed;background:var(--warn)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin:14px 0}.stat{border:1px solid #8884;border-radius:8px;padding:9px}.stat b,.stat span{display:block}.stat span{font-size:1.02rem;margin-top:2px}.count{font-size:.85rem;opacity:.72}.vazio{padding:18px;opacity:.7}.kv{margin:6px 0;padding-left:18px}.warning{font-weight:650}@media(max-width:860px){body{padding:14px}.layout{grid-template-columns:1fr}.lista{max-height:380px}.filtros{grid-template-columns:1fr}}
</style>
</head>
<body>
<p><a href="bibliotecas.html?v=20260819-1300">← Bibliotecas</a></p>
<header><h1>Armas</h1></header>
<div id="status" hidden></div>
<div class="layout">
<aside class="painel"><div class="tools">
<input id="q" type="search" placeholder="Buscar arma, dano, propriedade, maestria ou fonte...">
<div class="filtros"><select id="ruleset"><option value="">Todos os rulesets</option></select><select id="categoria"><option value="">Todas as categorias</option></select></div>
<div class="filtros"><select id="natureza"><option value="">Todas as naturezas</option></select><select id="fonte"><option value="">Todas as fontes</option></select></div>
<div class="filtros"><select id="maestria"><option value="">Todas as maestrias</option></select><select id="statusf"><option value="">Todos os status</option></select></div>
<div id="count" class="count"></div></div><div id="lista" class="lista"></div></aside>
<section id="detalhe" class="painel detalhe"><div class="vazio">Selecione uma arma para abrir os detalhes.</div></section>
</div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let CORE=null,PDFMAN=null,ALL=[],CURRENT='',MASTERY={},DEMO_MASTERY={},SOURCES={},SOURCE_RULES={};
function natureOf(x){if(x.natureza)return x.natureza;if(String(x.fonte||'').startsWith('srd-'))return 'oficial SRD';return 'oficial'}
function sourceOf(x){return SOURCES[x.fonte]||{}}
function sourceTitle(x){const f=sourceOf(x);return f.titulo||x.fonte||'Fonte não identificada'}
function sourceFile(x){const f=sourceOf(x);return f.arquivo_pdf||'SRD'}
function isDemo(x){return natureOf(x)==='demonstrativo'}
function labelNature(x){const n=natureOf(x);return n==='demonstrativo'?'Demonstrativo · não canonizar':n==='suplementar'?'Suplementar':n==='oficial SRD'?'Oficial · SRD':'Oficial'}
function fieldList(v){return Array.isArray(v)&&v.length?v.join(', '):'—'}
function relatedRules(x){const rules=SOURCE_RULES[x.fonte]||{},props=x.propriedades||[];return Object.entries(rules).filter(([k])=>props.some(p=>norm(p).startsWith(norm(k)))||((norm(k)==='municao')&&props.some(p=>norm(p).startsWith('ammunition'))))}
function masteryText(x){if(!x.maestria)return '';const demo=DEMO_MASTERY[x.maestria],std=MASTERY[x.maestria],txt=isDemo(x)&&demo?demo:(std||demo||'Consulte o módulo Maestrias de Arma para a regra disponível.'),tag=isDemo(x)&&demo?'Maestria demonstrativa — Xyleff':'Maestria de Arma';return `<div class="box ${isDemo(x)&&demo?'demo':''}"><h3>${esc(tag)} — ${esc(x.maestria)}</h3><p>${esc(txt)}</p>${std?'<p><a href="maestrias-de-arma.html?v=20260819-1224">Abrir módulo Maestrias de Arma →</a></p>':''}</div>`}
function variantsBox(x){const rows=Object.entries(x.variantes_custo||{});if(!rows.length)return '';return `<div class="box"><h3>Variações de capacidade e custo</h3><ul class="kv">${rows.map(([k,v])=>`<li><strong>${esc(k)}:</strong> ${esc(v)}</li>`).join('')}</ul></div>`}
function rulesBox(x){const rows=relatedRules(x);if(!rows.length)return '';return `<div class="box"><h3>Propriedades especiais desta fonte</h3>${rows.map(([k,v])=>`<p><strong>${esc(k)}.</strong> ${esc(v)}</p>`).join('')}</div>`}
function renderDetail(id){CURRENT=id;renderList();const x=ALL.find(i=>i.id===id);if(!x)return;const f=sourceOf(x),props=fieldList(x.propriedades),demo=isDemo(x),noDie=demo&&!/\d+d\d+/i.test(String(x.dano||''))&&/^(bludgeoning|piercing|slashing)$/i.test(String(x.dano||'')),desc=x.descricao||(`No ${sourceTitle(x)}, esta arma não possui descrição narrativa individual separada; o registro mecânico completo disponível é o bloco da tabela exibido acima.`);document.getElementById('detalhe').innerHTML=`<h2>${esc(x.nome)} ${x.nome_original&&x.nome_original!==x.nome?`<span class="muted">(${esc(x.nome_original)})</span>`:''}</h2><div class="meta"><span class="badge">${esc(x.categoria)}</span><span class="badge">${esc(x.ruleset||f.ruleset)}</span><span class="badge ${demo?'demo':''}">${esc(labelNature(x))}</span><span class="badge">${esc(x.status||'publicado')}</span></div>${demo?'<div class="box demo warning">Status editorial: material demonstrativo. NÃO CANONIZAR.</div>':''}<div class="stats"><div class="stat"><b>Dano</b><span>${esc(x.dano)}</span></div><div class="stat"><b>Propriedades</b><span>${esc(props)}</span></div><div class="stat"><b>Maestria</b><span>${esc(x.maestria||'—')}</span></div><div class="stat"><b>Peso</b><span>${esc(x.peso)}</span></div><div class="stat"><b>Custo</b><span>${esc(x.custo)}</span></div></div>${noDie?'<div class="nota demo"><strong>Nota de fidelidade:</strong> nesta linha demonstrativa, o PDF fornece apenas o tipo de dano; nenhum dado foi inferido.</div>':''}<div class="box"><h3>Descrição</h3><p>${esc(desc)}</p></div>${rulesBox(x)}${masteryText(x)}${variantsBox(x)}<div class="meta"><span><b>Fonte:</b> ${esc(sourceTitle(x))}</span><span><b>Arquivo:</b> ${esc(sourceFile(x))}</span><span><b>Seção:</b> ${esc(f.secao||'—')}</span><span><b>Ruleset:</b> ${esc(x.ruleset||f.ruleset||'—')}</span><span><b>Natureza:</b> ${esc(labelNature(x))}</span></div>`}
function renderList(){const q=norm(document.getElementById('q').value),rs=document.getElementById('ruleset').value,cat=document.getElementById('categoria').value,nat=document.getElementById('natureza').value,src=document.getElementById('fonte').value,m=document.getElementById('maestria').value,st=document.getElementById('statusf').value;const rows=ALL.filter(x=>(!rs||x.ruleset===rs)&&(!cat||x.categoria===cat)&&(!nat||natureOf(x)===nat)&&(!src||x.fonte===src)&&(!m||x.maestria===m)&&(!st||x.status===st)&&(!q||norm([x.nome,x.nome_original,x.categoria,x.dano,fieldList(x.propriedades),x.maestria,x.custo,x.peso,x.descricao,sourceTitle(x),labelNature(x)].join(' ')).includes(q)));document.getElementById('count').textContent=`${rows.length} de ${ALL.length} registros`;document.getElementById('lista').innerHTML=rows.map(x=>`<button class="item ${CURRENT===x.id?'on':''} ${isDemo(x)?'demo':''}" data-id="${esc(x.id)}"><strong>${esc(x.nome)}</strong><small>${esc(sourceTitle(x))} · ${esc(x.ruleset)} · ${esc(x.dano)}${isDemo(x)?' · NÃO CANONIZAR':''}</small></button>`).join('')||'<div class="vazio">Nenhuma arma encontrada.</div>';document.querySelectorAll('.item').forEach(b=>b.onclick=()=>renderDetail(b.dataset.id))}
function populate(id,values,labelFn=v=>v){const el=document.getElementById(id),base=el.options[0].outerHTML;el.innerHTML=base+values.map(v=>`<option value="${esc(v)}">${esc(labelFn(v))}</option>`).join('')}
(async()=>{try{const [cr,pmr,mr]=await Promise.all([fetch('dados/armas-srd.json?v=20260819-1300',{cache:'no-store'}),fetch('dados/armas-pdfs-manifest.json?v=20260819-1300',{cache:'no-store'}),fetch('dados/maestrias-de-arma-pdfs.json?v=20260819-1224',{cache:'no-store'})]);if(!cr.ok||!pmr.ok)throw new Error(`Falha nas bases principais (${cr.status}/${pmr.status})`);CORE=await cr.json();PDFMAN=await pmr.json();const descriptors=PDFMAN.arquivos||[],responses=await Promise.all(descriptors.map(d=>fetch(d.arquivo+'?v=20260819-1300',{cache:'no-store'})));responses.forEach((r,i)=>{if(!r.ok)throw new Error(`HTTP ${r.status}: ${descriptors[i].arquivo}`)});const datasets=await Promise.all(responses.map(r=>r.json())),pdfItems=[];datasets.forEach((d,i)=>{const sid=descriptors[i].fonte;SOURCE_RULES[sid]={...(SOURCE_RULES[sid]||{}),...(d.regras_compartilhadas||{})};DEMO_MASTERY={...DEMO_MASTERY,...(d.maestrias_demonstrativas||{})};(d.itens||[]).forEach(x=>pdfItems.push(x))});SOURCES={...(CORE.fontes||{}),...(PDFMAN.fontes||{})};if(mr.ok){const md=await mr.json();(md.itens||[]).forEach(x=>MASTERY[x.nome]=x.conteudo?.descricao||'')};ALL=[...(CORE.itens||[]),...pdfItems];if((CORE.itens||[]).length!==39)throw new Error(`base SRD incompleta: ${(CORE.itens||[]).length}/39`);if(pdfItems.length!==107)throw new Error(`extração PDF incompleta: ${pdfItems.length}/107`);if(ALL.length!==146)throw new Error(`catálogo incompleto: ${ALL.length}/146`);populate('ruleset',[...new Set(ALL.map(x=>x.ruleset).filter(Boolean))]);populate('categoria',[...new Set(ALL.map(x=>x.categoria).filter(Boolean))].sort());populate('natureza',[...new Set(ALL.map(natureOf))].sort(),v=>v==='demonstrativo'?'Demonstrativo · não canonizar':v);populate('fonte',[...new Set(ALL.map(x=>x.fonte).filter(Boolean))].sort((a,b)=>String(SOURCES[a]?.titulo||a).localeCompare(String(SOURCES[b]?.titulo||b))),v=>SOURCES[v]?.titulo||v);populate('maestria',[...new Set(ALL.map(x=>x.maestria).filter(Boolean))].sort());populate('statusf',[...new Set(ALL.map(x=>x.status).filter(Boolean))].sort());renderList();if(ALL[0])renderDetail(ALL[0].id)}catch(e){const status=document.getElementById('status');status.hidden=false;status.className='nota';status.innerHTML=`<strong>Falha ao carregar:</strong> ${esc(e.message)}`}})();['q','ruleset','categoria','natureza','fonte','maestria','statusf'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',renderList));
</script>
</body></html>
