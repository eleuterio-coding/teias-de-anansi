<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Armas - Biblioteca - Teias de Anansi</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--b:#8885;--soft:#8881;--warn:#c77b2224}
*{box-sizing:border-box}body{max-width:1320px;margin:auto;padding:22px;line-height:1.5}a{color:inherit}.muted{opacity:.72}.badge{display:inline-block;border:1px solid var(--b);border-radius:999px;padding:3px 8px;font-size:.78rem;margin:2px}.badge.demo{border-style:dashed}.nota{padding:12px 14px;border:1px dashed #8888;border-radius:10px;margin:14px 0}.nota.demo{background:var(--warn)}.layout{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);gap:16px;align-items:start}.painel{border:1px solid var(--b);border-radius:11px;overflow:hidden}.tools{padding:11px;border-bottom:1px solid var(--b);display:grid;gap:8px;position:sticky;top:0;background:Canvas;z-index:3}.tools input,.tools select{font:inherit;padding:9px;border:1px solid #8887;border-radius:8px;background:transparent;color:inherit;width:100%}.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lista{max-height:76vh;overflow:auto}.item{display:block;width:100%;padding:10px 11px;text-align:left;border:0;border-bottom:1px solid #8883;background:transparent;color:inherit;cursor:pointer}.item:hover,.item.on{background:var(--soft)}.item.demo{border-left:4px solid #9998}.item strong,.item small{display:block}.item small{opacity:.65}.detalhe{padding:18px;min-height:540px}.meta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.88rem;opacity:.82}.box{border:1px solid #8884;border-radius:9px;padding:12px 14px;margin:12px 0}.box h3{margin-top:0}.box.demo{border-style:dashed;background:var(--warn)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin:14px 0}.stat{border:1px solid #8884;border-radius:8px;padding:9px}.stat b,.stat span{display:block}.stat span{font-size:1.02rem;margin-top:2px}.count{font-size:.85rem;opacity:.72}.vazio{padding:18px;opacity:.7}.kv{margin:6px 0;padding-left:18px}.warning{font-weight:650}@media(max-width:860px){body{padding:14px}.layout{grid-template-columns:1fr}.lista{max-height:380px}.filtros{grid-template-columns:1fr}}
.weapon-property-row{padding:10px 0;border-top:1px solid #8885;scroll-margin-top:100px}.weapon-property-row h4{margin:0 0 6px}.weapon-property-row p{margin:0}.weapon-source{margin-top:18px;border-top:1px solid #8885;padding-top:10px}.hub-verbete{color:inherit;text-decoration:underline;text-decoration-style:dotted}#maestria-da-arma{scroll-margin-top:100px}</style>
  <link rel="stylesheet" href="biblioteca-light.css?v=20261028-hub-layout1">
<script src="scripts/biblioteca-padroes.js?v=20261103-1"></script></head>
<body>
<p><a href="bibliotecas.html?v=20261028-library-hub-layout1">← Bibliotecas</a></p>
<header><h1>Armas</h1><p><a href="regras.html?original=Propriedade%20de%20Arma%3A%20Acuidade">Consultar propriedades de arma nas Regras</a></p></header>
<div id="status" hidden></div>
<div class="layout">
<aside class="painel"><div class="tools">
<input id="q" type="search" placeholder="Buscar arma, dano, propriedade, maestria ou fonte...">
<div class="filtros"><select id="ruleset"><option value="">Todos os rulesets</option></select><select id="categoria"><option value="">Todas as categorias</option></select></div>
<div class="filtros"><select id="natureza"><option value="">Todas as naturezas</option></select><select id="fonte"><option value="">Todas as fontes</option></select></div>
<div class="filtros"><select id="maestria"><option value="">Todas as maestrias</option></select><select id="statusf"><option value="">Todos os status</option></select></div>
<div id="count" class="count"></div></div><div id="lista" class="lista"></div></aside>
<section id="detalhe" class="painel detalhe"><div class="vazio">Selecione uma arma para abrir os detalhes.</div></section>
</div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let CORE=null,PDFMAN=null,ALL=[],CURRENT='',MASTERY={},DEMO_MASTERY={},SOURCES={},SOURCE_RULES={},PROPERTIES={};
function natureOf(x){if(x.natureza)return x.natureza;if(String(x.fonte||'').startsWith('srd-'))return 'oficial SRD';return 'oficial'}
function sourceOf(x){return SOURCES[x.fonte]||{}}
function sourceTitle(x){const f=sourceOf(x),title=f.titulo||x.fonte||'Fonte não identificada';return HubBiblioteca.livro(title)}
function sourceFile(x){const f=sourceOf(x);return f.arquivo_pdf||'Dados do catálogo'}
function isDemo(x){return natureOf(x)==='demonstrativo'}
function labelNature(x){const n=natureOf(x);return n==='demonstrativo'?'Demonstrativo · não canonizar':n==='suplementar'?'Suplementar':n==='oficial SRD'?'Oficial · SRD':'Oficial'}
function fieldList(v){return Array.isArray(v)&&v.length?v.join(', '):'—'}
function relatedRules(x){const rules=SOURCE_RULES[x.fonte]||{},props=x.propriedades||[];return Object.entries(rules).filter(([k])=>props.some(p=>norm(p).startsWith(norm(k)))||((norm(k)==='municao')&&props.some(p=>norm(p).startsWith('ammunition'))))}
const H=HubBiblioteca;
function tipoDano(x){
 const raw=String(x.dano||'');
 const tipo=/\b(Concussão|Contundente|Bludgeoning|Perfuração|Perfurante|Piercing|Corte|Cortante|Slashing)\b/i.exec(raw);
 if(!tipo)return [raw,'—'];
 const mapa={concussao:'contundente',contundente:'contundente',bludgeoning:'contundente',perfuracao:'perfurante',perfurante:'perfurante',piercing:'perfurante',corte:'cortante',cortante:'cortante',slashing:'cortante'};
 const key=norm(tipo[0]),label=mapa[key]||tipo[0];
 return [raw.slice(0,tipo.index).trim()||'—',label];
}
function propertyBase(prop){return String(prop||'').split(/\s*\(/)[0].trim()}
function propertyId(prop){return 'propriedade-'+norm(propertyBase(prop)).replace(/[^a-z0-9]+/g,'-')}
function propertyBox(x){
 if(!(x.propriedades||[]).length)return'';
 return '<section class="box weapon-property-descriptions"><h3>Propriedades</h3>'
 +(x.propriedades||[]).map(prop=>{
   const base=propertyBase(prop),found=PROPERTIES[base],desc=found?.descricao
     ||(norm(base)==='distancia'?'Indica o alcance normal e o alcance máximo em metros, respectivamente.':'Descrição não disponível no catálogo deste livro.');
   return '<div class="weapon-property-row" id="'+esc(propertyId(prop))+'"><h4>'+H.regra(base,'Propriedade de Arma: '+base)+'</h4><p>'+esc(desc)+'</p></div>';
 }).join('')+'</section>';
}
function masteryText(x){
 if(!x.maestria)return'';
 const txt=MASTERY[x.maestria]||DEMO_MASTERY[x.maestria]||'Descrição não disponível no catálogo.';
 return '<section id="maestria-da-arma" class="box"><h3>'+H.item('Maestria de Arma — '+x.maestria,'maestrias-de-arma.html?item='+encodeURIComponent(x.maestria))+'</h3><p>'+esc(txt)+'</p></section>';
}
function variantsBox(x){
 const rows=Object.entries(x.variantes_custo||{});
 if(!rows.length)return'';
 return '<div class="box"><h3>Variações de capacidade e custo</h3><ul class="kv">'+rows.map(([k,v])=>'<li><strong>'+esc(k)+':</strong> '+H.moedaHtml(v)+'</li>').join('')+'</ul></div>';
}
function rulesBox(){return''}
function renderDetail(id){
 CURRENT=id;renderList();const x=ALL.find(i=>i.id===id);if(!x)return;
 const [dano,tipo]=tipoDano(x);
 const props=(x.propriedades||[]).map(v=>H.item(v,'#'+propertyId(v))).join(', ')||'—';
 const maestria=x.maestria?H.item(x.maestria,'#maestria-da-arma'):'—';
 document.getElementById('detalhe').innerHTML='<h2>'+esc(x.nome)+'</h2><div class="stats">'
   +'<div class="stat"><b>Dano</b><span>'+esc(dano)+' '+H.regra(tipo,({contundente:'Damage Type: Bludgeoning',perfurante:'Damage Type: Piercing',cortante:'Damage Type: Slashing'})[tipo]||'Damage Types')+'</span></div>'
   +'<div class="stat"><b>Propriedades</b><span>'+props+'</span></div>'
   +'<div class="stat"><b>Maestria</b><span>'+maestria+'</span></div>'
   +'<div class="stat"><b>Peso</b><span>'+esc(H.medidas(x.peso))+'</span></div>'
   +'<div class="stat"><b>Custo</b><span>'+H.moedaHtml(x.custo)+'</span></div></div>'
   +propertyBox(x)+masteryText(x)+variantsBox(x)
   +'<footer class="meta weapon-source"><span><b>Livro:</b> '+esc(sourceTitle(x))+'</span></footer>';
}

function renderList(){const q=norm(document.getElementById('q').value),rs=document.getElementById('ruleset').value,cat=document.getElementById('categoria').value,nat=document.getElementById('natureza').value,src=document.getElementById('fonte').value,m=document.getElementById('maestria').value,st=document.getElementById('statusf').value;const rows=ALL.filter(x=>(!rs||x.ruleset===rs)&&(!cat||x.categoria===cat)&&(!nat||natureOf(x)===nat)&&(!src||x.fonte===src)&&(!m||x.maestria===m)&&(!st||x.status===st)&&(!q||norm([x.nome,x.nome_original,x.categoria,x.dano,fieldList(x.propriedades),x.maestria,x.custo,x.peso,x.descricao,sourceTitle(x),labelNature(x)].join(' ')).includes(q)));document.getElementById('count').textContent=`${rows.length} de ${ALL.length} registros`;document.getElementById('lista').innerHTML=rows.map(x=>`<button class="item ${CURRENT===x.id?'on':''} ${isDemo(x)?'demo':''}" data-id="${esc(x.id)}"><strong>${esc(x.nome)}</strong><small>${esc(tipoDano(x)[0])} · ${esc(tipoDano(x)[1])}</small></button>`).join('')||'<div class="vazio">Nenhuma arma encontrada.</div>';document.querySelectorAll('.item').forEach(b=>b.onclick=()=>renderDetail(b.dataset.id))}
function populate(id,values,labelFn=v=>v){const el=document.getElementById(id),base=el.options[0].outerHTML;el.innerHTML=base+values.map(v=>`<option value="${esc(v)}">${esc(labelFn(v))}</option>`).join('')}
(async()=>{try{
 const cr=await fetch('cache/armas-catalogo.json?v=20261101-usuario-armas1',{cache:'default'});
 if(!cr.ok)throw new Error(`Falha no catálogo consolidado (HTTP ${cr.status})`);
 const catalog=await cr.json();
 SOURCES=catalog.fontes||{};
 SOURCE_RULES=catalog.regras_por_fonte||{};
 DEMO_MASTERY=catalog.maestrias_demonstrativas||{};
 ALL=(catalog.itens||[]).filter(x=>!['demonstrativo','nao_canonizar'].includes(norm(x.status))&&!['demonstrativo','nao_canonizar'].includes(norm(x.natureza))&&!norm(x.descricao).includes('nao canonizar'));
 const expected=Number(catalog.controle?.quantidade);if(!Number.isInteger(expected)||expected<=0||ALL.length!==expected)throw new Error(`catálogo incompleto: ${ALL.length}/${Number.isInteger(expected)?expected:'?'}`);
 populate('ruleset',[...new Set(ALL.map(x=>x.ruleset).filter(Boolean))]);
 populate('categoria',[...new Set(ALL.map(x=>x.categoria).filter(Boolean))].sort());
 populate('natureza',[...new Set(ALL.map(natureOf))].sort(),v=>v==='demonstrativo'?'Demonstrativo · não canonizar':v);
 populate('fonte',[...new Set(ALL.map(x=>x.fonte).filter(Boolean))].sort((a,b)=>String(SOURCES[a]?.titulo||a).localeCompare(String(SOURCES[b]?.titulo||b))),v=>HubBiblioteca.livro(SOURCES[v]?.titulo||v));
 populate('maestria',[...new Set(ALL.map(x=>x.maestria).filter(Boolean))].sort());
 populate('statusf',[...new Set(ALL.map(x=>x.status).filter(Boolean))].sort());
 renderList();
 if(ALL[0]){const item=new URLSearchParams(location.search).get('item'),match=ALL.find(x=>norm(x.nome)===norm(item)||norm(x.nome_original)===norm(item));renderDetail((match||ALL[0]).id)}
 fetch('dados/propriedades-armas-2024.json?v=20261103-links1').then(r=>r.json()).then(d=>{PROPERTIES=Object.fromEntries((d.itens||[]).map(x=>[x.nome,x]));if(CURRENT)renderDetail(CURRENT)}).catch(()=>{});
 fetch('dados/maestrias-de-arma-pdfs.json?v=20261101-usuario-maestrias1',{cache:'default'})
  .then(r=>r.ok?r.json():null)
  .then(md=>{if(!md)return;(md.itens||[]).forEach(x=>MASTERY[x.nome]=x.conteudo?.descricao||'');if(CURRENT)renderDetail(CURRENT)})
  .catch(()=>{});
}catch(e){const status=document.getElementById('status');status.hidden=false;status.className='nota';status.innerHTML=`<strong>Falha ao carregar:</strong> ${esc(e.message)}`}})();['q','ruleset','categoria','natureza','fonte','maestria','statusf'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',renderList));
</script>
<script type="module" src="scripts/hub-ux.js?v=20261028-library-hub-layout1"></script>
</body></html>
