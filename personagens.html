    .modulos a:hover { background: #f5f5f5; }
    .nome::before { content: counter(modulo) ". "; }
    .principal{border-color:#111!important}.principal .nome{font-weight:750}
    @media (max-width: 600px) { body { padding: 16px; }.modulos a{align-items:flex-start;flex-direction:column;gap:4px} }
