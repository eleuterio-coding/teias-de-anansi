<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca - Teias de Anansi</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { max-width: 1050px; margin: 0 auto; padding: 24px; line-height: 1.55; }
    a { color: inherit; }
    .resumo, .meta { opacity: .78; }
    .modulos { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
    .modulos li, .regra { border: 1px solid #8885; border-radius: 10px; overflow: hidden; }
    .modulos a { display: flex; justify-content: space-between; gap: 14px; padding: 12px 14px; text-decoration: none; }
    .modulos a:hover, .regra summary:hover { background: #8881; }
    .contagem { opacity: .65; white-space: nowrap; }
    .vazio { padding: 16px; border: 1px dashed #8888; border-radius: 10px; margin: 18px 0; }
    .controles { display: grid; grid-template-columns: minmax(220px,1fr) minmax(220px,320px); gap: 10px; margin: 18px 0 10px; }
    input, select { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border: 1px solid #8887; border-radius: 8px; background: transparent; color: inherit; }
    .resultado { margin: 8px 0 16px; opacity: .75; }
    .regra { margin: 10px 0; }
    .regra summary { cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
    .categoria { font-size: .86rem; opacity: .68; white-space: nowrap; }
    .corpo { padding: 0 16px 16px; }
    .meta { border-top: 1px solid #8883; margin-top: 12px; padding-top: 10px; font-size: .9rem; display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .nota { padding: 12px 14px; border: 1px dashed #8888; border-radius: 10px; margin: 14px 0; }
    @media (max-width: 750px) {
      body { padding: 16px; }
      .controles { grid-template-columns: 1fr; }
      .regra summary { display: block; }
      .categoria { display: block; margin-top: 5px; }
    }
  </style>
</head>
<body>
  <p><a href="bibliotecas.html">← Bibliotecas</a></p>
  <header>
    <h1 id="titulo">Biblioteca</h1>
    <p class="resumo" id="resumo"></p>
  </header>
  <main id="app"></main>

<script>
const MODULOS = [
  'Regras','Classes','Subclasses','Espécies','Antecedentes','Talentos',
  'Maestrias de Arma','Monstros','Armaduras','Armas','Equipamentos de Aventura',
  'Ferramentas','Montarias e Veículos','Comércio e Despesas','Bugigangas',
  'Itens Mágicos','Magias','Idiomas'
];

const REGRAS = [{"nome":"Exceções superam regras gerais","categoria":"Fundamentos","descricao":"Quando uma regra específica de classe, talento, magia, item, monstro ou outro elemento contradiz uma regra geral, aplica-se a regra específica.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Arredondamento","categoria":"Fundamentos","descricao":"Quando um cálculo produzir fração, arredonde para baixo, salvo quando uma regra disser explicitamente o contrário.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Seis atributos","categoria":"Fundamentos","descricao":"Força, Destreza, Constituição, Inteligência, Sabedoria e Carisma são os seis atributos usados para representar capacidades físicas e mentais.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Modificador de atributo","categoria":"Fundamentos","descricao":"O modificador de um atributo é derivado de sua pontuação e é usado em testes de d20 associados a esse atributo.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Teste de d20","categoria":"Testes","descricao":"Testes de d20 incluem testes de atributo, salvaguardas e jogadas de ataque. Role 1d20, aplique modificadores relevantes e compare o total ao número-alvo.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Classe de Dificuldade (CD)","categoria":"Testes","descricao":"Em testes de atributo e salvaguardas, o resultado é bem-sucedido quando iguala ou supera a CD definida pela regra ou pelo Mestre.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Classe de Armadura (CA)","categoria":"Testes","descricao":"Uma jogada de ataque acerta quando o total iguala ou supera a Classe de Armadura do alvo.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Teste de atributo","categoria":"Testes","descricao":"Um teste de atributo resolve uma tentativa incerta usando um atributo apropriado; uma perícia ou ferramenta relevante pode permitir adicionar proficiência.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Salvaguarda","categoria":"Testes","descricao":"Uma salvaguarda representa resistir ou evitar um efeito. A regra que provoca a salvaguarda define o atributo usado, a CD e o resultado do sucesso ou fracasso.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Jogada de ataque","categoria":"Testes","descricao":"Ataques com armas corpo a corpo normalmente usam Força; ataques à distância com armas normalmente usam Destreza; ataques mágicos usam o atributo de conjuração indicado.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"20 e 1 naturais em ataques","categoria":"Testes","descricao":"Um 20 natural em uma jogada de ataque acerta independentemente de modificadores ou CA e gera um acerto crítico. Um 1 natural erra.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Vantagem e Desvantagem","categoria":"Testes","descricao":"Com Vantagem, role dois d20 e use o maior; com Desvantagem, use o menor. Múltiplas fontes não se acumulam, e Vantagem e Desvantagem juntas se anulam.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Inspiração Heroica","categoria":"Testes","descricao":"Pode ser gasta logo após rolar um dado para refazê-lo, sendo obrigatório usar o novo resultado. Um personagem não mantém mais de uma Inspiração Heroica por vez.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Bônus de Proficiência","categoria":"Proficiência","descricao":"O Bônus de Proficiência é adicionado quando uma regra permite usar uma proficiência relevante. Ele cresce com o nível do personagem.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Proficiência não se acumula","categoria":"Proficiência","descricao":"O Bônus de Proficiência não é adicionado mais de uma vez ao mesmo valor, salvo regras que expressem multiplicação ou divisão, como Especialização.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Perícias e ferramentas juntas","categoria":"Proficiência","descricao":"Se um teste usa uma ferramenta com a qual você é proficiente e também uma perícia relevante na qual é proficiente, a proficiência da ferramenta permite adicionar o bônus e a combinação pode conceder Vantagem conforme a regra.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Ação","categoria":"Ações","descricao":"Em combate, uma criatura normalmente dispõe de uma Ação no próprio turno, além do movimento. Recursos específicos podem fornecer outras opções.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Ação Bônus","categoria":"Ações","descricao":"Você só pode realizar uma Ação Bônus quando uma regra, magia ou recurso disser que pode. Normalmente só uma Ação Bônus pode ser usada no turno.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Reação","categoria":"Ações","descricao":"Uma Reação é uma resposta a um gatilho. Depois de usar sua Reação, você não pode usar outra até o início do seu próximo turno, salvo regra em contrário.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Atacar","categoria":"Ações","descricao":"A Ação Atacar permite fazer um ataque com arma ou um Ataque Desarmado; recursos como Ataque Extra podem permitir múltiplos ataques nessa mesma ação.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Disparada","categoria":"Ações","descricao":"A Ação Disparada concede movimento adicional no turno igual à sua Velocidade, após aplicar modificadores relevantes à Velocidade.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Desengajar","categoria":"Ações","descricao":"Até o fim do turno, seu movimento não provoca Ataques de Oportunidade.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Esquivar","categoria":"Ações","descricao":"Até o início do próximo turno, ataques contra você têm Desvantagem e suas salvaguardas de Destreza têm Vantagem; o benefício cessa se você estiver Incapacitado ou com Velocidade 0.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Ajudar","categoria":"Ações","descricao":"A Ação Ajudar pode auxiliar uma criatura em um teste de atributo ou ataque conforme os requisitos da regra, e também pode ser usada para prestar primeiros socorros.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Esconder-se","categoria":"Ações","descricao":"Para se esconder, faça um teste de Destreza (Furtividade) CD 15 quando estiver fortemente obscurecido ou protegido por cobertura suficiente e fora da linha de visão dos inimigos.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Influenciar","categoria":"Ações","descricao":"A Ação Influenciar usa testes sociais apropriados para tentar alterar a atitude ou comportamento de uma criatura, sujeito à postura e decisão do Mestre.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Magia","categoria":"Ações","descricao":"A Ação Magia é usada para conjurar uma magia com tempo de conjuração de uma ação ou ativar certos recursos e itens mágicos.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Preparar","categoria":"Ações","descricao":"A Ação Preparar define um gatilho perceptível e uma resposta. Quando o gatilho ocorre antes do início do seu próximo turno, você pode usar sua Reação para executar a resposta.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Procurar","categoria":"Ações","descricao":"A Ação Procurar usa uma perícia de Sabedoria apropriada, como Percepção, Intuição, Medicina ou Sobrevivência, conforme o que está sendo procurado.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Estudar","categoria":"Ações","descricao":"A Ação Estudar usa uma perícia de Inteligência apropriada, como Arcanismo, História, Investigação, Natureza ou Religião, para recordar ou deduzir informações.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Utilizar","categoria":"Ações","descricao":"A Ação Utilizar serve para usar um objeto não mágico quando a interação exigida não é gratuita ou quando a própria regra do objeto exige essa ação.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Iniciativa","categoria":"Combate","descricao":"No início do combate, cada participante faz um teste de Destreza para determinar a ordem dos turnos.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Surpresa","categoria":"Combate","descricao":"Uma criatura surpreendida no início do combate faz sua rolagem de Iniciativa com Desvantagem; surpresa não cria um turno especial separado.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Turno de combate","categoria":"Combate","descricao":"No próprio turno, uma criatura pode se mover até sua Velocidade e realizar uma Ação, em qualquer ordem, além de Ação Bônus ou outras opções quando disponíveis.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Interação gratuita com objeto","categoria":"Combate","descricao":"Durante o turno, você pode interagir com um objeto ou elemento do ambiente uma vez gratuitamente durante o movimento ou a ação; interações adicionais normalmente exigem Utilizar.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Movimento fracionado","categoria":"Movimento","descricao":"Você pode dividir seu movimento antes, entre e depois de ações, Ações Bônus, Reações ou ataques realizados no mesmo turno.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Terreno difícil","categoria":"Movimento","descricao":"Cada pé de movimento em terreno difícil custa 1 pé adicional, salvo regra específica.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Mover-se por espaços ocupados","categoria":"Movimento","descricao":"É possível atravessar espaços de certos aliados, criaturas incapacitadas ou criaturas muito maiores ou menores; espaços ocupados podem contar como terreno difícil e normalmente não se pode terminar voluntariamente no espaço de outra criatura.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Ataque de Oportunidade","categoria":"Combate","descricao":"Quando uma criatura que você vê sai do seu alcance usando movimento, ação, Ação Bônus, Reação ou uma de suas velocidades, você pode gastar sua Reação para fazer um ataque corpo a corpo antes de ela sair do alcance.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Cobertura","categoria":"Combate","descricao":"Meia cobertura concede +2 à CA e salvaguardas de Destreza; três quartos concedem +5; cobertura total impede que o alvo seja escolhido diretamente por efeitos que exigem linha direta.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Ataque Desarmado","categoria":"Combate","descricao":"Um Ataque Desarmado pode ser usado para causar dano, agarrar ou empurrar um alvo dentro do alcance apropriado, seguindo as opções e testes definidos pela regra.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Agarrar","categoria":"Combate","descricao":"Agarrar normalmente é iniciado por um Ataque Desarmado. Em caso de sucesso, o alvo recebe a condição Agarrado, que limita seu deslocamento e permite efeitos associados.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Empurrar","categoria":"Combate","descricao":"Empurrar por Ataque Desarmado pode afastar o alvo ou derrubá-lo, se os requisitos da opção forem atendidos.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Pontos de Vida","categoria":"Dano e Cura","descricao":"Dano reduz Pontos de Vida atuais, que não podem cair abaixo de 0. Perder PV não impõe penalidade geral até chegar a 0 PV.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Sangrando (Bloodied)","categoria":"Dano e Cura","descricao":"Uma criatura está Bloodied quando está com metade ou menos de seus Pontos de Vida máximos; por si só, esse estado não produz efeito, mas pode servir de gatilho para outras regras.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Rolagem de dano","categoria":"Dano e Cura","descricao":"Role os dados de dano indicados e aplique modificadores pertinentes. Ataques com arma normalmente adicionam ao dano o mesmo modificador de atributo usado no ataque.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Acerto crítico","categoria":"Dano e Cura","descricao":"Em um acerto crítico, role duas vezes todos os dados de dano do ataque e depois aplique os modificadores normais uma única vez.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Resistência e Vulnerabilidade","categoria":"Dano e Cura","descricao":"Resistência reduz pela metade o dano do tipo relevante; Vulnerabilidade dobra esse dano. Arredonde para baixo quando necessário.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"0 Pontos de Vida","categoria":"Dano e Cura","descricao":"Ao chegar a 0 PV sem morrer instantaneamente, a criatura fica Inconsciente e passa a realizar Salvaguardas contra a Morte até recuperar PV, estabilizar ou morrer.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Salvaguarda contra a Morte","categoria":"Dano e Cura","descricao":"No início do turno com 0 PV, role 1d20: 10 ou mais é sucesso. Três sucessos estabilizam; três falhas matam. Um 1 natural conta como duas falhas; um 20 natural recupera 1 PV.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Dano com 0 PV","categoria":"Dano e Cura","descricao":"Sofrer dano com 0 PV causa uma falha em Salvaguarda contra a Morte; dano de acerto crítico causa duas. Se o dano recebido igualar ou exceder o máximo de PV, a criatura morre.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Estabilizar","categoria":"Dano e Cura","descricao":"Uma criatura com 0 PV pode ser estabilizada com a Ação Ajudar e um teste de Sabedoria (Medicina) CD 10. Uma criatura estável não faz Salvaguardas contra a Morte enquanto permanecer estável.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Pontos de Vida Temporários","categoria":"Dano e Cura","descricao":"PV temporários absorvem dano antes dos PV normais, não se acumulam entre si e não são cura. Recebê-los com 0 PV não faz a criatura recuperar a consciência.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Descanso Curto","categoria":"Descanso","descricao":"Um Descanso Curto dura 1 hora de atividade leve. Ao terminá-lo, a criatura pode gastar Dados de Vida para recuperar PV e recarrega recursos que explicitamente se recuperam nesse descanso.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Descanso Longo","categoria":"Descanso","descricao":"Um Descanso Longo dura pelo menos 8 horas, incluindo ao menos 6 horas de sono. Ao concluí-lo, a criatura recupera todos os PV e Dados de Vida gastos, restaura reduções de atributos e reduz a Exaustão em 1 nível, além de recarregar recursos pertinentes.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Concentração","categoria":"Magia","descricao":"Você só pode manter um efeito de Concentração por vez. Conjurar ou ativar outro efeito que exija Concentração encerra o anterior.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Concentração ao sofrer dano","categoria":"Magia","descricao":"Ao sofrer dano enquanto mantém Concentração, faça uma salvaguarda de Constituição. A CD é 10 ou metade do dano recebido, o que for maior, com máximo de CD 30.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Componentes de magia","categoria":"Magia","descricao":"Magias podem exigir componentes Verbais, Somáticos e/ou Materiais. O conjurador precisa satisfazer os componentes exigidos para concluir a conjuração.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Alcance e alvo de magia","categoria":"Magia","descricao":"Uma magia só pode afetar alvos e pontos dentro do alcance descrito e deve respeitar requisitos de linha, percepção e cobertura definidos pela própria magia e pelas regras gerais.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Áreas de efeito","categoria":"Magia","descricao":"Cones, cubos, cilindros, emanações, linhas e esferas determinam quais espaços são afetados; cada formato segue seu ponto de origem e dimensões próprias.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Condições","categoria":"Condições","descricao":"Condições são estados temporários definidos pelas regras. A mesma condição normalmente não se acumula consigo mesma; Exaustão é a exceção cumulativa.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Exaustão","categoria":"Condições","descricao":"A Exaustão possui níveis cumulativos. Cada nível reduz testes de d20 em 2 e a Velocidade em 5 pés; no nível 6, a criatura morre. Um Descanso Longo reduz a Exaustão em 1 nível.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Queda","categoria":"Exploração","descricao":"Ao cair, a criatura sofre 1d6 de dano de concussão por 10 pés de queda, até 20d6, e fica Caída ao aterrissar se tiver sofrido dano.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"},{"nome":"Sufocamento","categoria":"Exploração","descricao":"Quando uma criatura fica sem ar, seguem-se os limites e consequências definidos pela regra de sufocamento; efeitos que impeçam respirar podem levar rapidamente a 0 PV.","livro":"D&D Beyond Basic Rules (2024)","edicao":"D&D 2024 / 5.5e"}];
const CONTAGENS = Object.fromEntries(MODULOS.map(m => [m, m === 'Regras' ? REGRAS.length : 0]));
CONTAGENS.Subclasses = 129;

const params = new URLSearchParams(location.search);
const modulo = params.get('modulo');
const titulo = document.getElementById('titulo');
const resumo = document.getElementById('resumo');
const app = document.getElementById('app');

const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const semAcento = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR');

function linkModulo(nome) {
  if (nome === 'Subclasses') return 'subclasses.html';
  return `biblioteca.html?modulo=${encodeURIComponent(nome)}`;
}

function renderRegras() {
  titulo.textContent = 'Regras';
  document.title = 'Regras - Biblioteca - Teias de Anansi';
  resumo.textContent = `${REGRAS.length} regras principais de D&D 2024 / 5.5e.`;
  const categorias = [...new Set(REGRAS.map(r => r.categoria))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  app.innerHTML = `
    <div class="nota"><strong>Escopo:</strong> catálogo resumido das regras centrais da revisão de 2024. Em conflito com regras equivalentes de 2014, prevalece a versão 2024.</div>
    <div class="controles">
      <input id="busca" type="search" placeholder="Buscar regra...">
      <select id="categoria">
        <option value="">Todas as categorias</option>
        ${categorias.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
      </select>
    </div>
    <p class="resultado" id="resultado"></p>
    <section id="lista"></section>`;

  const busca = document.getElementById('busca');
  const categoria = document.getElementById('categoria');
  const resultado = document.getElementById('resultado');
  const lista = document.getElementById('lista');

  function render() {
    const termo = semAcento(busca.value.trim());
    const filtradas = REGRAS.filter(r =>
      (!termo || semAcento(`${r.nome} ${r.categoria} ${r.descricao}`).includes(termo)) &&
      (!categoria.value || r.categoria === categoria.value)
    );
    resultado.textContent = `${filtradas.length} de ${REGRAS.length} regras`;
    lista.innerHTML = filtradas.length ? filtradas.map(r => `
      <details class="regra">
        <summary><strong>${esc(r.nome)}</strong><span class="categoria">${esc(r.categoria)}</span></summary>
        <div class="corpo">
          <p>${esc(r.descricao)}</p>
          <div class="meta">
            <span><strong>Tipo:</strong> Regras</span>
            <span><strong>Livro:</strong> ${esc(r.livro)}</span>
            <span><strong>Edição:</strong> ${esc(r.edicao)}</span>
          </div>
        </div>
      </details>`).join('') : '<div class="vazio">Nenhuma regra corresponde aos filtros atuais.</div>';
  }

  busca.addEventListener('input', render);
  categoria.addEventListener('change', render);
  render();
}

if (modulo && MODULOS.includes(modulo)) {
  if (modulo === 'Regras') {
    renderRegras();
  } else {
    titulo.textContent = modulo;
    document.title = `${modulo} - Biblioteca - Teias de Anansi`;
    resumo.textContent = '0 itens publicados neste módulo.';
    app.innerHTML = '<div class="vazio">Nenhum conteúdo publicado neste módulo.</div>';
  }
} else {
  titulo.textContent = 'Biblioteca';
  resumo.textContent = 'Selecione um módulo.';
  app.innerHTML = `<ul class="modulos">${MODULOS.map(nome => `<li><a href="${linkModulo(nome)}"><span>${esc(nome)}</span><span class="contagem">${CONTAGENS[nome]} itens</span></a></li>`).join('')}</ul>`;
}
</script>
</body>
</html>
