<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Biblioteca - Teias de Anansi</title>
  <style>
    :root { color-scheme: light; }
    html, body { background: #ffffff; color: #000000; }
    a, a:visited, a:hover, a:active { color: #000000; }
  </style>
</head>
<body>
  <p>Redirecionando para o módulo…</p>
  <script>
    const params = new URLSearchParams(location.search);
    const modulo = params.get('modulo');
    const v = '20260819-1900';
    const destinos = {
      'Regras': `regras.html?v=${v}`,
      'Classes': `classes.html?v=${v}`,
      'Subclasses': `subclasses.html?v=${v}`,
      'Espécies': `especies.html?v=${v}`,
      'Antecedentes': `antecedentes.html?v=${v}`,
      'Talentos': `talentos.html?v=${v}`,
      'Maestrias de Arma': `maestrias-de-arma.html?v=${v}`,
      'Monstros': `monstros.html?v=${v}`,
      'Armaduras': `armaduras.html?v=${v}`,
      'Armas': `armas.html?v=${v}`,
      'Equipamentos de Aventura': `equipamentos-aventura.html?v=${v}`,
      'Ferramentas': `ferramentas.html?v=${v}`,
      'Montarias e Veículos': `montarias-veiculos.html?v=${v}`,
      'Comércio e Despesas': `comercio-e-despesas.html?v=${v}`,
      'Bugigangas': `bugigangas.html?v=${v}`,
      'Itens Mágicos': `itens-magicos.html?v=${v}`,
      'Magias': `magias.html?v=${v}`,
      'Idiomas': `idiomas.html?v=${v}`
    };

    if (modulo && destinos[modulo]) {
      location.replace(destinos[modulo]);
    } else if (modulo) {
      location.replace('biblioteca-legado.html' + location.search + location.hash);
    } else {
      location.replace(`bibliotecas.html?v=${v}`);
    }
  </script>
  <noscript><a href="bibliotecas.html?v=20260819-1900">Abrir Bibliotecas</a></noscript>
</body>
</html>
