<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca - Teias de Anansi</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { max-width: 1050px; margin: 0 auto; padding: 24px; line-height: 1.55; }
    a { color: inherit; }
    .resumo, .fonte { opacity: .78; }
    .modulos { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
    .modulos li, .item { border: 1px solid #8885; border-radius: 10px; overflow: hidden; }
    .modulos a { display: flex; justify-content: space-between; gap: 14px; padding: 12px 14px; text-decoration: none; }
    .modulos a:hover, .item summary:hover { background: #8881; }
    .contagem { opacity: .65; white-space: nowrap; }
    .zero { opacity: .58; }
    .voltar { margin-bottom: 18px; }
    .controles { display: grid; grid-template-columns: minmax(220px,1fr) minmax(170px,240px) minmax(170px,240px); gap: 10px; margin: 18px 0 8px; }
    input, select { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border: 1px solid #8887; border-radius: 8px; background: transparent; color: inherit; }
    .resultado { margin: 8px 0 16px; opacity: .75; }
    .item { margin: 10px 0; }
    .item summary { cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
    .subtipo { font-size: .85rem; opacity: .68; white-space: nowrap; }
    .corpo { padding: 0 16px 16px; }
    .metadados { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .9rem; opacity: .78; border-top: 1px solid #8883; margin-top: 14px; padding-top: 10px; }
    .bloco { margin-top: 12px; }
    .bloco h3 { font-size: 1rem; margin: 0 0 6px; }
    .bloco ul { margin: 0; padding-left: 22px; }
    .aviso, .erro, .vazio { padding: 14px; border: 1px dashed #8888; border-radius: 10px; margin: 14px 0; }
    @media (max-width: 750px) {
      body { padding: 16px; }
      .controles { grid-template-columns: 1fr; }
      .item summary { display: block; }
      .subtipo { display: block; margin-top: 5px; }
    }
  </style>
</head>

function esc(v) {
  return String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
}
function semAcento(v) { return String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function pagina(item) {
  const p = item.p || [];
  if (!p[0]) return '';
  return p[0] === p[1] || !p[1] ? `p. ${p[0]}` : `pp. ${p[0]}–${p[1]}`;
}
function repetir(rep) {
  if (!rep) return '';
  if (!rep.repetivel) return 'Não';
  if (rep.maximo) return `Sim, até ${rep.maximo} vezes`;
  return rep.restricao ? `Sim — ${rep.restricao}` : 'Sim';
}
async function gunzip(bytes) {
  if (!('DecompressionStream' in window)) throw new Error('Seu navegador não oferece suporte à descompactação gzip necessária.');
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
async function carregarPhb() {
  const r = await fetch(PHB_GZIP, { cache:'no-store' });
  if (!r.ok) throw new Error(`Falha ao carregar ${PHB_GZIP}.`);
  return gunzip(new Uint8Array(await r.arrayBuffer()));
}
async function carregarFeats() {
  const bin = atob(FEATS_B64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return gunzip(bytes);
}
function normalizarPhb(item) {
  return {...item, _fonte:'Livro do Jogador (2024)', _natureza:'oficial', _ruleset:item.r || '5.5e'};
}
function normalizarFeat(item) {
  return {...item, _fonte:'Feats v7 — Felix Klaus', _natureza:'terceiros', _ruleset:'outro'};
}
function rotulo(item) {
  return item.c || (item.s ? String(item.s).replaceAll('_',' ') : 'sem subtipo');
}
function textoBusca(item) {
  return semAcento([item.n,item.d,item.s,item.c,...(item.pr||[]),...(item.b||[]),...(item.deps||[])].join(' ')).toLocaleLowerCase('pt-BR');
}
function renderDetalhes(item) {
  const feats = item._fonte.startsWith('Feats v7');
  if (!feats) {
    return `
      <div class="corpo">
        <p>${esc(item.d || 'Sem descrição disponível nesta extração.')}</p>
        <div class="metadados">
          <span><strong>Fonte:</strong> ${esc(item._fonte)}</span>
          ${pagina(item) ? `<span><strong>Localização:</strong> ${esc(pagina(item))}</span>` : ''}
          <span><strong>Ruleset:</strong> D&amp;D ${esc(item._ruleset)}</span>
          <span><strong>Natureza:</strong> ${esc(item._natureza)}</span>
        </div>
      </div>`;
  }
  const lista = (titulo, valores) => valores && valores.length
    ? `<section class="bloco"><h3>${esc(titulo)}</h3><ul>${valores.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></section>` : '';
  return `
    <div class="corpo">
      ${item.c ? `<p><strong>Categoria:</strong> ${esc(item.c)}</p>` : ''}
      ${lista('Pré-requisitos', item.pr)}
      <p><strong>Repetível:</strong> ${esc(repetir(item.rep))}</p>
      ${lista('Benefícios', item.b)}
      ${lista('Condições de perda', item.loss)}
      ${lista('Dependências não resolvidas', item.deps)}
      ${lista('Notas de fidelidade', item.notes)}
      <div class="metadados">
        <span><strong>Fonte:</strong> Feats v7 — Felix Klaus</span>
        <span><strong>Localização:</strong> ${esc(pagina(item))}</span>
        <span><strong>Ruleset:</strong> outro / não declarado de forma unívoca</span>
        <span><strong>Natureza:</strong> terceiros</span>
      </div>
    </div>`;
}
function mostrarModulos(itens) {
  const app = document.getElementById('app');
  const resumo = document.getElementById('resumo');
  const cont = Object.fromEntries(MODULOS.map(m=>[m,0]));
  for (const i of itens) if (MODULOS.includes(i.m)) cont[i.m]++;
  resumo.innerHTML = `<strong>Base mecânica ativa</strong> • Livro do Jogador (2024) + Feats v7 • ${itens.length.toLocaleString('pt-BR')} entidades nos 18 módulos.`;
  app.innerHTML = `<ol class="modulos">${MODULOS.map((m,idx)=>{
    const n=cont[m]||0;
    return `<li class="${n?'':'zero'}"><a href="biblioteca.html?modulo=${encodeURIComponent(m)}"><span>${idx+1}. ${esc(m)}</span><span class="contagem">${n.toLocaleString('pt-BR')} ${n===1?'item':'itens'}</span></a></li>`;
  }).join('')}</ol>`;
}
function mostrarModulo(modulo,itens) {
  const titulo=document.getElementById('titulo');
  const resumo=document.getElementById('resumo');
  const app=document.getElementById('app');
  titulo.textContent=modulo;
  document.title=`${modulo} - Biblioteca - Teias de Anansi`;
  const todos=itens.filter(i=>i.m===modulo).sort((a,b)=>a.n.localeCompare(b.n,'pt-BR'));
  const subtipos=[...new Set(todos.map(rotulo).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const fontes=[...new Set(todos.map(i=>i._fonte))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  resumo.textContent=`${todos.length.toLocaleString('pt-BR')} ${todos.length===1?'entidade':'entidades'} ativas neste módulo.`;
  const aviso = modulo==='Talentos'
    ? `<div class="aviso"><strong>Feats v7:</strong> 28 talentos foram extraídos das páginas 3–7. A publicação é de terceiros e o corpo do PDF não declara um único ruleset canônico; referências externas ausentes foram mantidas como dependências não resolvidas.</div>` : '';
  app.innerHTML = `${aviso}
    <div class="controles">
      <input id="busca" type="search" placeholder="Pesquisar neste módulo..." aria-label="Pesquisar">
      <select id="subtipo"><option value="">Todos os subtipos/categorias</option>${subtipos.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select>
      <select id="fonte"><option value="">Todas as fontes</option>${fontes.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('')}</select>
    </div>
    <p class="resultado" id="resultado"></p><section id="lista"></section>`;
  const busca=document.getElementById('busca'), sub=document.getElementById('subtipo'), fonte=document.getElementById('fonte'), resultado=document.getElementById('resultado'), lista=document.getElementById('lista');
  function render() {
    const termo=semAcento(busca.value.trim()).toLocaleLowerCase('pt-BR');
    const filtrados=todos.filter(i=>(!termo||textoBusca(i).includes(termo))&&(!sub.value||rotulo(i)===sub.value)&&(!fonte.value||i._fonte===fonte.value));
    resultado.textContent=`${filtrados.length.toLocaleString('pt-BR')} de ${todos.length.toLocaleString('pt-BR')}`;
    lista.innerHTML=filtrados.length?filtrados.map(i=>`<details class="item"><summary><strong>${esc(i.n)}</strong><span class="subtipo">${esc(rotulo(i))}</span></summary>${renderDetalhes(i)}</details>`).join(''):'<div class="vazio">Nenhum item corresponde aos filtros atuais.</div>';
  }
  busca.addEventListener('input',render); sub.addEventListener('change',render); fonte.addEventListener('change',render); render();
}
async function iniciar() {
  const params=new URLSearchParams(location.search);
  const modulo=params.get('modulo');
  const app=document.getElementById('app');
  try {
    const [phb,feats]=await Promise.all([carregarPhb(),carregarFeats()]);
    const itens=[...(phb.itens||[]).map(normalizarPhb),...(feats.itens||[]).map(normalizarFeat)].filter(i=>MODULOS.includes(i.m));
    if (!modulo) return mostrarModulos(itens);
    if (!MODULOS.includes(modulo)) {
      document.getElementById('titulo').textContent='Módulo não encontrado';
      document.getElementById('resumo').textContent='';
      app.innerHTML='<div class="erro">Escolha um dos 18 módulos pela Biblioteca.</div>';
      return;
    }
    mostrarModulo(modulo,itens);
  } catch(e) {
    console.error(e);
    document.getElementById('resumo').textContent='Não foi possível carregar a base mecânica.';
    app.innerHTML=`<div class="erro">${esc(e.message||e)}</div>`;
  }
}
iniciar();
</script>
