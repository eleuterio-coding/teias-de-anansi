<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Classes - Biblioteca - Teias de Anansi</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--b:#8885;--soft:#f5f5f5}
*{box-sizing:border-box}html,body{background:#fff;color:#000}body{max-width:1120px;margin:auto;padding:24px;line-height:1.55}a{color:inherit}.muted{opacity:.72}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:18px 0}.card{border:1px solid var(--b);border-radius:10px;padding:13px;text-decoration:none;display:block}.card:hover{background:var(--soft)}.card strong{display:block}.card small{opacity:.65}
.art{border:1px solid var(--b);border-radius:12px;margin-top:24px;padding:16px}.feature{border-left:3px solid #8886;padding-left:11px;margin:12px 0}.feature h4{margin:0}.meta{border-top:1px solid #8883;margin-top:14px;padding-top:10px;font-size:.88rem;opacity:.76}.erro{padding:13px 15px;border:1px solid #b55;border-radius:10px;margin:15px 0}
@media(max-width:650px){body{padding:16px}}
</style>
</head>
<body>
<p><a href="bibliotecas.html?v=20260820-classes-fix2">← Bibliotecas</a></p>
<header><h1>Classes</h1></header>
<div class="grid" id="grid"></div>
<section class="art" id="artifice"><h2>Artífice</h2><p class="muted">Carregando registro...</p></section>
<script>
const CORE=[['Bárbaro','barbarian'],['Bardo','bard'],['Clérigo','cleric'],['Druida','druid'],['Guerreiro','fighter'],['Monge','monk'],['Paladino','paladin'],['Patrulheiro','ranger'],['Ladino','rogue'],['Feiticeiro','sorcerer'],['Bruxo','warlock'],['Mago','wizard']],V='20260820-classes-fix2';
const FN={'Tinker\'s Magic':'Magia de Funileiro','Replicate Magic Item':'Replicar Item Mágico','Magic Item Tinker':'Funileiro de Itens Mágicos','Flash of Genius':'Clarão de Genialidade','Magic Item Adept':'Adepto de Itens Mágicos','Spell-Storing Item':'Item de Armazenar Magia','Magic Item Savant':'Sábio dos Itens Mágicos','Magic Item Master':'Mestre dos Itens Mágicos','Soul of Artifice':'Alma da Artificiaria'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loc=n=>FN[n]||n;
document.getElementById('grid').innerHTML=CORE.map(([n,s])=>`<a class="card" href="classes-v3.html?v=${V}&ref=classes%3Asrd521%3A${s}#ref-classes%3Asrd521%3A${s}"><strong>${n}</strong><small>Classe-base</small></a>`).join('')+`<a class="card" href="#artifice"><strong>Artífice</strong><small>2025</small></a>`;
fetch(`dados/artificer-2025.json?v=${V}`,{cache:'no-store'})
.then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()})
.then(d=>{
 const c=d.classe;
 if(!d?.controle?.completo||!c)throw new Error('Registro incompleto.');
 const feats=(c.caracteristicas||[]).map(f=>`<article class="feature"><h4>${esc(loc(f.nome))}${f.nivel?` — nível ${esc(f.nivel)}`:''}</h4><p>${esc(f.descricao||'')}</p></article>`).join('');
 document.getElementById('artifice').innerHTML=`<h2>Artífice</h2><p>${esc(c.descricao||'Especialista arcano que combina magia, ferramentas e invenções.')}</p><h3>Características</h3>${feats}<div class="meta"><strong>Fonte:</strong> Eberron: Forge of the Artificer (2025) · D&amp;D 5.5e.</div>`;
})
.catch(e=>document.getElementById('artifice').innerHTML=`<h2>Artífice</h2><div class="erro">Falha ao carregar o registro: ${esc(e.message)}</div>`);
</script>
</body>
</html>
