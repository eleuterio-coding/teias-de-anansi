<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--b:#8885;--soft:#f5f5f5}*{box-sizing:border-box}html,body{background:#fff;color:#000}body{max-width:1180px;margin:0 auto;padding:24px;line-height:1.55}a{color:inherit}.muted{opacity:.72}.erro,.vazio{padding:14px 16px;border:1px dashed #8888;border-radius:10px;margin:14px 0}.controles{display:grid;grid-template-columns:minmax(230px,1fr) minmax(180px,260px);gap:10px;margin:18px 0 8px}input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid #8887;border-radius:8px;background:#fff;color:#000}.resultado{opacity:.7;margin:8px 0 14px}.classe{border:1px solid var(--b);border-radius:12px;margin:10px 0;overflow:hidden}.classe>summary{cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:16px;align-items:baseline}.classe>summary:hover{background:var(--soft)}.classe .sub{font-size:.85rem;opacity:.68}.corpo{padding:0 16px 18px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:12px 0}.stat{border:1px solid var(--b);border-radius:9px;padding:9px 10px}.stat strong{display:block;font-size:.78rem;opacity:.7;text-transform:uppercase;letter-spacing:.03em}.bloco{margin-top:18px}.bloco h3{font-size:1.05rem;margin:0 0 8px}.feature{border-left:3px solid #8886;padding:1px 0 1px 12px;margin:11px 0}.feature h4{margin:0 0 4px}.feature p{margin:5px 0;white-space:pre-line}.tabela-wrap{overflow:auto;border:1px solid var(--b);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid #8883}th{position:sticky;top:0;background:#fff;font-size:.82rem}tr:last-child td{border-bottom:0}.meta{border-top:1px solid #8883;margin-top:18px;padding-top:11px;font-size:.88rem;opacity:.78;display:flex;gap:8px 20px;flex-wrap:wrap}.licenca{font-size:.8rem;opacity:.72;margin-top:18px;padding-top:12px;border-top:1px solid #8883}@media(max-width:700px){body{padding:16px}.controles{grid-template-columns:1fr}.classe>summary{display:block}.classe .sub{display:block;margin-top:4px}}
</style>
</head>
<body>
<p><a href="bibliotecas.html?v=20260820-classes-home1">← Bibliotecas</a></p>
<header><h1>Classes — 5.5e</h1></header>
<div class="controles"><input id="busca" type="search" placeholder="Buscar classe, atributo ou característica..."><select id="filtro"><option value="">Todas as classes</option><option value="conjurador">Com conjuração</option><option value="nao-conjurador">Sem conjuração</option></select></div>
<p class="resultado" id="resultado">Carregando...</p><main id="lista"></main>
<script>
const PIN='bfd3db4bcc31699cce703b46feb9af3f0ff08999',RAW=`https://raw.githubusercontent.com/5e-bits/5e-database/${PIN}/src/2024/en`,V='20260820-classes-home1';
const EXPECTED=['barbarian','bard','cleric','druid','fighter','monk','paladin','ranger','rogue','sorcerer','warlock','wizard'];
const LOCFILES={barbarian:'barbaro',bard:'bardo',cleric:'clerigo',druid:'druida',fighter:'guerreiro',monk:'monge',paladin:'paladino',ranger:'patrulheiro',rogue:'ladino',sorcerer:'feiticeiro',warlock:'bruxo',wizard:'mago'};
const DESCR={barbarian:'Guerreiro movido por poder primal e Fúria, especializado em resistência e pressão ofensiva.',bard:'Conjurador e especialista versátil que combina inspiração, perícias, suporte e controle.',cleric:'Campeão de poder divino que combina magia, proteção, cura e combate.',druid:'Conjurador primal ligado à natureza, transformação, suporte e controle.',fighter:'Especialista marcial completo, treinado em armas, armaduras, maestrias e técnicas de combate.',monk:'Artista marcial móvel que converte disciplina e foco em defesa, mobilidade e golpes precisos.',paladin:'Guerreiro sagrado que combina juramentos, proteção, cura, armas e magia divina.',ranger:'Guerreiro explorador que combina perícia marcial, mobilidade, rastreamento e magia primal.',rogue:'Especialista em precisão, furtividade, mobilidade e perícias.',sorcerer:'Conjurador de poder inato que molda magia por Carisma e Metamagia.',warlock:'Ocultista de pactos e invocações, com progressão mágica própria e alta personalização.',wizard:'Estudioso da magia arcana, baseado em grimório, preparação e ampla versatilidade.'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),arr=v=>Array.isArray(v)?v:[],fold=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR');let G={},LOC={},DATA=[];
async function json(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
function t(v){if(v==null)return'';let s=String(v);const grupos=[G.classes,G.atributos,G.pericias,G.condicoes,G.danos,G.tamanhos,G.tipos_criatura,G.alinhamentos,G.acoes,G.regras,G.armas,G.armaduras,G.raridades];for(const d of grupos)for(const[k,val]of Object.entries(d||{}))s=s.replace(new RegExp(`\\b${k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'g'),val);return s}
function nomes(v){return arr(v).map(x=>t(x?.name||x?.desc||String(x))).filter(Boolean).join(', ')}
function primary(c){return t(c.primary_ability?.desc||nomes(c.primary_ability?.ability_scores)||'—')}
function levelsFor(levels,slug){const seen=new Set();return arr(levels).filter(x=>x?.class?.index===slug||String(x?.index||'').startsWith(`${slug}-`)).sort((a,b)=>Number(a.level)-Number(b.level)).filter(x=>{const n=Number(x.level);if(n<1||n>20||seen.has(n))return false;seen.add(n);return true})}
function featureLoc(slug,f){const feats=LOC[slug]?.features||{};if(feats[f.index])return feats[f.index];let key=String(f.index||'').replace(/-\d+$/,'');if(feats[key])return feats[key];key=key.replace(/-(improved|greater|superior)-/,'-');if(feats[key])return feats[key];console.warn('[Classes] localização ausente:',slug,f.index,f.name);return{nome:'Característica adicional',descricao:`Característica de ${LOC[slug]?.nome||'classe'} presente na progressão desta classe. Consulte a fonte indicada para o detalhamento específico.`}}
function featureList(levels,slug,fmap){const first={},ids=[];for(const l of levelsFor(levels,slug))for(const f of arr(l.features)){if(first[f.index]===undefined)first[f.index]=l.level;if(!ids.includes(f.index))ids.push(f.index)}return ids.map(id=>{const raw=fmap.get(id)||{index:id,name:id};const loc=featureLoc(slug,raw);return{...loc,index:id,_nivel:first[id]}})}
function choiceText(x){const n=Number(x?.choose||x?.count||0),opts=arr(x?.from?.options).flatMap(o=>o?.item?.name?[o.item.name]:o?.items?arr(o.items).map(i=>i.name):o?.choice?arr(o.choice?.from?.options).map(q=>q?.item?.name).filter(Boolean):[]).filter(Boolean);return opts.length?`Escolha ${n||1}: ${opts.map(t).join(', ')}`:t(x?.desc||'Escolha conforme a fonte.')}
function equipmentText(c){const opts=arr(c.starting_equipment_options);return opts.length?opts.map(o=>t(o.desc||choiceText(o))).join(' • '):'Consulte as opções de equipamento inicial da classe na fonte.'}
function prereq(c){const mc=c.multi_classing||{},out=arr(mc.prerequisites).map(x=>`${t(x.ability_score?.name||'?')} ${x.minimum_score??''}`.trim());if(!out.length&&mc.prerequisite_options?.from?.options)out.push(choiceText(mc.prerequisite_options));return out.filter(Boolean).join('; ')||'Nenhum requisito adicional publicado.'}
function normalize(c,levels,fmap){const ls=levelsFor(levels,c.index);if(ls.length!==20)console.warn('[Classes] progressão incompleta:',c.index,ls.length);return{slug:c.index,nome:LOC[c.index]?.nome||t(c.name),descricao:DESCR[c.index]||'',dados:c,levels:ls,features:featureList(levels,c.index,fmap),caster:!!c.spellcasting}}
function progress(i){const metrics=[...new Set(i.levels.flatMap(l=>Object.keys(l.class_specific||{})))];return`<div class="tabela-wrap"><table><thead><tr><th>Nível</th><th>BP</th><th>Características</th>${metrics.map(k=>`<th>${esc(t(k.replaceAll('_',' ')))}</th>`).join('')}</tr></thead><tbody>${i.levels.map(l=>`<tr><td>${l.level}</td><td>+${l.prof_bonus}</td><td>${esc(arr(l.features).map(f=>featureLoc(i.slug,f).nome).join(', ')||'—')}</td>${metrics.map(k=>`<td>${esc(l.class_specific?.[k]??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function renderClass(i){const c=i.dados,mc=c.multi_classing||{},profChoices=arr(c.proficiency_choices).map(choiceText).filter(Boolean).join(' • ')||'—';return`<div class="corpo"><p>${esc(i.descricao)}</p><div class="stats"><div class="stat"><strong>Atributo principal</strong>${esc(primary(c))}</div><div class="stat"><strong>Dado de Vida</strong>d${esc(c.hit_die)}</div><div class="stat"><strong>Testes de resistência</strong>${esc(nomes(c.saving_throws))}</div><div class="stat"><strong>Subclasse SRD</strong>${esc(nomes(c.subclasses)||'—')}</div></div><section class="bloco"><h3>Proficiências</h3><p><strong>Fixas:</strong> ${esc(nomes(c.proficiencies)||'—')}</p><p><strong>Escolhas:</strong> ${esc(profChoices)}</p></section><section class="bloco"><h3>Equipamento inicial</h3><p>${esc(equipmentText(c))}</p></section><section class="bloco"><h3>Multiclasse</h3><p><strong>Pré-requisito:</strong> ${esc(prereq(c))}</p>${nomes(mc.proficiencies)?`<p><strong>Proficiências obtidas:</strong> ${esc(nomes(mc.proficiencies))}</p>`:''}</section><section class="bloco"><h3>Progressão — níveis 1–20</h3>${progress(i)}</section><section class="bloco"><h3>Características da classe</h3>${i.features.map(f=>`<article class="feature"><h4>${esc(f.nome)} <span class="muted">— nível ${esc(f._nivel)}</span></h4><p>${esc(f.descricao)}</p></article>`).join('')}</section><div class="meta"><span><strong>Regras:</strong> 5.5e</span><span><strong>Revisão:</strong> 2024</span><span><strong>Idioma:</strong> português brasileiro</span></div></div>`}
function render(){const q=fold(document.getElementById('busca').value.trim()),filter=document.getElementById('filtro').value,items=DATA.filter(i=>(!filter||(filter==='conjurador'?i.caster:!i.caster))&&(!q||fold([i.nome,i.descricao,...i.features.flatMap(f=>[f.nome,f.descricao])].join(' ')).includes(q)));document.getElementById('resultado').textContent=`${items.length} de ${DATA.length} classes`;const lista=document.getElementById('lista');lista.innerHTML=items.map(i=>`<details class="classe" data-hub-entity-id="classes:srd521:${esc(i.slug)}" id="ref-classes:srd521:${esc(i.slug)}"><summary><strong>${esc(i.nome)}</strong><span class="sub">d${esc(i.dados.hit_die)} • ${esc(primary(i.dados))}</span></summary><div class="slot"></div></details>`).join('')||'<div class="vazio">Nenhuma classe corresponde aos filtros.</div>';lista.querySelectorAll('details.classe').forEach(d=>d.addEventListener('toggle',()=>{if(d.open&&!d.dataset.rendered){const slug=d.dataset.hubEntityId.split(':').pop(),i=DATA.find(x=>x.slug===slug);d.querySelector('.slot').innerHTML=renderClass(i);d.dataset.rendered='1'}}));abrirRef()}
function abrirRef(){const ref=new URLSearchParams(location.search).get('ref');if(!ref)return;const slug=ref.split(':').pop(),el=document.getElementById(`ref-classes:srd521:${slug}`);if(el){el.open=true;el.scrollIntoView({block:'start'})}}
(async()=>{try{const locUrls=EXPECTED.map(s=>`dados/classes-ptbr/${LOCFILES[s]}.json?v=${V}`),res=await Promise.all([json('dados/localizacao-ptbr-global.json?v='+V),...locUrls.map(json),json(`${RAW}/5e-SRD-Classes.json`),json(`${RAW}/5e-SRD-Levels.json`),json(`${RAW}/5e-SRD-Features.json`)]);G=res[0];for(let i=0;i<EXPECTED.length;i++)LOC[EXPECTED[i]]=res[1+i];const classes=res[1+EXPECTED.length],levels=res[2+EXPECTED.length],features=res[3+EXPECTED.length],fmap=new Map(arr(features).map(f=>[f.index,f]));DATA=arr(classes).filter(c=>EXPECTED.includes(c.index)).map(c=>normalize(c,levels,fmap)).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));render()}catch(e){document.getElementById('resultado').textContent='Falha ao carregar as classes';document.getElementById('lista').innerHTML=`<div class="erro">Não foi possível carregar o módulo. ${esc(e.message)}</div>`;console.error(e)}})();
document.getElementById('busca').addEventListener('input',render);document.getElementById('filtro').addEventListener('change',render);
</script>
