<!DOCTYPE html>

<head>

  <title>Regras - Biblioteca - Teias de Anansi</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--b:#8885;--soft:#8881}
    *{box-sizing:border-box}body{max-width:1120px;margin:auto;padding:24px;line-height:1.55}a{color:inherit}.muted{opacity:.7}
    .controles{display:grid;grid-template-columns:minmax(260px,1fr) 230px;gap:10px;margin:18px 0}
    input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid #8887;border-radius:8px;background:transparent;color:inherit}
    .item{border:1px solid var(--b);border-radius:11px;margin:10px 0;overflow:hidden}.item>summary{cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
    .item>summary:hover{background:var(--soft)}.item>summary>span:first-child{display:flex;flex-direction:column}.original{font-weight:400;opacity:.64;margin-top:2px}
    .badge{display:inline-block;border:1px solid var(--b);border-radius:999px;padding:3px 9px;font-size:.82rem;white-space:nowrap}
    .corpo{padding:0 16px 16px}.source-strip{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:.82rem;opacity:.72;margin:0 0 12px}
    .secao-regra{margin:16px 0}.secao-regra h3{font-size:1rem;margin:0 0 5px}.secao-regra p{margin:0}
    .house-override{border:1px solid #8888;border-left:4px solid currentColor;border-radius:8px;padding:11px 13px;margin:16px 0}.house-override p{margin:6px 0 0}
    .copyright-note{padding:10px 12px;border-left:3px solid #8888}.meta{border-top:1px solid #8883;margin-top:14px;padding-top:10px;font-size:.9rem;opacity:.8;display:flex;gap:8px 18px;flex-wrap:wrap}
    .erro{padding:16px;border:1px solid #b55;border-radius:10px}.hub-ref-target{outline:2px solid currentColor;outline-offset:4px}
    @media(max-width:800px){body{padding:16px}.controles{grid-template-columns:1fr}.item>summary{display:block}.badge{margin-top:7px}}
  </style>
</head>
