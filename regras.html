<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Regras - Biblioteca - Teias de Anansi</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--b:#8885;--soft:#8881}
    *{box-sizing:border-box} body{max-width:1120px;margin:auto;padding:24px;line-height:1.55} a{color:inherit}.muted{opacity:.74}
    .nota{padding:12px 14px;border:1px dashed #8888;border-radius:10px;margin:14px 0}.badges{display:flex;gap:8px;flex-wrap:wrap}
    .badge{display:inline-block;border:1px solid var(--b);border-radius:999px;padding:3px 9px;font-size:.82rem}.controles{display:grid;grid-template-columns:1fr 240px;gap:10px;margin:18px 0}
    .controles input,.controles select{width:100%;font:inherit;padding:10px 12px;border:1px solid #8887;border-radius:8px;background:transparent;color:inherit}
    .item{border:1px solid var(--b);border-radius:11px;margin:10px 0;overflow:hidden}.item summary{cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
    .item summary:hover{background:var(--soft)}.corpo{padding:0 16px 16px}.original{font-size:.9rem;opacity:.68;margin:.2rem 0 .8rem}.secao-regra{margin:16px 0}.secao-regra h3{font-size:1rem;margin:0 0 5px}.secao-regra p{margin:0}
    .meta{border-top:1px solid #8883;margin-top:14px;padding-top:10px;font-size:.9rem;opacity:.78;display:flex;gap:8px 18px;flex-wrap:wrap}
    .erro{padding:16px;border:1px solid #b55;border-radius:10px}@media(max-width:700px){body{padding:16px}.controles{grid-template-columns:1fr}.item summary{display:block}.item summary .badge{margin-top:6px}}
  </style>
</head>
<body>
  <p><a href="bibliotecas.html?v=20260819-1648">← Bibliotecas</a></p>
  <header><h1>Regras</h1></header>

  <div class="controles"><input id="busca" type="search" placeholder="Buscar regra, termo original ou descrição..."><select id="filtro"><option value="">Todas</option></select></div>
  <div id="resultado" class="muted"></div>
  <main id="lista"></main>

<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const textoBusca=x=>[x.nome,x.original,x.familia,x.descricao,...(x.secoes||[]).flatMap(s=>[s.titulo,s.texto])].join(' ');
let DATA=null,ALL=[];
function render(){
  const q=norm(document.getElementById('busca').value.trim()),f=document.getElementById('filtro').value;
  const rows=ALL.filter(x=>(!f||x.familia===f)&&(!q||norm(textoBusca(x)).includes(q)));
  document.getElementById('resultado').textContent=`${rows.length} de ${ALL.length} itens`;
  document.getElementById('lista').innerHTML=rows.map(x=>{
    const fonte=x.fonte||DATA.fonte;
    const link=fonte.url?`<span><a href="${esc(fonte.url)}" target="_blank" rel="noopener noreferrer">${esc(fonte.rotulo||'Abrir fonte oficial')}</a></span>`:'';
    const secoes=(x.secoes||[]).map(s=>`<section class="secao-regra"><h3>${esc(s.titulo)}</h3><p>${esc(s.texto)}</p></section>`).join('');
    return `<details class="item"><summary><strong>${esc(x.nome)}</strong><span class="badge">${esc(x.familia)}</span></summary><div class="corpo"><p class="original"><b>Original:</b> ${esc(x.original)}</p><p>${esc(x.descricao)}</p>${secoes}<div class="meta"><span><b>Tipo:</b> Regras</span><span><b>Fonte:</b> ${esc(fonte.livro)}</span><span><b>Edição:</b> ${esc(fonte.edicao)}</span>${link}</div></div></details>`;
  }).join('')||'<p class="nota">Nenhuma regra corresponde aos filtros.</p>';
}
(async()=>{
  try{
    const urls=[1,2,3,4].map(n=>`dados/regras-dndbeyond-2024.part${n}.txt?v=20260819-1530`);
    const [rs,hubResponse,extraResponse]=await Promise.all([
      Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}))),
      fetch('dados/regras-hub.json?v=20260819-1648',{cache:'no-store'}),
      fetch('dados/regras-casa-adicionais.json?v=20260819-1648',{cache:'no-store'})
    ]);
    const bad=rs.find(r=>!r.ok);if(bad)throw new Error(`HTTP ${bad.status}`);
    if(!hubResponse.ok)throw new Error(`HTTP ${hubResponse.status} ao carregar Regras da Casa`);
    if(!extraResponse.ok)throw new Error(`HTTP ${extraResponse.status} ao carregar Regras da Casa adicionais`);
    const text=(await Promise.all(rs.map(r=>r.text()))).join('');
    DATA=JSON.parse(text);
    const HUB=await hubResponse.json();
    const EXTRA=await extraResponse.json();
    ALL=[...(DATA.itens||[])];

    for(const patch of HUB.sobreposicoes||[]){
      const item=ALL.find(x=>x.original===patch.original);
      if(!item)throw new Error(`regra para sobreposição não encontrada: ${patch.original}`);
      Object.assign(item,patch);
    }

    for(const extraOriginal of [...(HUB.itens||[]),...(EXTRA.itens||[])]){
      const extra={...extraOriginal};
      const depois=extra.inserir_depois_de;
      delete extra.inserir_depois_de;
      const idx=depois?ALL.findIndex(x=>x.original===depois):-1;
      if(idx>=0)ALL.splice(idx+1,0,extra);else ALL.push(extra);
    }

    if(ALL.length!==159)throw new Error(`catálogo incompleto: ${ALL.length}/159`);
    const familias=['Regra Geral','Regra da Casa',...DATA.familias.filter(f=>f!=='Regra Geral'&&f!=='Regra da Casa')];
    const rotulos={
      'Regra Geral':'Regras Gerais',
      'Regra da Casa':'Regras da Casa',
      'Ação':'Ações',
      'Área de Efeito':'Áreas de Efeito',
      'Atitude':'Atitudes',
      'Condição':'Condições',
      'Perigo':'Perigos'
    };
    document.getElementById('filtro').innerHTML='<option value="">Todas</option>'+familias.map(f=>`<option value="${esc(f)}">${esc(rotulos[f]||f)}</option>`).join('');
    render();
  }catch(e){
    document.getElementById('lista').innerHTML=`<p class="erro"><strong>Falha ao carregar:</strong> ${esc(e.message)}</p>`;
  }
})();
document.getElementById('busca').addEventListener('input',render);
document.getElementById('filtro').addEventListener('change',render);
</script>
</body>
</html>
